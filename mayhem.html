<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mayhem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0A0E1C; --bg2:#0E1428; --card:#151D38; --card2:#1B2547; --line:#28345E; --line2:#35447E;
  --ink:#EAEEF8; --muted:#8A94B8; --dim:#5A6488;
  --gold:#E3B75B; --gold-dim:#8F7433; --cyan:#5FC9E8; --green:#5BC4A0; --ox:#C64B5E; --amber:#E8A15F;
  --pl:#A67FC0; --wk:#D4A040; --lr:#E0724C; --ke:#4F9ED9; --pdv:#D14F5E;
}
*{box-sizing:border-box; margin:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 500px at 80% -10%, #131D3A 0%, transparent 55%), var(--bg);
  color:var(--ink); font-family:Manrope,"Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; -webkit-tap-highlight-color:transparent}
input,select{font-family:inherit; font-size:16px; background:var(--bg2); color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:11px 12px; width:100%}
input:focus,select:focus{outline:1px solid var(--gold-dim); border-color:var(--gold-dim)}
.mono{font-family:"IBM Plex Mono",monospace}
.serif{font-family:Marcellus,Georgia,serif}

/* ————— header: wordmark + brand rail + dma rail ————— */
header{position:sticky; top:0; z-index:40; background:rgba(10,14,28,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); padding:10px 0 0}
.hrow{display:flex; align-items:center; gap:12px; padding:0 16px 8px; max-width:1060px; margin:0 auto}
.wm{font-family:Marcellus,serif; font-size:19px; letter-spacing:.28em; white-space:nowrap}
.wm b{color:var(--gold); font-weight:400}
.hdate{margin-left:auto; font-size:11px; color:var(--muted); text-align:right; line-height:1.3}
.hdate b{color:var(--gold)}
.rail{display:flex; gap:8px; overflow-x:auto; padding:2px 16px 10px; scrollbar-width:none; max-width:1060px; margin:0 auto; width:100%}
.rail::-webkit-scrollbar{display:none}
.bchip{flex:none; display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:22px;
  border:1px solid var(--line); font-size:13px; font-weight:700; color:var(--muted); background:var(--bg2)}
.bchip .d{width:9px; height:9px; border-radius:50%}
.bchip.on{color:var(--ink); border-color:currentColor}
.dmarail{border-top:1px dashed rgba(40,52,94,.6)}
.dchip{flex:none; padding:6px 13px; border-radius:18px; border:1px solid var(--line); font-size:12px; font-weight:600; color:var(--muted)}
.dchip.on{color:var(--gold); border-color:var(--gold-dim); background:var(--bg2)}

main{max-width:1060px; margin:0 auto; padding:18px 16px 30px}

/* ————— bottom tab bar ————— */
#tabs{position:fixed; left:0; right:0; bottom:0; z-index:45; background:rgba(12,16,32,.96); backdrop-filter:blur(12px);
  border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1; padding:11px 4px 9px; text-align:center; color:var(--dim); font-size:11px; font-weight:700; letter-spacing:.06em}
#tabs button .ic{display:block; font-size:19px; margin-bottom:2px; line-height:1}
#tabs button.on{color:var(--gold)}
#tabs .badge{display:inline-block; min-width:17px; background:var(--ox); color:#fff; font-size:10px; border-radius:9px; padding:1px 5px; margin-left:4px; vertical-align:2px}

/* ————— voice ————— */
.voice{margin:4px 0 18px}
.voice .who{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:5px}
.voice .say{font-family:Marcellus,serif; font-size:17.5px; line-height:1.55; text-wrap:balance}
.voice .say em{color:var(--gold); font-style:normal}

/* ————— judgment cards ————— */
.jstack{display:grid; gap:10px; margin-bottom:24px}
.sechead{display:flex; align-items:baseline; gap:10px; margin:0 0 10px}
.sechead h2{font-family:Marcellus,serif; font-size:16px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold)}
.sechead .sub{font-size:11.5px; color:var(--dim)}
.jcard{display:flex; gap:12px; align-items:flex-start; text-align:left; background:var(--card); border:1px solid var(--line);
  border-left:4px solid var(--gold); border-radius:12px; padding:14px 15px; width:100%}
.jcard.red{border-left-color:var(--ox)}
.jcard:active{background:var(--card2)}
.jcard .jt{font-size:14.5px; font-weight:800; line-height:1.3}
.jcard .js{font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.45}
.jcard .go{margin-left:auto; align-self:center; flex:none; color:var(--gold); font-size:18px}
.allclear{background:var(--card); border:1px dashed var(--line2); border-radius:12px; padding:16px; color:var(--muted); font-size:13.5px; font-style:italic}

/* ————— agenda ————— */
.dayhead{display:flex; align-items:baseline; gap:10px; margin:18px 0 8px}
.dayhead .d{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--gold); letter-spacing:.05em}
.dayhead .dw{font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.1em}
.dayhead.today .d{color:var(--cyan)}
.arow{display:flex; gap:11px; align-items:center; background:var(--card); border:1px solid var(--line);
  border-radius:10px; padding:11px 13px; width:100%; text-align:left; margin-bottom:7px}
.arow:active{background:var(--card2)}
.arow .bd{width:10px; height:10px; border-radius:50%; flex:none}
.arow .k{flex:none; font-size:13px; width:18px; text-align:center; color:var(--muted)}
.arow .tx{flex:1; min-width:0}
.arow .tx b{font-size:13.5px; display:block; line-height:1.3}
.arow .tx span{font-size:11.5px; color:var(--muted)}
.arow.late{border-left:3px solid var(--ox)}
.arow .st{flex:none; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; border-radius:4px; padding:2px 7px}
.st.late{background:#4A1F26; color:#F08A9A}.st.open{background:#233158; color:#9FB4E8}
.st.got{background:#173A31; color:#6FE0B8}.st.wait{background:#3A2A17; color:#E8B96F}.st.done{background:#173A31; color:#6FE0B8}

/* ————— month calendar ————— */
.calhead{display:flex; align-items:center; gap:10px; margin:2px 0 10px}
.calhead .cm{font-family:Marcellus,serif; font-size:18px; letter-spacing:.05em}
.calhead .cn{width:34px; height:34px; border-radius:9px; border:1px solid var(--line); color:var(--muted); font-size:15px}
.calhead .cn:active{color:var(--gold)}
.calhead .ov{margin-left:auto}
.ovchip{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; letter-spacing:.05em;
  color:#F08A9A; border:1px solid #5A2630; background:#2A151B; border-radius:16px; padding:5px 11px}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal .dw{font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); text-align:center; padding:3px 0}
.cd{aspect-ratio:.82; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:5px 4px 4px;
  display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0}
.cd.out{opacity:.28}
.cd.today{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold-dim)}
.cd .n{font-size:11px; font-family:"IBM Plex Mono",monospace; color:var(--muted); line-height:1}
.cd.today .n{color:var(--gold); font-weight:700}
.cd .pips{display:flex; flex-wrap:wrap; gap:2.5px; justify-content:center; align-content:flex-start; flex:1}
.cd .pip{width:6px; height:6px; border-radius:50%}
.cd .pip.anc{width:0; height:0; border:none; font-size:9px; line-height:6px; color:var(--gold); width:auto; height:auto}
.cd .pip.lt{box-shadow:0 0 4px 1px rgba(198,75,94,.8)}
.cd:active{background:var(--card2)}
@media(min-width:900px){ .cd{aspect-ratio:1.15} .cd .pip{width:7px; height:7px} }

/* ————— brands screen ————— */
.brandsec{margin-bottom:26px}
.brandsec>button.bh{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:0 0 8px;
  border-bottom:1px solid var(--line); margin-bottom:12px}
.brandsec .bh h2{font-family:Marcellus,serif; font-size:20px; letter-spacing:.04em}
.brandsec .bh .d{width:11px; height:11px; border-radius:50%}
.brandsec .bh .meta{margin-left:auto; font-size:11.5px; color:var(--dim); text-align:right; line-height:1.35}
.dmasec{margin:0 0 14px}
.dmasec h3{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:8px}
.ccard{display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:13px 15px; margin-bottom:9px}
.ccard:active{background:var(--card2)}
.ccard .top{display:flex; align-items:center; gap:9px}
.ccard .top b{font-size:15px}
.pill{font-size:9.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; border-radius:12px; padding:2px 9px; flex:none; margin-left:auto}
.p-pre{background:#233158; color:#9FB4E8}.p-live{background:#173A31; color:#6FE0B8}
.p-wrapped{background:#22283C; color:#9AA4C8}.p-dec{background:#3A1F33; color:#E08AC8}
.ccard .meta{font-size:12px; color:var(--muted); margin:4px 0 8px}
.ccard .next{font-size:12.5px; background:var(--bg2); border-radius:8px; padding:7px 10px}
.ccard .next .mono{color:var(--gold); font-size:11px}
.ccard .next.red{border-left:3px solid var(--ox)}
.grid2{display:grid; gap:0}
@media(min-width:900px){
  .grid2{grid-template-columns:1fr 1fr; gap:0 26px}
  .todaygrid{display:grid; grid-template-columns:.95fr 1.05fr; gap:0 30px; align-items:start}
}

/* ————— commitment: the line ————— */
.cback{display:inline-flex; align-items:center; gap:7px; color:var(--cyan); font-size:13px; font-weight:700; margin-bottom:12px}
.chead{margin-bottom:6px}
.chead h1{font-family:Marcellus,serif; font-size:26px; letter-spacing:.02em; line-height:1.15; display:flex; align-items:center; gap:10px}
.chead h1 .d{width:12px; height:12px; border-radius:50%; flex:none}
.chead .facts{font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.5}
.chead .facts b{color:var(--ink)}
.csay{font-family:Marcellus,serif; font-size:15px; color:var(--gold); line-height:1.55; margin:10px 0 16px}
.phase{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:20px}
.phase div{flex:1; text-align:center; padding:7px 2px; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); background:var(--bg2)}
.phase div.done{color:var(--muted); background:var(--card)}
.phase div.now{color:#141007; background:var(--gold); font-weight:800}

.metro{position:relative; padding-left:104px; margin-bottom:8px}
.metro::before{content:""; position:absolute; left:76px; top:8px; bottom:8px; width:2px;
  background:linear-gradient(180deg, var(--line2), var(--gold-dim))}
.stop{position:relative; padding:0 0 18px 26px}
.stop .dt{position:absolute; left:-104px; width:72px; text-align:right; top:1px}
.stop .dt .m{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted); display:block}
.stop .dt .y{font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em}
.stop::before{content:""; position:absolute; left:-33px; top:3px; width:12px; height:12px; border-radius:50%;
  background:var(--cyan); border:3px solid var(--bg); box-shadow:0 0 0 1.5px var(--cyan)}
.stop.done::before{background:var(--green); box-shadow:0 0 0 1.5px var(--green)}
.stop.late::before{background:var(--ox); box-shadow:0 0 0 1.5px var(--ox), 0 0 10px rgba(198,75,94,.6)}
.stop.anchor::before{width:18px; height:18px; left:-36px; top:0; background:var(--gold); box-shadow:0 0 0 2px var(--gold), 0 0 14px rgba(227,183,91,.5)}
.stop.wrapstop::before{background:var(--bg2); box-shadow:0 0 0 1.5px var(--dim)}
.stop button.sb{display:block; width:100%; text-align:left}
.stop .sl{font-size:14px; font-weight:700; line-height:1.3}
.stop.anchor .sl{font-family:Marcellus,serif; font-size:17px; color:var(--gold); font-weight:400}
.stop .so{font-size:11.5px; color:var(--muted); margin-top:2px}
.stop .lane{display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  border:1px solid var(--line2); color:var(--muted); border-radius:4px; padding:1px 6px; margin-top:4px}
.todaymark{position:relative; padding:2px 0 16px 26px}
.todaymark::before{content:""; position:absolute; left:-70px; right:0; top:8px; border-top:1.5px dashed var(--gold)}
.todaymark span{position:relative; background:var(--bg); padding:0 8px 0 0; font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--gold); font-weight:800}

.seg{display:flex; gap:6px; margin:18px 0 12px; overflow-x:auto; scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none; padding:8px 15px; border-radius:20px; border:1px solid var(--line); font-size:12.5px; font-weight:700; color:var(--muted)}
.seg button.on{color:var(--gold); border-color:var(--gold-dim); background:var(--bg2)}
.panel .row{display:flex; gap:10px; align-items:baseline; padding:9px 2px; font-size:13.5px; border-bottom:1px dashed rgba(40,52,94,.6)}
.panel .row:last-child{border:none}
.panel .row .mono{color:var(--gold); font-size:11.5px; flex:none; min-width:78px}
.panel .row .mu{color:var(--muted); font-size:11.5px; display:block}
.cbtns{display:flex; gap:9px; margin-top:18px; flex-wrap:wrap}
.btn{background:var(--card2); border:1px solid var(--line2); color:var(--ink); border-radius:9px;
  padding:10px 16px; font-weight:700; font-size:13px}
.btn.gold{background:var(--gold); color:#191207; border-color:var(--gold)}

/* ————— intake ————— */
.feed{display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line);
  border-radius:11px; padding:13px 14px; margin-bottom:9px; text-align:left; width:100%}
.feed:active{background:var(--card2)}
.feed .fi{font-size:20px; flex:none}
.feed b{display:block; font-size:14px}
.feed span{font-size:11.5px; color:var(--muted)}
.receipt{background:#12281F; border:1px solid #1F5C46; color:#8FE0BE; border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:8px}
.receipt .mono{color:#5BC4A0; font-size:10.5px; display:block}
.conflict{background:#33202A; border:1px solid #7A3A50; border-radius:10px; padding:13px 14px; margin:10px 0}
.conflict h4{font-size:13px; color:#F0A0B4; margin-bottom:8px}
.copt{display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:9px 10px; border:1px solid transparent; border-radius:8px; font-size:13.5px}
.copt.on{border-color:var(--gold-dim); background:var(--bg2)}
.copt .r{width:15px; height:15px; border-radius:50%; border:2px solid var(--dim); flex:none}
.copt.on .r{border-color:var(--gold); background:var(--gold)}
.f2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px}
.f1{margin-bottom:10px}
label{display:block; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:4px}
.chipn{display:inline-flex; border:1px solid var(--line); border-radius:20px; padding:7px 14px; font-size:13px; color:var(--muted); margin:0 6px 7px 0}
.chipn.on{color:var(--ink); border-color:var(--gold-dim); background:var(--bg2)}
.formcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:17px 16px; margin-bottom:14px}
.formcard h2{font-family:Marcellus,serif; font-size:17px; letter-spacing:.06em; margin-bottom:12px}
@media(min-width:900px){ .intakegrid{display:grid; grid-template-columns:1.05fr .95fr; gap:22px; align-items:start} }

/* ————— bottom sheet ————— */
#sheetbg{position:fixed; inset:0; z-index:60; background:rgba(4,6,14,.6); backdrop-filter:blur(3px)}
#sheetbg.hide{display:none}
#sheet{position:fixed; left:0; right:0; bottom:0; z-index:61; background:linear-gradient(180deg,#182140,#111832);
  border-top:1px solid var(--line2); border-radius:18px 18px 0 0; max-height:86vh; overflow:auto;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .32s cubic-bezier(.3,0,.2,1)}
#sheet.up{transform:translateY(0)}
@media(min-width:900px){ #sheet{left:50%; right:auto; width:620px; transform:translate(-50%,100%)} #sheet.up{transform:translate(-50%,0)} }
#sheet .grab{width:38px; height:4px; border-radius:2px; background:var(--line2); margin:4px auto 14px}
#sheet .lk{font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold-dim); margin-bottom:7px}
#sheet h2{font-family:Marcellus,serif; font-size:20px; line-height:1.3; margin-bottom:9px}
#sheet .body{font-size:14px; line-height:1.6}
#sheet .body .q{color:var(--muted)}
.why{margin:13px 0}
.why .step{display:flex; gap:11px; padding:8px 0; border-bottom:1px dashed rgba(40,52,94,.7); font-size:13px; align-items:baseline}
.why .step:last-child{border:none}
.why .mono{color:var(--gold); font-size:11px; flex:none; min-width:80px}
.mail{margin-top:13px; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.mail .mh{background:var(--bg2); padding:9px 13px; font-size:12px}
.mail .mh b{color:var(--muted); display:inline-block; width:56px; font-weight:600}
.mail .mb{background:#F4F2EC; color:#2A2C33; padding:14px 15px; font-size:13px; line-height:1.6; white-space:pre-wrap}
.rulerow{display:flex; gap:10px; margin-top:16px}
.rule{flex:1; border-radius:10px; padding:13px 10px; font-weight:800; font-size:14px; text-align:center}
.rule.go{background:var(--gold); color:#191207}
.rule.alt{border:1px solid var(--line2); color:var(--ink)}
/* tickets + library */
.stepper{display:flex; gap:4px; margin:8px 0 2px}
.stepper span{flex:1; text-align:center; font-size:8.5px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--dim); border-top:3px solid var(--line); padding-top:4px}
.stepper span.done{color:var(--green); border-color:var(--green)}
.stepper span.now{color:var(--gold); border-color:var(--gold)}
.stepper span.bad{color:var(--ox); border-color:var(--ox)}
.tcard{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 14px; margin-bottom:9px}
.tcard .tt{font-size:13.5px; font-weight:800}
.tcard .ts{font-size:11.5px; color:var(--muted); margin-top:2px}
.doctrine{display:flex; gap:5px; flex-wrap:wrap; margin:10px 0}
.doctrine span{font-size:10px; font-weight:700; letter-spacing:.04em; border:1px solid var(--line); color:var(--dim);
  border-radius:14px; padding:4px 10px}
.doctrine span.hit{color:var(--gold); border-color:var(--gold-dim); background:var(--bg2)}
.libcard{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:13px 15px; margin-bottom:9px}
.libcard .lt{font-size:13.5px; font-weight:800; display:flex; align-items:center; gap:8px}
.libcard .lx{font-size:12.5px; color:var(--muted); margin-top:4px; line-height:1.5}
.libcard .lm{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--dim); margin-top:6px}
.libcard .use{margin-top:8px}
.rowbtn{flex:none; font-size:11px; font-weight:800; color:var(--cyan); border:1px solid var(--line2); border-radius:7px; padding:5px 10px}
.rowbtn:active{color:var(--gold)}
.utm{background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin-bottom:8px}
.utm .uc{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--cyan); word-break:break-all; line-height:1.5}
.utm .ul{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:3px}
.prodrow{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 4px}
#toast{position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--gold); color:#151007;
  font-weight:800; font-size:12.5px; border-radius:9px; padding:10px 16px; z-index:99; opacity:0; pointer-events:none; transition:opacity .3s; max-width:92vw; text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<header>

function realSend(sub, body, done){
  if(!API.live){ toastMsg("Demo mode — on the deploy this actually emails you. "+done); return; }
  fetch("/api/send-traffic",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({to:"emm.caban@atticor.ai",subject:"[MAYHEM] "+sub,
      message:"<div style=\"font-family:Arial,sans-serif;font-size:14px;line-height:1.6;white-space:pre-wrap\">"+body.replace(/</g,"&lt;")+"</div><p style=\"color:#888;font-size:12px\">Sent by Mayhem — to you first; nobody else until you say so.</p>"})})
  .then(r=>toastMsg(r.ok?("SENT for real — check your inbox. "+done):"Send failed — rails reachable but n8n said no."))
  .catch(()=>toastMsg("Send failed — network."));
}
function saveState(){
  if(!API.live) return;
  const tix={}; C.forEach(c=>{ if(c.tix&&c.tix.length) tix[c.id]=c.tix; });
  fetch("/api/db",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({collection:"appData",doc:"mayhemState",action:"set",
      data:{data:JSON.stringify({resolved:RESOLVED,tix}),ts:Date.now()}})}).catch(()=>{});
}
let RESOLVED=[];
function loadState(){
  fetch("/api/db",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({collection:"appData",doc:"mayhemState",action:"get"})})
  .then(r=>r.json()).then(j=>{
    const raw=j&&j.data&&j.data.data; if(!raw) return;
    const st=JSON.parse(raw);
    RESOLVED=st.resolved||[];
    J=J.filter(x=>!RESOLVED.includes(x.id));
    Object.keys(st.tix||{}).forEach(cid=>{ const c=C.find(x=>x.id===cid); if(c) c.tix=st.tix[cid]; });
    render();
  }).catch(()=>{});
}
function readLive(text){
  if(!API.live){ toastMsg("Demo mode — on the deploy Mayhem reads this for real with its AI."); return; }
  toastMsg("Reading… Mayhem's AI is on it.");
  fetch("/api/planner",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-5",max_tokens:1000,
      system:"You extract marketing commitment facts from contracts, emails, or notes. Reply ONLY with JSON: {\"name\":string,\"brand\":one of PL,WK,LR,KE,PDV or null,\"dma\":string|null,\"eventDate\":\"YYYY-MM-DD\"|null,\"cost\":string|null,\"vendor\":string|null,\"needs\":array from [creative,merch,social,ethics,seo,staffing]}. Brands: PL=Postman Law, WK=Wettermark Keith, LR=Lerner & Rowe, KE=Keches, PDV=Parrish DeVaughn. No prose.",
      messages:[{role:"user",content:text.slice(0,12000)}]})})
  .then(r=>r.json()).then(j=>{
    let t=(j.content&&j.content[0]&&j.content[0].text)||"";
    const m=t.match(/\{[\s\S]*\}/); if(!m){ toastMsg("Read failed — no structure came back."); return; }
    const x=JSON.parse(m[0]);
    if(x.name)NC.name=x.name; if(x.brand&&BR[x.brand])NC.brand=x.brand; if(x.dma)NC.dma=x.dma;
    if(x.eventDate)NC.event=x.eventDate; if(x.cost)NC.cost=String(x.cost); if(x.vendor)NC.vendor=x.vendor;
    if(Array.isArray(x.needs))NC.needs=x.needs;
    NC.receipts.push(["Read LIVE by Mayhem's AI — facts extracted, nothing guessed","/api/planner · claude-sonnet-5"]);
    renderIntake(); toastMsg("Read for real. The form filled itself — you stay the judge.");
  }).catch(()=>toastMsg("Read failed — network."));
}

function agendaActs(){
  const rows=[];
  filt(C).forEach(c=>c.acts.forEach(a=>{
    const late=a[4]==="late"||(a[4]==="open"&&D(a[1])<TODAY&&a[3]!=="anchor"&&a[3]!=="wrap");
    rows.push({c,a,late});
  }));
  return rows;
}

    const tot=mine.reduce((s,c)=>{const m=c.mny.find(x=>/Contracted|Committed/.test(x[0])); if(!m)return s;
      const v=parseInt((m[1]||"").replace(/[^0-9]/g,""))||0; return s+v;},0);

      '<span class="d" style="background:'+bhex(k)+'"></span><h2>'+BR[k].name+"</h2>"+

let seg="owed";
function renderCommit(){
  const c=C.find(x=>x.id===S.open); if(!c){S.open=null; return render();}
  const acts=c.acts.slice().sort((a,b)=>a[1]<b[1]?-1:1);
  let metro="", todayPlaced=false;
  acts.forEach(a=>{
    const d=D(a[1]);
    if(!todayPlaced&&d>=TODAY){ metro+='<div class="todaymark"><span>Today · Aug 24</span></div>'; todayPlaced=true; }
    const late=a[4]==="late"||(a[4]==="open"&&d<TODAY&&a[3]!=="anchor"&&a[3]!=="wrap");
    const cls=a[3]==="anchor"?"anchor":(late?"late":(a[4]==="done"?"done":(a[3]==="wrap"?"wrapstop":"")));
    metro+='<div class="stop '+cls+'"><div class="dt"><span class="m">'+fmtS(d)+'</span><span class="y">'+DOWN[d.getDay()]+"</span></div>"+
      '<button class="sb" data-why="'+c.id+"|"+a[1]+"|"+esc(a[2]).replace(/"/g,"")+'"><div class="sl">'+esc(a[2])+"</div>"+
      (late?'<div class="so" style="color:var(--ox); font-weight:700">overdue — surfaced</div>':"")+
      '<span class="lane">'+esc(a[0])+"</span></button></div>";
  });
  if(!acts.length) metro='<div class="allclear">No anchor date — a decision has no schedule until a contract lands.</div>';
  const segs=[["owed","We owe"],["tix","Tickets"+((c.tix&&c.tix.length)?" ("+c.tix.length+")":"")],["they","They owe"],["money","Money"],["people","People"],["wrap",c.phase==="WRAPPED"?"Results":"Wrap — armed"]];
  const stM={open:"open",late:"late",got:"got",wait:"wait",done:"done"};
  let pane="";
  if(seg==="owed") pane=(c.owe.length?c.owe.map((o,i)=>'<div class="row"><span class="st '+stM[o[2]]+'">'+o[2]+'</span><div style="flex:1">'+esc(o[0])+'<span class="mu">'+esc(o[1])+"</span></div>"+((o[2]==="open"||o[2]==="late")?'<button class="rowbtn" data-tix="'+c.id+"|"+i+'">Route it</button>':"")+"</div>").join(""):'<div class="row mu">Nothing owed.</div>');
  if(seg==="tix") pane=ticketsPane(c);
  if(seg==="they") pane=(c.they.length?c.they.map(o=>'<div class="row"><span class="st '+stM[o[1]]+'">'+o[1]+"</span><div>"+esc(o[0])+"</div></div>").join(""):'<div class="row mu">No contracted benefits here.</div>');
  if(seg==="money") pane=c.mny.map(m=>'<div class="row"><span class="mono">'+esc(m[0])+"</span><div>"+esc(m[1])+"</div></div>").join("");
  if(seg==="people") pane=c.ppl.map(p=>'<div class="row"><span class="mono">'+esc(p[0])+"</span><div>"+esc(p[1])+"</div></div>").join("");
  if(seg==="wrap") pane=(c.wrap.length?c.wrap.map(w=>'<div class="row"><span class="mono">'+esc(w[0])+"</span><div>"+esc(w[1])+"</div></div>").join(""):'<div class="row mu">Arms when an anchor exists.</div>');
  const idx=c.phase==="WRAPPED"?3:(c.phase==="LIVE"?1:(c.phase==="DECISION"?-1:0));
  app.innerHTML=
   '<button class="cback" data-backb="1">‹ '+BR[c.brand].name+" · "+esc(c.dma)+"</button>"+
   '<div class="grid2"><div>'+
   '<div class="chead"><h1><span class="d" style="background:'+bhex(c.brand)+'"></span>'+esc(c.n)+"</h1>"+
   '<div class="facts">'+esc(c.fund)+(c.ev?' · anchor <b class="mono" style="color:var(--gold)">'+fmt(D(c.ev))+"</b>":"")+"</div></div>"+
   '<div class="csay">“'+esc(c.say)+'”</div>'+
   '<div class="phase">'+["PRE","LIVE","POST"].map((p,i)=>'<div class="'+(i<idx?"done":(i===idx?"now":""))+'">'+p+"</div>").join("")+"</div>"+
   '<div class="sechead"><h2>The line</h2><span class="sub">worked back from the anchor — tap a stop for its why</span></div>'+
   '<div class="metro">'+metro+"</div>"+
   "</div><div>"+
   '<div class="seg">'+segs.map(s=>'<button class="'+(seg===s[0]?"on":"")+'" data-seg="'+s[0]+'">'+s[1]+"</button>").join("")+"</div>"+
   '<div class="panel">'+pane+"</div>"+
   '<div class="cbtns"><button class="btn" data-utm="'+c.id+'">UTMs \u2014 one click</button><button class="btn" data-sheet="monthly">Monthly brief</button>'+
   (c.phase==="WRAPPED"?'<button class="btn gold" data-sheet="report">Event report</button>':"")+
   "</div></div></div>";
}

const TSTEPS=["Requested","Acknowledged","Due back","Received","Approved"];
function ticketsPane(c){
  const tix=c.tix||[];
  if(!tix.length) return '<div class="row mu">No tickets out. Route a need from We owe \u2014 only what someone else owes becomes a ticket.</div>';

      if(NC.needs.includes("seo")) acts.push(["SEO / Web",iso(addD(ev,-13)),"Pixels + landing page live","dueback","open",["Event "+fmt(ev),"SEO lead","= "+fmt(addD(ev,-13))]]);
      acts.push(["Vendor",NC.event,NC.name.toUpperCase()+" — EVENT DAY","anchor","open",["Intake","anchor date"]]);
      acts.push(["Wrap",iso(addD(ev,1)),"+1 attendance report","wrap","open",["Event "+fmt(ev),"wrap +1"]]);
      acts.push(["Wrap",iso(addD(ev,7)),"+7 recap","wrap","open",["Event "+fmt(ev),"wrap +7"]]);
    }
    const cost=NC.conflict?(NC.chosen===1?"$27,500 — ruled: Hazel's sheet":"$25,000 — ruled: contract"):(NC.cost||"TBD");
    C.push({id,n:NC.name,brand:NC.brand,dma:NC.dma||BR[NC.brand].dmas[0],ev:NC.event||null,lch:null,
      fund:BR[NC.brand].name+" — via intake",phase:"PRE",
      say:"Built from "+(NC.receipts.length?NC.receipts.length+" pieces of evidence":"the form")+". The workback exists because the anchor does — every date below knows why.",
      acts, owe:NC.needs.map(n=>[n[0].toUpperCase()+n.slice(1)+" — routed on create","doctrine: Doom → yours → library → ticket","open"]),
      they:[], mny:[["Committed",cost]], wrap:NC.event?[[fmtS(addD(D(NC.event),1)),"+1 attendance"],[fmtS(addD(D(NC.event),7)),"+7 recap"]]:[],
      ppl:[["Owner","Emm"],["Events","Hazel"]]});
    S.open=id; S.tab="brands";
    Object.assign(NC,{name:"",brand:"",dma:"",event:"",cost:"",vendor:"",needs:[],receipts:[],conflict:null,chosen:null});
    render(); window.scrollTo(0,0); toastMsg("Created — Mayhem built the workback. Every date knows why it exists.");
    return;
  }
});
$("#sheetbg").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
render();
</script>
