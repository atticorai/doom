const DOOM_ISCI=(()=>{try{let x=window.MAYHEM_DOOM_CREATIVE||(window.parent&&window.parent!==window?window.parent.MAYHEM_DOOM_CREATIVE:null)||[];return Array.isArray(x)?x:[]}catch(e){return[]}})();
const DMA_TO_DOOM={
 'Chicago':'CHI','Phoenix':'PHX','Albuquerque':'ABQ','Las Vegas':'LVS','Reno':'RNO','Tucson':'TUC','Yuma':'YMA','Flagstaff':'FLG',
 'Oklahoma City':'OKC','Tulsa':'TUL','Boston':'BOS','Birmingham':'BRM','Huntsville':'HSV','Montgomery':'MTG','Dothan':'DHN','Chattanooga':'CHA','Knoxville':'KNX','Nashville':'NSH','Gadsden':'GAD',
 'Minneapolis':'MSP','Cincinnati':'CIN','Denver':'DEN'
};
const DOOM_BRAND={'Keches Law':'Keches Law Group'};
const CHANNELS=[
 ['Radio','Radio','Audio creative / live mentions'],['TV','TV','TV spots / tags'],['Streaming Audio','Radio','Streaming audio creative'],['Display','Display Ads (Programmatic / Banner)','Display / banner creative'],['OOH','OOH / Billboards','Billboard / poster creative'],['Meta','Paid Social (Meta Ads)','Meta — routed by role'],['Organic Social','Organic Social','Organic social content'],['Email','Email','Email / newsletter content'],['Event / On-site','Contests / Giveaways','On-site activation / giveaway']
];
function needObj(o=currentOps()){o.needs=o.needs||{};o.needs.creativeSpecs=o.needs.creativeSpecs||[];o.needs.channels=o.needs.channels||[];o.compliance=o.compliance||[];o.creative=o.creative||{status:'Reuse first',detail:'Check Doom before net-new creative.'};o.creative.reused=o.creative.reused||[];o.creative.received=o.creative.received||[];return o}
function doomBrand(b=state.currentBrand){return DOOM_BRAND[b]||b}
function doomDMA(d=state.currentDMA){return DMA_TO_DOOM[d]||''}
function isciScore(code){let a=String(code||'').match(/\d+/g)||[];return Number(a.join('').slice(0,15)||0)}
function doomRecommendations(media,lengths,b=state.currentBrand,d=state.currentDMA){let db=doomBrand(b),dm=doomDMA(d),out=[];for(let len of lengths){let pool=DOOM_ISCI.filter(r=>r[3]===db&&r[4]===dm&&r[2]===media&&String(r[5])===String(len)&&r[7]===true).sort((a,b)=>isciScore(b[0])-isciScore(a[0]));out.push({media,length:String(len),asset:pool[0]||null,alternates:pool.slice(1,4)});}return out}
function repoChannelForLabel(label){let map={'Display':'Display Ads (Programmatic / Banner)','OOH':'OOH / Billboards','Meta':'Paid Social (Meta Ads)','Streaming Audio':'Radio','Event / On-site':'Contests / Giveaways'};return repoChannel(map[label]||label)}
function complianceForChannel(label){let r=repoChannelForLabel(label),d=repoDMA(),s=disclaimerStatus(r);let dmaText=d?.state_note||'';let required=!!(r&&String(r.text||'').trim())||!!dmaText;let gap=s[1]==='red'||/confirm current|tbd|need to make/i.test((r?.text||'')+' '+dmaText);return {label,record:r,dma:d,status:s[0],cls:s[1],required,gap,text:r?.text||'',note:r?.note||'',dmaText};}
function renderChannelChoices(){let box=document.getElementById('channelChoices');if(!box)return;box.innerHTML=CHANNELS.map(([label,repo,help])=>`<label class="channelpick"><input type="checkbox" class="channelChk" value="${esc(label)}" onchange="toggleChoice(this.parentElement);renderChannelDetails()"><span class="ct">${esc(label)}</span><div class="cm">${esc(help)}</div><div class="lengths channelLengths" data-channel="${esc(label)}"></div></label>`).join('');renderChannelDetails()}
function renderChannelDetails(){document.querySelectorAll('.channelChk').forEach(ch=>{let p=ch.closest('.channelpick'),len=p.querySelector('.channelLengths');if(!len)return;let label=ch.value;if(ch.checked&&['Radio','TV','Streaming Audio'].includes(label))len.innerHTML=['15','30'].map(x=>`<label><input type="checkbox" class="lenChk" data-channel="${esc(label)}" value="${x}" checked onchange="renderComplianceFlags()"> :${x}</label>`).join('');else len.innerHTML=''});renderComplianceFlags()}
function selectedChannels(){return [...document.querySelectorAll('.channelChk:checked')].map(ch=>{let label=ch.value,lens=[...document.querySelectorAll(`.lenChk[data-channel="${CSS.escape(label)}"]:checked`)].map(x=>x.value);return {label,lengths:lens};})}
function renderComplianceFlags(){let box=document.getElementById('intakeCompliance');if(!box)return;let arr=selectedChannels().map(x=>({...x,comp:complianceForChannel(x.label)}));if(!arr.length){box.innerHTML='<div class="tiny">Select channels and Mayhem checks disclaimer/tag requirements automatically.</div>';return}box.innerHTML=`<div class="compliancebox"><div class="sectioncap">Disclaimer / tag check</div>${arr.map(x=>`<div class="row"><div class="title">${esc(x.label)} · <span class="badge ${x.comp.cls}">${esc(x.comp.status)}</span></div><div class="detail">${x.comp.dmaText?esc(x.comp.dmaText):'No DMA-specific note.'}${x.comp.required?'<br><b>Creative content flag:</b> required disclaimer / identifying language travels with any net-new or revised creative.':''}${x.comp.gap?'<br><b>Ethics flag:</b> repository language is incomplete / needs confirmation, so Mayhem proposes an Ethics handoff.':''}</div></div>`).join('')}</div>`}

function showIntakeForm(kind,btn){activateForm(btn);let c=commitById();let b='';if(kind==='commitment')b=`<form onsubmit="createCommitment(event)" class="formgrid" id="commitmentForm"><div class="field c4"><label>Brand</label><select id="fBrand" onchange="intakeBrandChanged();renderComplianceFlags()">${brands().map(x=>`<option ${x===state.currentBrand?'selected':''}>${x}</option>`).join('')}</select></div><div class="field c4"><label>DMA</label><select id="fDMA" onchange="renderComplianceFlags()">${markets().map(x=>`<option ${x===state.currentDMA?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field c4"><label>Commitment type</label><select id="fKind" onchange="renderIntakeChoices()"><option>Event + Sponsorship</option><option>Event</option><option>Sponsorship</option><option>Partnership</option><option>Sports Partnership</option><option>Media Flight</option><option>Community</option><option>Appearance</option><option>Vendor Agreement</option></select></div><div class="field c7"><label>Commitment / event / campaign</label><input id="fName" required placeholder="Name"></div><div class="field c5"><label>Partner / vendor</label><input id="fPartner" list="partnerList" placeholder="Choose saved contact or enter once"><datalist id="partnerList">${state.contacts.filter(x=>x.brand===state.currentBrand&&x.dma===state.currentDMA).map(x=>`<option value="${esc(x.org)}">`).join('')}</datalist></div><div class="field c4"><label>Hard date / launch</label><input id="fAnchor" type="date"></div><div class="field c2"><label>Proposed $</label><input id="fProposed" type="number"></div><div class="field c2"><label>Contracted $</label><input id="fContracted" type="number"></div><div class="field c2"><label>Final $</label><input id="fFinal" type="number"></div><div class="field c2"><label>Estimate #</label><input id="fEstimate"></div><div class="field c4"><label>Funding entity if different</label><input id="fFunding"></div><div class="c12"><div class="sectioncap">Where does this run / show up?</div><div class="channelgrid" id="channelChoices"></div><div id="intakeCompliance"></div></div><div class="c12"><div class="sectioncap">What are they giving us?</div><div class="choicegrid" id="owedChoices"></div></div><div class="c12"><div class="sectioncap">What do we need to make it happen?</div><div class="choicegrid" id="needChoices"></div><div id="merchChoiceDetails"></div></div><div class="c12"><div class="feedbar"><div class="copy"><b>Have something already?</b> Contract / email / workbook / Notion can fill this form, but the form is still the intake.</div><button class="btn secondary" type="button" onclick="openFeedForm()">Use source to fill form</button></div></div><div class="c12"><button class="btn">Create commitment + build work</button></div></form>`;else if(kind==='update')b=`<h3>Change / update</h3><div class="feedbar"><div class="copy">Reality changed? Feed the source if you have it, or enter only the changed fact.</div><button class="btn secondary" onclick="openFeedChange()">Use source</button></div><div class="formgrid"><div class="field c4"><label>Commitment</label><input value="${esc(c.name)}" readonly></div><div class="field c4"><label>Field</label><select id="uField"><option>Event / launch date</option><option>Final cost</option><option>Partner obligation</option><option>Owner</option><option>Deliverable</option></select></div><div class="field c4"><label>Source</label><select id="uSource"><option>Email</option><option>Notion</option><option>Contract amendment</option><option>Excel</option><option>Partner update</option></select></div><div class="field c6"><label>Current value</label><input id="uCurrent"></div><div class="field c6"><label>Incoming value</label><input id="uIncoming"></div><div class="field c12"><label>Evidence / note</label><textarea id="uNote" rows="3"></textarea></div><div class="c12"><button class="btn" onclick="stageChange()">Stage for reconciliation</button></div></div>`;else if(kind==='proof')b=`<h3>Proof / report intake</h3><form onsubmit="attachProof(event)" class="formgrid"><div class="field c4"><label>Commitment</label><input value="${esc(c.name)}" readonly></div><div class="field c4"><label>Proof type</label><select id="pType"><option>Attendance report</option><option>Partner delivery proof</option><option>Social metrics</option><option>Press / coverage</option><option>Photo / video proof</option><option>Expense support</option></select></div><div class="field c4"><label>Received from</label><input id="pFrom"></div><div class="field c12"><label>Notes / link</label><textarea id="pNote" rows="4" required></textarea></div><div class="c12"><button class="btn">Attach to commitment</button></div></form>`;else b=`<h3>Partner contact</h3><form onsubmit="addContact(event)" class="formgrid"><div class="field c4"><label>Brand</label><input value="${esc(state.currentBrand)}" readonly></div><div class="field c4"><label>DMA</label><input value="${esc(state.currentDMA)}" readonly></div><div class="field c4"><label>Organization</label><input id="ctOrg" required></div><div class="field c4"><label>Name</label><input id="ctName"></div><div class="field c4"><label>Role / authority</label><input id="ctRole"></div><div class="field c4"><label>Email</label><input id="ctEmail" type="email"></div><div class="field c12"><label>Ship-to / address</label><textarea id="ctShip" rows="2"></textarea></div><div class="c12"><button class="btn">Save to DMA contacts</button></div></form>`;document.getElementById('intakeBody').innerHTML=b;if(kind==='commitment')setTimeout(()=>{renderIntakeChoices();renderChannelChoices();mamRenderEstimateIntake()},0)}
function intakeBrandChanged(){let b=document.getElementById('fBrand').value,sel=document.getElementById('fDMA');sel.innerHTML=markets(b).map(x=>`<option>${esc(x)}</option>`).join('')}
function createCommitment(e){e.preventDefault();let b=document.getElementById('fBrand').value,d=document.getElementById('fDMA').value;if(!state.brands[b].markets[d])state.brands[b].markets[d]={memory:[],commitments:[]};let id='c'+Date.now(),kind=document.getElementById('fKind').value,anchor=document.getElementById('fAnchor').value,channels=selectedChannels();let c={id,kind,name:document.getElementById('fName').value.trim(),state:'Pre',anchor,partner:document.getElementById('fPartner').value.trim(),funding:document.getElementById('fFunding').value.trim(),channels:channels.map(x=>x.label).join(', '),channelPlan:channels,meta:`${anchor?fmtDate(anchor):'Anchor TBD'} · ${moneyFmt(document.getElementById('fFinal').value||document.getElementById('fContracted').value||0)}`,money:{proposed:+document.getElementById('fProposed').value||0,contracted:+document.getElementById('fContracted').value||0,final:(+document.getElementById('fFinal').value||+document.getElementById('fContracted').value||0),estimate:document.getElementById('fEstimate').value}};state.brands[b].markets[d].commitments.push(c);state.currentBrand=b;state.currentDMA=d;state.currentCommit=id;let o=genericOps();o=needObj(o);o.needs=Object.assign(o.needs,readNeedSelections());o.needs.channels=channels;o.needs.creativeSpecs=[];for(let x of channels){if(['Radio','TV','Streaming Audio'].includes(x.label)&&x.lengths.length)o.needs.creativeSpecs.push({channel:x.label,media:x.label==='TV'?'TV':'Radio',lengths:x.lengths});if(['Display','OOH'].includes(x.label))o.needs.creative=true;if(x.label==='Meta')o.needs.meta=true;if(x.label==='Organic Social'||x.label==='Email')o.needs.social=true;let comp=complianceForChannel(x.label);o.compliance.push(comp);if(comp.gap)o.needs.ethics=true;if(comp.required&&['Radio','TV','Streaming Audio','Display','OOH','Meta','Organic Social','Email'].includes(x.label))o.needs.disclaimerFlag=true;}if(o.needs.creativeSpecs.length)o.needs.creative=true;o.obligations=readOwedSelections();o.social.brief=o.needs.social?'Build content/newsletter brief from commitment facts; Content & Social receives only the relevant content need.':'';state.ops[id]=o;addEvidence(id,'intake',`Commitment created from form · ${channels.map(x=>x.label+(x.lengths.length?' '+x.lengths.map(l=>':'+l).join('/'):'')).join(', ')||'no channel selected'}`);saveState();go('tickets');setTimeout(()=>openTicketPlanner(id),30)}

function creativeDoomState(c=commitById(),o=needObj()){let specs=o.needs.creativeSpecs||[],rows=[];for(let s of specs){let recs=doomRecommendations(s.media,s.lengths,c.brand||state.currentBrand,c.dma||state.currentDMA);rows.push(...recs.map(r=>({...r,channel:s.channel})));}return rows}
function doomRecHTML(c,o){let rows=creativeDoomState(c,o);if(!rows.length)return '';return `<div class="doomrec"><div class="head"><div><div class="title">Doom check — newest active ISCIs first</div><div class="tiny">Mayhem recommends registered creative before it creates any net-new Creative request.</div></div></div>${rows.map(r=>`<div class="asset"><div class="isci">:${esc(r.length)}</div><div class="desc">${r.asset?`<b>${esc(r.asset[0])}</b> · ${esc(r.asset[1])}<div class="meta">${esc(r.channel)} · ${esc(r.media)} · active in Doom</div>`:`<b>Nothing active found</b><div class="meta">${esc(r.channel)} · :${esc(r.length)} needs net-new / manual review</div>`}</div><span class="badge ${r.asset?'green':'red'}">${r.asset?'REUSE':'MISSING'}</span></div>`).join('')}<div class="actions"><button class="btn secondary" onclick="useLatestDoomCreative()">Use all available Doom recommendations</button></div></div>`}
function useLatestDoomCreative(){let c=commitById(),o=needObj(),rows=creativeDoomState(c,o),used=rows.filter(x=>x.asset),missing=rows.filter(x=>!x.asset);for(let x of used){if(!o.creative.reused.some(y=>y.isci===x.asset[0]))o.creative.reused.push({channel:x.channel,length:x.length,isci:x.asset[0],title:x.asset[1],media:x.asset[2],url:x.asset[9]||''});}o.creative.status=missing.length?'Partial reuse — missing creative remains':'Doom creative selected';o.creative.detail=used.length?`Using ${used.map(x=>x.asset[0]).join(', ')}${missing.length?`; still missing ${missing.map(x=>x.channel+' :'+x.length).join(', ')}`:''}`:'No eligible Doom assets found.';if(!missing.length&&!o.needs.merchDesign)o.needs.creative=false;state.ops[state.currentCommit]=o;addEvidence(c.id,'doom',`Doom recommendation accepted: ${used.map(x=>x.asset[0]).join(', ')||'none'}${missing.length?' · missing '+missing.map(x=>x.channel+' :'+x.length).join(', '):''}`);saveState();closeModal();openTicketPlanner(c.id)}
function missingCreativeAsk(c,o){let rows=creativeDoomState(c,o),missing=rows.filter(x=>!x.asset).map(x=>`${x.channel} :${x.length}`);let asks=[];if(missing.length)asks.push(`Create missing ${missing.join(', ')}`);if(o.needs.merchDesign)asks.push(`Create selected merch design (${(o.needs.merchItems||[]).join(', ')||'merch'})`);if(o.needs.disclaimerFlag)asks.push('Apply / verify the current DMA + channel disclaimer/tag requirements on any net-new or revised creative');if(!rows.length&&o.needs.creative&&!o.needs.merchDesign)asks.push('Create the selected net-new creative');return asks.join(' · ')}
function ticketProposalHTML(type,c,o){o=needObj(o);let role=ROUTE_FOR[type]||type,contact=roleContact(role),missingRoute=!contact?.email,ask=type==='Merch'?`Fulfill: ${(o.needs?.merchItems||[]).join(', ')||'selected merch'}`:type==='Creative'?missingCreativeAsk(c,o):bodyFor(type,c).split('\n\n')[2]||type;let extra=type==='Creative'?doomRecHTML(c,o):type==='Ethics'?complianceTicketHTML(o):'';return `<div class="ticketpick selected" data-type="${type}"><input class="check proposalChk" type="checkbox" checked onchange="this.closest('.ticketpick').classList.toggle('selected',this.checked)"><div class="type">${type}</div><div class="ask">${esc(ask||'No net-new request needed after Doom reuse')}</div><div class="route ${missingRoute?'missing':''}">To: ${esc(contactLabel(role))}<br>Due back: ${fmtDate(dueForNeed(type,c))} · protects ${c.anchor?fmtDate(c.anchor):'hard date TBD'}</div><div class="actions"><button class="btn secondary" onclick="previewProposal('${type}')">Preview email</button></div>${extra}</div>`}
function complianceTicketHTML(o){let flags=(o.compliance||[]).filter(x=>x.required||x.gap);if(!flags.length)return '';return `<div class="compliancebox">${flags.map(x=>`<div class="row"><div class="title">${esc(x.label)} · ${esc(x.status)}</div><div class="detail">${esc(x.dmaText||'')}${x.text?'<br>'+esc(x.text):''}</div></div>`).join('')}</div>`}
function openTicketPlanner(commitId=state.currentCommit,focus=''){state.currentCommit=commitId;saveState();let c=commitById(),o=needObj(currentOps()),types=suggestedTicketTypes(o);let doomRows=creativeDoomState(c,o);if(o.needs.creative&&doomRows.length&&doomRows.every(x=>x.asset)&&!o.needs.merchDesign)types=types.filter(x=>x!=='Creative');if(focus&&!types.includes(focus))types.push(focus);modal('Build tickets from the commitment',`${state.currentBrand} · ${state.currentDMA} · ${c.name}`,`${doomRecHTML(c,o)}<div class="tiny" style="margin-top:10px">Only work another person actually owes becomes a ticket. Each ticket has a required return and cannot close until that return is logged.</div><div class="ticketplan" id="ticketPlan" style="margin-top:10px">${types.map(t=>ticketProposalHTML(t,c,o)).join('')||'<div class="fact"><div class="label">Route</div><div>No external handoff is needed right now. Existing Doom creative / Ops-owned work has handled the selected needs.</div></div>'}</div><div class="panel flat" style="margin-top:10px"><h3>Add a newly discovered need</h3><div class="pillrow"><button class="pillbtn" onclick="addNeedFromPlanner('Creative')">Creative</button><button class="pillbtn" onclick="openMerchNeedFromPlanner()">Merch</button><button class="pillbtn" onclick="addNeedFromPlanner('Ethics')">Ethics</button><button class="pillbtn" onclick="addNeedFromPlanner('Social')">Content & Social</button><button class="pillbtn" onclick="addNeedFromPlanner('SEO')">SEO</button><button class="pillbtn" onclick="addNeedFromPlanner('Meta')">Meta</button><button class="pillbtn" onclick="addNeedFromPlanner('Staffing')">Staffing</button><button class="pillbtn" onclick="addNeedFromPlanner('Finance')">Finance</button></div></div><div style="margin-top:12px"><button class="btn" onclick="createSelectedTicketDrafts()">Create selected drafts</button></div>`)}
function bodyFor(type,c=commitById(),extra=''){let o=needObj(currentOps());let lines=[`${c.name} — ${state.currentBrand} · ${state.currentDMA}`,c.anchor?`Hard date: ${fmtDate(c.anchor)}`:'Hard date: TBD'];if(type==='Creative'){lines.push(missingCreativeAsk(c,o)||'No net-new creative remains after Doom reuse.');let flags=(o.compliance||[]).filter(x=>x.required);if(flags.length)lines.push('Required disclaimer / tag context:\n'+flags.map(x=>`${x.label}: ${x.dmaText||''}${x.text?' | '+x.text:''}`).join('\n'));}if(type==='Ethics'){lines.push('Please review / confirm the current disclaimer or tag requirement. Ethics remains the approval gate.');let flags=(o.compliance||[]).filter(x=>x.required||x.gap);if(flags.length)lines.push(flags.map(x=>`${x.label}: ${x.dmaText||''}${x.text?' | '+x.text:''}`).join('\n'));}if(type==='Social')lines.push(`Content need: ${o.social?.brief||'Pre-event / campaign support and required post-event return.'}`);if(type==='Merch')lines.push(`Merch needed: ${(o.needs?.merchItems||[]).join(', ')||'Merch details selected on the commitment.'}`,`Design needed: ${o.needs?.merchDesign?'Yes — Creative is also routed.':'No / not selected.'}`);if(type==='SEO')lines.push('Please handle pixel / page-click tracking work for this commitment. UTMs and landing-page naming stay with Ops.');if(type==='Meta')lines.push('Meta support is routed through the Meta role. Please return the link / confirmation Mayhem needs to close the request.');if(type==='Staffing')lines.push('Please confirm the staffing names / count / call-time details needed for this commitment.');if(type==='Finance')lines.push(`Final committed: ${moneyFmt(c.money.final)} · Estimate: ${c.money.estimate||'TBD'}`,'Please confirm the payment-routing/support requirements and return the payment reference / missing-info request.');if(extra)lines.push(extra);return lines.join('\n\n')}
function expectedReturn(t){return ({Creative:'Creative files / links + final titles + ISCIs when registered',Ethics:'Approval / requested changes + approved disclaimer/tag language',Social:'Content / newsletter confirmation + links; post-event metrics when required',Merch:'Order confirmation → tracking → delivered proof',SEO:'Pixel / page-click tracking confirmation + test evidence',Meta:'Meta confirmation + live/content link or requested changes',Staffing:'Confirmed names / count / call time',Finance:'Payment routing response + confirmation / missing information',Partner:'Partner response / proof',Vendor:'Vendor response / proof'})[t.type]||'A concrete response / proof that closes the ask'}
function createSelectedTicketDrafts(){let c=commitById(),o=needObj(currentOps()),chosen=[...document.querySelectorAll('.proposalChk:checked')].map(x=>x.closest('.ticketpick').dataset.type);chosen.forEach(type=>{let existing=state.tickets.find(t=>t.brand===state.currentBrand&&t.dma===state.currentDMA&&t.commit===c.id&&t.type===type&&t.status!=='Closed');if(existing)return;let role=ROUTE_FOR[type]||type,contact=roleContact(role),ask=type==='Creative'?missingCreativeAsk(c,o):bodyFor(type,c).split('\n\n')[2]||type;if(type==='Creative'&&!ask)return;state.tickets.push({id:Date.now()+Math.random(),brand:state.currentBrand,dma:state.currentDMA,commit:c.id,type,ask,ownerRole:role,owner:contact?.name||role,to:contact?.email||'',sent:'',due:dueForNeed(type,c),protects:c.anchor?fmtDate(c.anchor):'hard date TBD',status:'Draft',notes:'',subject:subjectFor(type,c),body:bodyFor(type,c),returnRequired:expectedReturn({type}),returnData:null,history:[]})});saveState();closeModal();renderShell();renderPage();toast(`${chosen.length} draft${chosen.length===1?'':'s'} ready`)}
function ticketRowHTML(t){let route=roleContact(t.ownerRole||t.type),to=t.to||route?.email||'',missing=!to,returned=!!t.returnData;return `<div class="workline"><div class="top"><div class="name">${esc(t.type)} · ${esc(t.ask)}</div><span class="badge ${t.status==='Closed'?'green':missing?'red':returned?'blue':'gold'}">${esc(t.status)}</span></div><div class="detail">To: ${esc(route?.name||t.owner||t.ownerRole||'Unassigned')}${to?' · '+esc(to):' · EMAIL MISSING'} · due ${fmtDate(t.due)} · protects ${esc(t.protects)}<br><b>Must come back with:</b> ${esc(t.returnRequired||expectedReturn(t))}</div>${t.sent?`<div class="evidence">Sent ${fmtDate(t.sent)}</div>`:''}${returned?`<div class="returnstamp">Returned ${fmtDate(t.returned)} · ${esc(returnSummary(t))}</div>`:''}<div class="actions"><button class="btn secondary" onclick="openTicket(${t.id})">Open / work ticket</button>${missing?`<button class="btn ghost" onclick="go('registry')">Fix route</button>`:''}</div></div>`}
function returnSummary(t){let d=t.returnData||{};return d.summary||d.assetTitle||d.verdict||d.confirmation||d.link||d.note||'Return logged'}
function emailPreviewHTML(t,withSend=true){let route=roleContact(t.ownerRole||t.type),to=t.to||route?.email||'',missing=!to;return `<div class="emailbox"><div class="emailhead"><div class="lab">To</div><div>${esc(route?.name||t.owner||'')}${to?' &lt;'+esc(to)+'&gt;':' — EMAIL MISSING'}</div></div><div class="emailhead"><div class="lab">Subject</div><div>${esc(t.subject||subjectFor(t.type))}</div></div><div class="emailbody">${esc(t.body||'')}</div></div><div class="loopbox"><div class="label">This ticket closes only when it comes back with</div><div class="value">${esc(t.returnRequired||expectedReturn(t))}</div></div>${t.returnData?`<div class="returnstamp"><b>Return received ${fmtDate(t.returned)}</b><br>${esc(returnSummary(t))}</div>`:''}${withSend?ticketActionHTML(t,missing):''}`}
function ticketActionHTML(t,missing){if(t.status==='Closed')return '<div class="ticketactions"><span class="badge green">Loop closed</span></div>';let out='<div class="ticketactions">';if(!t.sent)out+=missing?`<button class="btn secondary" onclick="closeModal();go('registry')">Add recipient email</button>`:`<button class="btn" onclick="sendTicket(${t.id})">Send + start due-back clock</button>`;else{out+=`<button class="btn secondary" onclick="logTicketReturn(${t.id})">Log what came back</button>`;if(t.returnData){out+=`<button class="btn secondary" onclick="requestTicketChanges(${t.id})">Request changes</button><button class="btn" onclick="closeTicketLoop(${t.id})">Approve / close loop</button>`}}return out+'</div>'}
function openTicket(id){let t=state.tickets.find(x=>x.id===id);if(!t)return;modal('Ticket loop',`${state.currentBrand} · ${state.currentDMA} · ${findCommitName(t.commit,state.currentBrand,state.currentDMA)}`,emailPreviewHTML(t,true))}
function sendTicket(id){let t=state.tickets.find(x=>x.id===id),r=roleContact(t.ownerRole||t.type),to=t.to||r?.email||'';if(!to){toast('Recipient email is missing');return}t.to=to;t.owner=r?.name||t.owner;t.status='Sent';t.sent=t.sent||new Date().toISOString().slice(0,10);t.history=t.history||[];t.history.push({date:t.sent,event:'Sent',detail:`${t.owner} <${to}>`});addEvidence(t.commit,'send',`${t.type} sent to ${t.owner} <${to}> · due ${fmtDate(t.due)} · return required: ${t.returnRequired||expectedReturn(t)}`);saveState();closeModal();renderPage();renderShell();toast('Sent — due-back clock started')}
function logTicketReturn(id){let t=state.tickets.find(x=>x.id===id);if(!t)return;let fields='';if(t.type==='Creative')fields=`<div class="field c4"><label>Creative title</label><input id="retTitle" required></div><div class="field c4"><label>Length(s)</label><input id="retLengths" placeholder=":30, :15"></div><div class="field c4"><label>ISCI(s) if registered</label><input id="retIsci"></div><div class="field c12"><label>Creative / Frame / Drive link</label><input id="retLink" required></div>`;else if(t.type==='Ethics')fields=`<div class="field c4"><label>Verdict</label><select id="retVerdict"><option>Approved</option><option>Changes requested</option><option>Approved with required tag/disclaimer</option></select></div><div class="field c8"><label>Approved language / changes</label><textarea id="retNote" rows="3" required></textarea></div>`;else if(t.type==='Merch')fields=`<div class="field c3"><label>Status</label><select id="retStatus"><option>Ordered</option><option>Production</option><option>Shipped</option><option>Delivered</option></select></div><div class="field c4"><label>Tracking / confirmation</label><input id="retConfirmation" required></div><div class="field c5"><label>Proof / link</label><input id="retLink"></div>`;else fields=`<div class="field c4"><label>Result</label><input id="retConfirmation" required></div><div class="field c8"><label>Link / proof / details</label><textarea id="retNote" rows="3"></textarea></div>`;modal('Log return',`${t.type} · ${findCommitName(t.commit,t.brand,t.dma)}`,`<form class="formgrid" onsubmit="saveTicketReturn(event,${id})">${fields}<div class="c12"><button class="btn">Save return to ticket + commitment</button></div></form>`)}
function saveTicketReturn(e,id){e.preventDefault();let t=state.tickets.find(x=>x.id===id),d={};if(t.type==='Creative'){d.assetTitle=document.getElementById('retTitle').value;d.lengths=document.getElementById('retLengths').value;d.isci=document.getElementById('retIsci').value;d.link=document.getElementById('retLink').value;d.summary=`${d.assetTitle}${d.isci?' · '+d.isci:''} · ${d.link}`;let o=state.ops[t.commit]||genericOps();o=needObj(o);o.creative.received.push(d);o.creative.status='Creative returned — review';o.creative.detail=d.summary;state.ops[t.commit]=o;}else if(t.type==='Ethics'){d.verdict=document.getElementById('retVerdict').value;d.note=document.getElementById('retNote').value;d.summary=`${d.verdict} · ${d.note}`;let o=state.ops[t.commit]||genericOps();o.ethics={status:d.verdict,detail:d.note};state.ops[t.commit]=o;}else if(t.type==='Merch'){d.status=document.getElementById('retStatus').value;d.confirmation=document.getElementById('retConfirmation').value;d.link=document.getElementById('retLink').value;d.summary=`${d.status} · ${d.confirmation}`;}else{d.confirmation=document.getElementById('retConfirmation').value;d.note=document.getElementById('retNote').value;d.summary=`${d.confirmation}${d.note?' · '+d.note:''}`;}t.returnData=d;t.returned=new Date().toISOString().slice(0,10);t.status='Received v1';t.history=t.history||[];t.history.push({date:t.returned,event:'Return received',detail:d.summary});addEvidence(t.commit,'return',`${t.type} returned · ${d.summary}`);saveState();closeModal();openTicket(id)}
function requestTicketChanges(id){let t=state.tickets.find(x=>x.id===id);modal('Request changes',`${t.type} · ${findCommitName(t.commit,t.brand,t.dma)}`,`<form class="formgrid" onsubmit="sendTicketChanges(event,${id})"><div class="field c12"><label>What needs to change?</label><textarea id="changeAsk" rows="4" required></textarea></div><div class="field c4"><label>Due back</label><input id="changeDue" type="date" value="${esc(t.due||'')}"></div><div class="c12"><button class="btn">Send changes + keep loop open</button></div></form>`)}
function sendTicketChanges(e,id){e.preventDefault();let t=state.tickets.find(x=>x.id===id),ask=document.getElementById('changeAsk').value;t.status='Changes';t.returnData=null;t.due=document.getElementById('changeDue').value||t.due;t.history=t.history||[];t.history.push({date:new Date().toISOString().slice(0,10),event:'Changes requested',detail:ask});addEvidence(t.commit,'changes',`${t.type} changes requested · ${ask} · due ${fmtDate(t.due)}`);saveState();closeModal();renderPage();toast('Changes sent — loop stays open')}
function closeTicketLoop(id){let t=state.tickets.find(x=>x.id===id);if(!t.returnData){toast('Cannot close: nothing has come back yet');return}t.status='Closed';t.closed=new Date().toISOString().slice(0,10);t.history=t.history||[];t.history.push({date:t.closed,event:'Closed',detail:returnSummary(t)});addEvidence(t.commit,'close',`${t.type} loop closed · ${returnSummary(t)}`);saveState();closeModal();renderPage();renderShell();toast('Loop closed with return evidence')}

function renderTicketsPage(el){let c=commitById(),ts=state.tickets.filter(t=>t.brand===state.currentBrand&&t.dma===state.currentDMA&&t.commit===c.id);el.innerHTML=`<div class="page">${pageHead('Tickets & handoffs','These are open loops, not tasks. Send → due back → return → review / changes → close with evidence.',`<button class="btn" onclick="openTicketPlanner('${c.id}')">Build / change tickets</button>`)}<div class="panel"><h3>${esc(c.name)} · handoff loops</h3>${ts.length?ts.map(t=>ticketRowHTML(t)).join(''):'<div class="fact"><div class="label">Tickets</div><div>No external handoffs yet. Open the planner to route only what another person owes.</div></div>'}<div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="openTicketPlanner('${c.id}')">Review route / Doom reuse</button></div></div></div>`}

function paymentCardHTML(p){let c=commitById(p.commit,state.currentBrand,state.currentDMA),fin=roleContact('Finance',p.brand,p.dma),missing=!fin?.email;return `<div class="paymentcard"><div class="top"><div><div class="name">${esc(p.vendor)} · ${moneyFmt(p.amount)}</div><div class="meta">${esc(findCommitName(p.commit,p.brand,p.dma))} · due ${fmtDate(p.due)} · estimate ${esc(c?.money?.estimate||'TBD')} · pays: ${esc(p.funding||p.brand)}<br>Support: ${esc(p.source||'Not attached')} · ${esc(p.note||'')}</div></div><span class="badge ${p.status==='Paid'?'green':missing?'red':p.status==='Needs information'?'red':'gold'}">${esc(p.status)}</span></div>${p.financeReturn?`<div class="returnstamp">Finance returned: ${esc(p.financeReturn)}</div>`:''}<div class="actions"><button class="btn secondary" onclick="previewFinancePacket(${p.id})">Preview / send Finance request</button>${p.status==='Sent to Finance'||p.status==='Needs information'?`<button class="btn secondary" onclick="logFinanceReturn(${p.id})">Log Finance response</button>`:''}</div></div>`}
function logFinanceReturn(id){let p=state.payments.find(x=>x.id===id);modal('Finance response',`${p.vendor} · ${moneyFmt(p.amount)}`,`<form class="formgrid" onsubmit="saveFinanceReturn(event,${id})"><div class="field c4"><label>Response</label><select id="finResp"><option>Paid</option><option>Scheduled</option><option>Needs information</option></select></div><div class="field c4"><label>Reference / confirmation</label><input id="finRef"></div><div class="field c4"><label>Paid / scheduled date</label><input id="finDate" type="date"></div><div class="field c12"><label>What Finance still needs / note</label><textarea id="finNote" rows="3"></textarea></div><div class="c12"><button class="btn">Save response + update commitment</button></div></form>`)}
function saveFinanceReturn(e,id){e.preventDefault();let p=state.payments.find(x=>x.id===id),resp=document.getElementById('finResp').value,ref=document.getElementById('finRef').value,date=document.getElementById('finDate').value,note=document.getElementById('finNote').value;p.status=resp;p.financeReturn=`${resp}${ref?' · '+ref:''}${date?' · '+fmtDate(date):''}${note?' · '+note:''}`;if(resp==='Paid')p.status='Paid';addEvidence(p.commit,'finance-return',`Finance: ${p.financeReturn}`);saveState();closeModal();renderPage();toast('Finance response logged')}
function markPayment(id){let p=state.payments.find(x=>x.id===id);if(!p)return;if(p.status!=='Paid'){logFinanceReturn(id);return}toast('Already paid and closed')}

function renderLibraryResult(){let b=document.getElementById('libBrand')?.value;if(!b)return;let rb=window.MAYHEM_DISCLAIMERS[b],dn=document.getElementById('libDMA').value,ch=document.getElementById('libChannel').value,d=rb.dmas.find(x=>x.dma===dn),r=rb.channels.find(x=>x.channel===ch),s=disclaimerStatus(r);document.getElementById('libraryResult').innerHTML=`<div class="repo-grid"><div class="panel"><h3>DMA / state context</h3><div class="fact"><div class="label">DMA</div><div>${esc(d?.dma||'')}</div></div><div class="fact"><div class="label">State</div><div>${esc(d?.state||'')}</div></div><div class="fact"><div class="label">Requirement</div><div>${esc(d?.state_note||'')}</div></div><div class="fact"><div class="label">OOH</div><div>${esc(d?.ooh||'')}</div></div></div><div class="panel"><h3>${esc(ch)} · <span class="badge ${s[1]}">${s[0]}</span></h3><div class="repo-text">${esc(r?.text||'No language in repository.')}</div>${r?.note?`<div class="fact" style="margin-top:10px"><div class="label">Note</div><div>${esc(r.note)}</div></div>`:''}<div class="export-actions"><button class="btn secondary" onclick="flagLibraryOnCommitment('${ch.replaceAll("'","\\'")}')">Flag on current commitment</button><button class="btn secondary" onclick="openNewTicket('${state.currentCommit}','Ethics')">Open Ethics handoff</button></div></div></div>`}
function flagLibraryOnCommitment(ch){let o=needObj(currentOps()),r=repoChannel(ch),s=disclaimerStatus(r),d=repoDMA();o.compliance.push({label:ch,record:r,dma:d,status:s[0],cls:s[1],required:true,gap:s[1]==='red',text:r?.text||'',note:r?.note||'',dmaText:d?.state_note||''});o.needs.disclaimerFlag=true;if(s[1]==='red')o.needs.ethics=true;state.ops[state.currentCommit]=o;addEvidence(state.currentCommit,'compliance',`${ch} disclaimer/tag context flagged on commitment`);saveState();toast('Flagged on commitment');go('tickets')}

function intakeContext(){let b=document.getElementById('fBrand')?.value||state.currentBrand,d=document.getElementById('fDMA')?.value||state.currentDMA;return {brand:b,dma:d}}
function repoForContext(b,d){let rb=window.MAYHEM_DISCLAIMERS?.[DOOM_BRAND[b]||b]||{dmas:[],channels:[]},n=String(d||'').toLowerCase();let rd=rb.dmas.find(x=>String(x.dma||'').toLowerCase().includes(n)||String(x.markets||'').toLowerCase().includes(n))||null;return {rb,rd}}
function complianceForChannel(label){let ctx=intakeContext(),{rb,rd}=repoForContext(ctx.brand,ctx.dma),map={'Display':'Display Ads (Programmatic / Banner)','OOH':'OOH / Billboards','Meta':'Paid Social (Meta Ads)','Streaming Audio':'Radio','Event / On-site':'Contests / Giveaways'},ch=map[label]||label,r=rb.channels.find(x=>x.channel===ch)||null,s=disclaimerStatus(r),dmaText=rd?.state_note||'';let required=!!(r&&String(r.text||'').trim())||!!dmaText,gap=s[1]==='red'||/confirm current|tbd|need to make/i.test((r?.text||'')+' '+dmaText);return {label,record:r,dma:rd,status:s[0],cls:s[1],required,gap,text:r?.text||'',note:r?.note||'',dmaText}}
function createTicket(e){e.preventDefault();let type=document.getElementById('tType').value,role=ROUTE_FOR[type]||type,contact=roleContact(role),c=commitById(document.getElementById('tCommit').value),t={id:Date.now(),brand:state.currentBrand,dma:state.currentDMA,commit:c.id,type,ask:document.getElementById('tAsk').value,ownerRole:role,owner:contact?.name||document.getElementById('tOwner')?.value||role,to:contact?.email||'',sent:'',due:document.getElementById('tDue').value,protects:document.getElementById('tProtects').value||'Not set',status:'Draft',notes:document.getElementById('tNotes').value,subject:subjectFor(type,c),body:bodyFor(type,c,document.getElementById('tAsk').value),returnRequired:expectedReturn({type}),returnData:null,history:[]};state.tickets.push(t);saveState();closeModal();toast('Handoff draft created — return requirement attached');renderPage();renderShell()}

async function sendTicket(id){let t=state.tickets.find(x=>x.id===id),r=roleContact(t.ownerRole||t.type),to=t.to||r?.email||'';if(!to){toast('Recipient email is missing');return}let sentLive=false,standalone=location.protocol==='file:'||location.hostname==='127.0.0.1'||location.hostname==='localhost';if(!standalone){try{let resp=await fetch('/api/send-traffic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,cc:roleContact('Ops',t.brand,t.dma)?.email||'',subject:t.subject||subjectFor(t.type),message:t.body||''})});sentLive=resp.ok;if(!resp.ok){toast('Doom mail service returned an error');return}}catch(e){toast('Could not reach Doom mail service');return}}t.to=to;t.owner=r?.name||t.owner;t.status='Sent';t.sent=t.sent||new Date().toISOString().slice(0,10);t.delivery=sentLive?'Doom mail service':'Standalone QA simulation';t.history=t.history||[];t.history.push({date:t.sent,event:'Sent',detail:`${t.owner} <${to}> · ${t.delivery}`});addEvidence(t.commit,'send',`${t.type} sent to ${t.owner} <${to}> · due ${fmtDate(t.due)} · return required: ${t.returnRequired||expectedReturn(t)} · ${t.delivery}`);saveState();closeModal();renderPage();renderShell();toast(sentLive?'Sent through Doom + due-back clock started':'QA send stamped locally — Doom deployment will use the live mail service')}

async function sendFinancePacket(id){let p=state.payments.find(x=>x.id===id),fin=roleContact('Finance',p.brand,p.dma);if(!fin?.email){toast('Finance email missing');return}let standalone=location.protocol==='file:'||location.hostname==='127.0.0.1'||location.hostname==='localhost',sentLive=false;if(!standalone){try{let resp=await fetch('/api/send-traffic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:fin.email,cc:roleContact('Ops',t.brand,t.dma)?.email||'',subject:`Payment routing — ${findCommitName(p.commit,p.brand,p.dma)} · ${moneyFmt(p.amount)}`,message:financeBody(p)})});if(!resp.ok){toast('Doom mail service returned an error');return}sentLive=true}catch(e){toast('Could not reach Doom mail service');return}}p.status='Sent to Finance';p.routed=new Date().toISOString().slice(0,10);p.delivery=sentLive?'Doom mail service':'Standalone QA simulation';state.financeSends.push({id:Date.now(),payment:id,to:fin.email,date:p.routed,delivery:p.delivery});addEvidence(p.commit,'finance',`Payment request ${moneyFmt(p.amount)} sent to ${fin.name} <${fin.email}> · response required · ${p.delivery}`);saveState();closeModal();renderPage();toast(sentLive?'Finance request sent through Doom':'QA Finance send stamped locally')}

function syncToNotion(c,reason='Updated from Mayhem'){
 state.notionPushes=state.notionPushes||[];
 let today=new Date().toISOString().slice(0,10);
 c.notion={status:'Synced',last:today,reason};
 state.notionPushes.push({id:Date.now(),brand:state.currentBrand,dma:state.currentDMA,record:c.id,name:c.name,date:today,reason});
 state.sources=state.sources||[];
 state.sources.push({id:Date.now()+1,brand:state.currentBrand,dma:state.currentDMA,commit:c.id,type:'Notion',name:c.name+' — Mayhem push',status:'Synced',detail:reason});
 addEvidence(c.id,'notion',`Notion synced · ${reason}`);
 saveState();
}

n(${i})">Edit</button></div></div>`).join(''):'<div class="fact"><div class="label">Partner / vendor</div><div>Nothing recorded yet.</div></div>'}<button class="btn secondary" style="margin-top:9px" onclick="addObligation()">+ Add what they owe us</button></div></div><div id="sub-money" class="subview"><div class="moneygrid"><div class="moneycell"><span>Proposed</span><b>${moneyFmt(c.money.proposed)}</b></div><div class="moneycell"><span>Contracted</span><b>${moneyFmt(c.money.contracted)}</b></div><div class="moneycell"><span>Final</span><b>${moneyFmt(c.money.final)}</b></div><div class="moneycell"><span>Estimate</span><b>${esc(c.money.estimate||'TBD')}</b></div></div><button class="btn secondary" style="margin-top:9px" onclick="editRecordMoney('${c.id}')">Edit amounts / estimate</button><div class="panel" style="margin-top:12px"><h3>Payments / expenses</h3>${payments.map(p=>paymentCardHTML(p)).join('')||'<div class="fact"><div class="label">AP</div><div>No payment / expense item recorded.</div></div>'}<button class="btn secondary" style="margin-top:9px" onclick="addPayment()">+ Add payment / expense</button></div></div><div id="sub-proof" class="subview"><div class="grid2"><div class="panel"><h3>Proof / results</h3>${o.proof.length?o.proof.map(x=>`<div class="fact"><div class="label">${esc(x.type)}</div><div>${esc(x.note)} · ${esc(x.received||'')}</div></div>`).join(''):'<div class="fact"><div class="label">Post-event</div><div>No proof attached yet.</div></div>'}<button class="btn secondary" onclick="openProofForm()">+ Add proof / report</button></div><div class="panel"><h3>What needs to come back</h3><div class="fact"><div class="label">Attendance / impressions</div><div>Keep open until the partner report lands.</div></div><div class="fact"><div class="label">Social</div><div>${esc(o.social.return||'Metrics / links when relevant.')}</div></div><div class="fact"><div class="label">Partner items</div><div>Missed items stay open until proof or makegood.</div></div>< function addObligation(){modal('Add what they owe us',commitById().name,`<form onsubmit="saveObligationQA(event)" class="formgrid"><div class="field c6"><label>What are they giving us?</label><input id="obName" required></div><div class="field c2"><label>Qty</label><input id="obExpected" value="1"></div><div class="field c4"><label>Due</label><input id="obDue" type="date"></div><div class="field c6"><label>Proof we expect</label><select id="obProof"><option>Partner report</option><option>Photo / video</option><option>Aircheck / screenshot</option><option>Attendance / impressions report</option><option>Other</option></select></div><div class="field c6"><label>Status</label><select id="obStatus"><option>Expected</option><option>Scheduled</option><option>Received</option><option>Missed / makegood needed</option><option>Makegood received</option></select></div><div class="c12"><button class="btn">Save</button></div></form>`)}

function renderIntakePage(el){el.innerHTML=`<div class="page">${pageHead('Intake','The form is the intake. Contract / email / workbook / Notion can fill it when you have that information. Submit creates Mayhem work and pushes the record to Notion.',`<button class="btn secondary" onclick="openFeedForm()">Use source to fill form</button>`)}<div class="formtabs"><button class="active" onclick="showIntakeForm('commitment',this)">New campaign / event</button><button onclick="showIntakeForm('update',this)">Update existing</button><button onclick="showIntakeForm('proof',this)">Proof / post-event</button><button onclick="showIntakeForm('contact',this)">Partner contact</button></div><div class="panel" id="intakeBody"></div></div>`;showIntakeForm('commitment',document.querySelector('.formtabs button'))}
const _qaBaseShowIntakeForm=showIntakeForm;
showIntakeForm=function(kind,btn){_qaBaseShowIntakeForm(kind,btn);setTimeout(()=>{let body=document.getElementById('intakeBody');if(!body)return;body.querySelectorAll('label').forEach(l=>{if(l.textContent.trim()==='Commitment type')l.childNodes[0].nodeValue='Type';if(l.textContent.trim()==='Commitment / event / campaign')l.childNodes[0].nodeValue='Campaign / event / sponsorship';if(l.textContent.trim()==='Commitment')l.childNodes[0].nodeValue='Campaign / event';if(l.textContent.trim()==='Hard date / launch')l.childNodes[0].nodeValue='Event / launch date'});let submit=body.querySelector('#commitmentForm button.btn:last-child');if(kind==='commitment'&&submit)submit.textContent='Create + push to Notion + build tickets';let change=[...body.querySelectorAll('button.btn')].find(x=>x.getAttribute('onclick')==='stageChange()');if(change)change.textContent='Review / apply change';let proof=[...body.querySelectorAll('button.btn')].find(x=>x.textContent.includes('Attach to commitment'));if(proof)proof.textContent='Attach proof / report';},0)}
function createCommitment(e){e.preventDefault();let b=document.getElementById('fBrand').value,d=document.getElementById('fDMA').value;if(!state.brands[b].markets[d])state.brands[b].markets[d]={memory:[],commitments:[]};let id='c'+Date.now(),kind=document.getElementById('fKind').value,anchor=document.getElementById('fAnchor').value,channels=selectedChannels();let c={id,kind,name:document.getElementById('fName').value.trim(),state:'Pre',anchor,partner:document.getElementById('fPartner').value.trim(),funding:document.getElementById('fFunding').value.trim(),channels:channels.map(x=>x.label).join(', '),channelPlan:channels,meta:'',money:{proposed:+document.getElementById('fProposed').value||0,contracted:+document.getElementById('fContracted').value||0,final:(+document.getElementById('fFinal').value||+document.getElementById('fContracted').value||0),estimate:document.getElementById('fEstimate').value}};state.brands[b].markets[d].commitments.push(c);state.currentBrand=b;state.currentDMA=d;state.currentCommit=id;let o=needObj(genericOps());o.needs=Object.assign(o.needs,readNeedSelections());o.needs.channels=channels;o.needs.creativeSpecs=[];for(let x of channels){if(['Radio','TV','Streaming Audio'].includes(x.label)&&x.lengths.length)o.needs.creativeSpecs.push({channel:x.label,media:x.label==='TV'?'TV':'Radio',lengths:x.lengths});if(['Display','OOH'].includes(x.label))o.needs.creative=true;if(x.label==='Meta')o.needs.meta=true;if(x.label==='Organic Social'||x.label==='Email')o.needs.social=true;let comp=complianceForChannel(x.label);o.compliance.push(comp);if(comp.gap)o.needs.ethics=true;if(comp.required&&['Radio','TV','Streaming Audio','Display','OOH','Meta','Organic Social','Email'].includes(x.label))o.needs.disclaimerFlag=true}if(o.needs.creativeSpecs.length)o.needs.creative=true;o.obligations=readOwedSelections();o.social.brief=o.needs.social?'Build the social / newsletter brief from the form; Content & Social receives only the relevant campaign facts.':'';state.ops[id]=o;addEvidence(id,'intake',`Intake form created · ${channels.map(x=>x.label+(x.lengths.length?' '+x.lengths.map(l=>':'+l).join('/'):'')).join(', ')||'no channel selected'}`);syncToNotion(c,'Created from Intake');saveState();go('tickets');setTimeout(()=>openTicketPlanner(id),30)}
function stageChange(){window.__mayhemPendingChange={field:document.getElementById('uField').value,current:document.getElementById('uCurrent').value,incoming:document.getElementById('uIncoming').value,source:document.getElementById('uSource').value,note:document.getElementById('uNote').value};let p=window.__mayhemPendingChange;modal('Review change',`${commitById().name} · ${p.source}`,`<div class="grid2"><div class="panel flat"><h3>Current</h3><div class="fact"><div class="label">${esc(p.field)}</div><div>${esc(p.current||'Not entered')}</div></div></div><div class="panel flat"><h3>Update</h3><div class="fact"><div class="label">${esc(p.field)}</div><div>${esc(p.incoming||'Not entered')}</div></div></div></div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="closeModal()">Keep current</button><button class="btn" onclick="applyStagedChange()">Apply update + push to Notion</button></div>`)}
function applyStagedChange(){let p=window.__mayhemPendingChange||{},field=p.field||'',incoming=p.incoming||'',source=p.source||'Manual',note=p.note||'',c=commitById(),o=currentOps();if(field==='Event / launch date'){let d=incoming.match(/\d{4}-\d{2}-\d{2}/)?.[0]||incoming;c.anchor=d}if(field==='Final cost')c.money.final=Number(String(incoming).replace(/[^0-9.]/g,''))||c.money.final;if(field==='Partner obligation')o.obligations.push({name:incoming,expected:'1',status:'Expected',proof:'Partner report'});state.ops[c.id]=o;state.sources.push({id:Date.now(),brand:state.currentBrand,dma:state.currentDMA,commit:c.id,type:source,name:'Update · '+field,status:'Applied',detail:`${incoming}${note?' · '+note:''}`});syncToNotion(c,`${field} updated from ${source}`);window.__mayhemPendingChange=null;closeModal();renderPage();toast('Updated here + pushed to Notion')}

function ticketProposalHTML(type,c,o){o=needObj(o);let role=ROUTE_FOR[type]||type,contact=roleContact(role),missingRoute=!contact?.email,ask=type==='Merch'?`Fulfill: ${(o.needs?.merchItems||[]).join(', ')||'selected merch'}`:type==='Creative'?missingCreativeAsk(c,o):bodyFor(type,c).split('\n\n')[2]||type;let extra=type==='Creative'?doomRecHTML(c,o):type==='Ethics'?complianceTicketHTML(o):'';return `<div class="ticketpick selected" data-type="${type}"><input class="check proposalChk" type="checkbox" checked onchange="this.closest('.ticketpick').classList.toggle('selected',this.checked)"><div class="type">${type}</div><div class="ask">${esc(ask||'Nothing new needed after Doom reuse')}</div><div class="route ${missingRoute?'missing':''}">To: ${esc(contactLabel(role))}<br>Due back: ${fmtDate(dueForNeed(type,c))} · needed for ${c.anchor?fmtDate(c.anchor):'event / launch date TBD'}</div><div class="actions"><button class="btn secondary" onclick="previewProposal('${type}')">Preview email</button></div>${extra}</div>`}
function openTicketPlanner(commitId=state.currentCommit,focus=''){state.currentCommit=commitId;saveState();let c=commitById(),o=needObj(currentOps()),types=suggestedTicketTypes(o),doomRows=creativeDoomState(c,o);if(o.needs.creative&&doomRows.length&&doomRows.every(x=>x.asset)&&!o.needs.merchDesign)types=types.filter(x=>x!=='Creative');if(focus&&!types.includes(focus))types.push(focus);modal('Build tickets',`${state.currentBrand} · ${state.currentDMA} · ${c.name}`,`${doomRecHTML(c,o)}<div class="tiny" style="margin-top:10px">Only work another person owes becomes a ticket. The ticket stays open until the requested item / approval / proof comes back.</div><div class="ticketplan" id="ticketPlan" style="margin-top:10px">${types.map(t=>ticketProposalHTML(t,c,o)).join('')||'<div class="fact"><div class="label">Tickets</div><div>No outside ticket is needed right now. Doom reuse / Ops-owned work already covers the selected needs.</div></div>'}</div><div class="panel flat" style="margin-top:10px"><h3>Add something you just discovered</h3><div class="pillrow"><button class="pillbtn" onclick="addNeedFromPlanner('Creative')">Creative</button><button class="pillbtn" onclick="openMerchNeedFromPlanner()">Merch</button><button class="pillbtn" onclick="addNeedFromPlanner('Ethics')">Ethics</button><button class="pillbtn" onclick="addNeedFromPlanner('Social')">Content & Social</button><button class="pillbtn" onclick="addNeedFromPlanner('SEO')">SEO</button><button class="pillbtn" onclick="addNeedFromPlanner('Meta')">Meta</button><button class="pillbtn" onclick="addNeedFromPlanner('Staffing')">Staffing</button><button class="pillbtn" onclick="addNeedFromPlanner('Finance')">Finance / AP</button></div></div><div style="margin-top:12px"><button class="btn" onclick="createSelectedTicketDrafts()">Create selected ticket drafts</button></div>`)}
function bodyFor(type,c=commitById(),extra=''){let o=needObj(currentOps()),lines=[`${c.name} — ${state.currentBrand} · ${state.currentDMA}`,c.anchor?`Event / launch date: ${fmtDate(c.anchor)}`:'Event / launch date: TBD'];if(type==='Creative'){lines.push(missingCreativeAsk(c,o)||'No net-new creative remains after Doom reuse.');let flags=(o.compliance||[]).filter(x=>x.required);if(flags.length)lines.push('Required disclaimer / tag context:\n'+flags.map(x=>`${x.label}: ${x.dmaText||''}${x.text?' | '+x.text:''}`).join('\n'))}if(type==='Ethics'){lines.push('Please review / confirm the current disclaimer or tag requirement.');let flags=(o.compliance||[]).filter(x=>x.required||x.gap);if(flags.length)lines.push(flags.map(x=>`${x.label}: ${x.dmaText||''}${x.text?' | '+x.text:''}`).join('\n'))}if(type==='Social')lines.push(`Content need: ${o.social?.brief||'Pre-event / campaign support and required post-event return.'}`);if(type==='Merch')lines.push(`Merch needed: ${(o.needs?.merchItems||[]).join(', ')||'selected merch'}`,`Design needed: ${o.needs?.merchDesign?'Yes — Creative is also ticketed.':'No / not selected.'}`);if(type==='SEO')lines.push('Please handle pixel / page-click tracking. UTMs and landing-page naming stay with Ops.');if(type==='Meta')lines.push('Meta support is routed through the Meta role. Please return the link / confirmation needed to close the ticket.');if(type==='Staffing')lines.push('Please confirm names / count / call time.');if(type==='Finance')lines.push(`Final: ${moneyFmt(c.money.final)} · Estimate: ${c.money.estimate||'TBD'}`,'Please confirm payment / expense routing and return the payment reference or exact missing information.');if(extra)lines.push(extra);return lines.join('\n\n')}
function createTicket(e){e.preventDefault();let type=document.getElementById('tType').value,role=ROUTE_FOR[type]||type,contact=roleContact(role),c=commitById(document.getElementById('tCommit').value),t={id:Date.now(),brand:state.currentBrand,dma:state.currentDMA,commit:c.id,type,ask:document.getElementById('tAsk').value,ownerRole:role,owner:contact?.name||document.getElementById('tOwner')?.value||role,to:contact?.email||'',sent:'',due:document.getElementById('tDue').value,protects:document.getElementById('tProtects').value||'Not set',status:'Draft',notes:document.getElementById('tNotes').value,subject:subjectFor(type,c),body:bodyFor(type,c,document.getElementById('tAsk').value),returnRequired:expectedReturn({type}),returnData:null,history:[]};state.tickets.push(t);saveState();closeModal();toast('Ticket draft created — what needs to come back is attached');renderPage();renderShell()}
function openNewTicket(commitId=state.currentCommit,type='Creative'){let c=commitById(commitId),role=ROUTE_FOR[type]||type,contact=roleContact(role);modal('New ticket',`${state.currentBrand} · ${state.currentDMA} · ${c.name}`,`<form onsubmit="createTicket(event)" class="formgrid"><input type="hidden" id="tCommit" value="${commitId}"><div class="field c3"><label>Type</label><select id="tType">${['Creative','Ethics','SEO','Social','Merch','Meta','Staffing','Finance','Partner','Vendor','Other'].map(x=>`<option ${x===type?'selected':''}>${x}</option>`).join('')}</select></div><div class="field c6"><label>What do you need back?</label><input id="tAsk" required></div><div class="field c3"><label>Goes to</label><input id="tOwner" value="${esc(contact?.name||role)}" readonly></div><div class="field c4"><label>Due back</label><input id="tDue" type="date" value="${esc(dueForNeed(type,c)||'')}"></div><div class="field c4"><label>Needed for</label><input id="tProtects" value="${esc(c.anchor?fmtDate(c.anchor):'event / launch date TBD')}"></div><div class="field c4"><label>Email</label><input value="${esc(contact?.email||'EMAIL MISSING — add it in Contacts')}" readonly></div><div class="field c12"><label>Notes / specs</label><textarea id="tNotes" rows="3"></textarea></div><div class="c12"><div class="loopbox"><div class="label">This ticket needs to come back with</div><div class="value">${esc(expectedReturn({type}))}</div></div></div><div class="c12"><button class="btn">Create ticket draft</button></div></form>`)}

const REPORT_SETUP={
 'Brand Monthly Update':{roles:['Events','Approval'],scope:'brand'},
 'All Brands Monthly Update':{roles:['Events','Approval'],scope:'all'},
 'Creative Brief':{roles:['Creative'],scope:'record'},
 'Content & Social Brief':{roles:['Social'],scope:'record'},

function reportRecords(rb=reportState()){
 if(rb.type==='All Brands Monthly Update')return allCommitments().filter(c=>!c.anchor||c.anchor.slice(0,7)===rb.month||/live|needs|decision/i.test(String(c.state)));
 let ds=rb.dma==='ALL'?markets(rb.brand):[rb.dma];let rows=[];for(let d of ds)rows.push(...state.brands[rb.brand].markets[d].commitments.map(c=>({...c,brand:rb.brand,dma:d})));
 if(REPORT_SETUP[rb.type].scope==='record'){let hit=rows.find(c=>c.id===rb.record);return hit?[hit]:rows.slice(0,1)}
 return rows.filter(c=>!c.anchor||c.anchor.slice(0,7)===rb.month||/live|needs|decision/i.test(String(c.state)));

const mtOldSend=sendTicket;sendTicket=function(id){let t=state.tickets.find(x=>String(x.id)===String(id));if(t){mtEnsure(t);let m=mtEmail(t),rec=mtRecipient(t.type,mtRecord(t),t.brand,t.dma);t.ask=mtAsk(t);t.subject=m.subject;t.body=m.body;t.due=t.brief.due;t.to=rec?.email||t.to;t.owner=rec?.org||MAYHEM_TICKET_NAMES[t.type]||t.type;saveState()}return mtOldSend(id)};
renderTicketsPage=function(el){let c=commitById(),ts=state.tickets.filter(t=>t.brand===state.currentBrand&&t.dma===state.currentDMA&&t.commit===c.id);el.innerHTML=`<div class="page">${pageHead('Tickets','Every ticket is a full brief: who, what, where, when, exact request, and what has to come back. The email is generated from the ticket.',`<button class="btn" onclick="openTicketPlanner('${c.id}')">Build Tickets</button>`)}<div class="panel"><h3>${esc(c.name)}</h3>${ts.length?ts.map(mtCard).join(''):'<div class="fact"><div class="label">Tickets</div><div>No tickets yet for this campaign / event.</div></div>'}<div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="openTicketPlanner('${c.id}')">Build from Intake</button><button class="btn ghost" onclick="mtOpenForm('','Creative','${c.id}')">+ Creative</button><button class="btn ghost" onclick="mtOpenForm('','Partner','${c.id}')">+ Partner</button></div></div></div>`};
function mtProposal(type,c){return mtMake(type,c,mtDefaultBrief(type,c))}
ticketProposalHTML=function(type,c,o){let t=mtProposal(type,c),rec=mtRecipient(type,c),b=t.brief;return `<div class="ticketpick selected" data-type="${type}"><input class="check proposalChk" type="checkbox" checked onchange="this.closest('.ticketpick').classList.toggle('selected',this.checked)"><div class="type">${esc(MAYHEM_TICKET_NAMES[type]||type)}</div><div class="ask">${esc(mtAsk(t))}</div><div class="route ${!rec?.email?'missing':''}">Who: ${esc(MAYHEM_TICKET_NAMES[type]||type)} · ${rec?.email?'route configured':'route missing'} · Where: ${esc(b.where||state.currentDMA)}<br>When: ${esc(mtWhen(b))} · Due back: ${b.due?fmtDate(b.due):'TBD'}<br>Returns with: ${esc(t.returnRequired)}</div><div class="actions"><button class="btn secondary" onclick="mtOpenForm('','${type}','${c.id}')">Review Ticket Form</button></div>${type==='Creative'?doomRecHTML(c,o):type==='Ethics'?complianceTicketHTML(o):''}</div>`};
previewProposal=function(type){mtOpenForm('',type,state.currentCommit)};
openTicketPlanner=function(record=state.currentCommit,focus=''){state.currentCommit=record;saveState();let c=commitById(),o=needObj(currentOps()),types=suggestedTicketTypes(o),doomRows=creativeDoomState(c,o);if(o.needs.creative&&doomRows.length&&doomRows.every(x=>x.asset)&&!o.needs.merchDesign)types=types.filter(x=>x!=='Creative');if(focus&&!types.includes(focus))types.push(focus);modal('Build Tickets',`${state.currentBrand} · ${state.currentDMA} · ${c.name}`,`${doomRecHTML(c,o)}<div class="tiny" style="margin-top:10px">Mayhem drafts the full ticket from Intake. Review only what needs changing; the email is generated from the ticket.</div><div class="ticketplan" style="margin-top:10px">${types.map(x=>ticketProposalHTML(x,c,o)).join('')||'<div class="fact"><div class="label">Tickets</div><div>No outside ticket is needed right now.</div></div>'}</div><div class="panel flat" style="margin-top:10px"><h3>Add a Ticket</h3><div class="pillrow">${MAYHEM_TICKET_TYPES.map(x=>`<button class="pillbtn" onclick="mtOpenForm('','${x}','${c.id}')">${x==='Social'?'Content & Social':x==='Meta'?'Meta':x}</button>`).join('')}</div></div><div style="margin-top:12px"><button class="btn" onclick="createSelectedTicketDrafts()">Create Selected Drafts</button></div>`)};
createSelectedTicketDrafts=function(){let c=commitById(),chosen=[...document.querySelectorAll('.proposalChk:checked')].map(x=>x.closest('.ticketpick').dataset.type),made=0;for(let type of chosen){if(state.tickets.some(t=>t.brand===state.currentBrand&&t.dma===state.currentDMA&&t.commit===c.id&&t.type===type&&t.status!=='Closed'))continue;state.tickets.push(mtMake(type,c));made++}saveState();closeModal();renderShell();renderPage();toast(`${made} detailed ticket draft${made===1?'':'s'} ready`)};
function mtReturnFields(t){let b=mtEnsure(t);if(t.type==='Creative')return `<div class="field c4"><label>Creative Title</label><input id="mtr_title" required></div><div class="field c4"><label>Returned Length(s)</label><select id="mtr_lengths"><option>As requested</option><option>:30 only</option><option>:15 only</option><option>:30 + :15</option><option>Non-video / non-audio asset</option></select></div><div class="field c4"><label>ISCI Status</label><select id="mtr_isciStatus"><option>Registered</option><option>Not registered yet</option><option>Not applicable</option></select></div><div class="field c6"><label>ISCI(s)</label><input id="mtr_isci"></div><div class="field c6"><label>Creative / Drive Link</label><input id="mtr_link" required></div>`;

 if(t.type==='Merch')return `<div class="field c3"><label>Status</label><select id="mtr_status"><option>Ordered</option><option>Production</option><option>Shipped</option><option>Delivered</option></select></div><div class="field c3"><label>Quantity Confirmed</label><input id="mtr_qty" type="number"></div><div class="field c3"><label>Tracking</label><input id="mtr_tracking"></div><div class="field c3"><label>Delivery Date</label><input id="mtr_date" type="date"></div>`;
 if(t.type==='Social')return `<div class="field c4"><label>Status</label><select id="mtr_status"><option>Scheduled</option><option>Live</option><option>Completed</option><option>Changes needed</option></select></div><div class="field c4"><label>Content / Newsletter Link</label><input id="mtr_link"></div><div class="field c4"><label>Post-event Metrics</label><select id="mtr_metrics"><option>Not due yet</option><option>Returned</option><option>Not required</option></select></div>`;
 if(t.type==='SEO')return `<div class="field c4"><label>Status</label><select id="mtr_status"><option>Live / verified</option><option>Needs changes</option><option>Blocked</option></select></div><div class="field c4"><label>Test Result</label><select id="mtr_test"><option>Passed</option><option>Failed</option><option>Pending</option></select></div><div class="field c4"><label>Proof / Screenshot Link</label><input id="mtr_link"></div>`;
 if(t.type==='Meta')return `<div class="field c4"><label>Status</label><select id="mtr_status"><option>Scheduled</option><option>Live</option><option>Completed</option><option>Changes needed</option></select></div><div class="field c4"><label>Live / Content Link</label><input id="mtr_link"></div><div class="field c4"><label>Confirmation</label><select id="mtr_confirm"><option>Confirmed</option><option>Needs follow-up</option></select></div>`;
 if(t.type==='Staffing')return `<div class="field c3"><label>Status</label><select id="mtr_status"><option>Confirmed</option><option>Partial</option><option>Needs replacement</option></select></div><div class="field c3"><label>Confirmed Count</label><input id="mtr_count" type="number"></div><div class="field c3"><label>Call Time</label><input id="mtr_call" type="time"></div><div class="field c3"><label>Names / Roster Link</label><input id="mtr_link"></div>`;
 if(t.type==='Finance')return `<div class="field c4"><label>Finance Response</label><select id="mtr_status"><option>Paid</option><option>Scheduled</option><option>Needs information</option></select></div><div class="field c4"><label>Reference / Confirmation</label><input id="mtr_ref"></div><div class="field c4"><label>Paid / Scheduled Date</label><input id="mtr_date" type="date"></div>`;
 return `<div class="field c4"><label>Response</label><select id="mtr_status"><option>Received / confirmed</option><option>Partial</option><option>Needs follow-up</option><option>Makegood required</option></select></div><div class="field c4"><label>Proof Type</label><select id="mtr_proof"><option>Partner report</option><option>Photo / video</option><option>Aircheck / screenshot</option><option>Attendance / impressions report</option><option>Confirmation</option></select></div><div class="field c4"><label>Proof / Report Link</label><input id="mtr_link"></div>`}
logTicketReturn=function(id){let t=state.tickets.find(x=>x.id===id);if(!t)return;modal('Log What Came Back',`${t.type} · ${mtRecord(t).name}`,`<form class="formgrid" onsubmit="mtSaveReturn(event,${id})">${mtReturnFields(t)}<div class="c12"><button class="btn">Save Return to Ticket + Campaign / Event</button></div></form>`)};
function mtSaveReturn(e,id){e.preventDefault();let t=state.tickets.find(x=>x.id===id),d={type:t.type};document.querySelectorAll('#modalBody [id^="mtr_"]').forEach(x=>d[x.id.replace('mtr_','')]=x.value);d.summary=Object.entries(d).filter(([k,v])=>k!=='type'&&v).map(([k,v])=>`${k}: ${v}`).join(' · ');t.returnData=d;t.returned=new Date().toISOString().slice(0,10);t.status='Received';t.history=t.history||[];t.history.push({date:t.returned,event:'Return received',detail:d.summary});let o=mtOps(mtRecord(t));if(t.type==='Creative'){o.creative.received=o.creative.received||[];o.creative.received.push({assetTitle:d.title||'',lengths:d.lengths||'',isci:d.isci||'',link:d.link||''});o.creative.status='Creative returned — review'}if(t.type==='Ethics')o.ethics={status:d.verdict||'Returned',detail:d.tag||''};addEvidence(t.commit,'return',`${t.type} returned · ${d.summary}`);saveState();closeModal();openTicket(id)}

function trackingInit(){
 state.landingPages=state.landingPages||[];state.utms=state.utms||[];state.utmReportLog=state.utmReportLog||[];state.notionTrackingPushes=state.notionTrackingPushes||[];
 state.teamContacts=state.teamContacts||[];
 if(!state.teamContacts.some(x=>x.role==='UTM Reporting'))state.teamContacts.push({id:'utm-reporting',role:'UTM Reporting',name:'UTM Reporting',email:'',scope:'Global',brand:'',dma:''});
 let ec=state.brands?.['Keches Law']?.markets?.Boston?.commitments?.find(x=>x.id==='espn'),eo=state.ops?.espn;
 if(ec&&eo?.seo?.landingPage&&eo.seo.landingPage!=='N/A'&&!state.landingPages.some(x=>(x.records||[]).includes('espn'))){state.landingPages.push({id:'lp-espn',brand:'Keches Law',dma:'Boston',scope:'DMA',name:eo.seo.landingPage,url:'',type:'Existing brand landing page',status:'URL needed',records:['espn'],created:'2026-08-24',updated:'2026-08-24',notionStatus:'Needs URL'});}
 saveState();
}
trackingInit();
function trackToday(){return new Date().toISOString().slice(0,10)}
function utmSlug(s){return String(s||'').toLowerCase().trim().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')}
function trackingRecord(id=state.currentCommit,b=state.currentBrand,d=state.currentDMA){return commitById(id,b,d)}
function landingPagesFor(c=commitById(),b=state.currentBrand,d=state.currentDMA){return (state.landingPages||[]).filter(x=>x.brand===b&&(x.scope==='Brand'||x.dma===d)&&((x.records||[]).includes(c.id)||x.scope==='Brand'||x.dma===d))}
function linkedLandingPages(c=commitById(),b=state.currentBrand,d=state.currentDMA){return (state.landingPages||[]).filter(x=>x.brand===b&&(x.records||[]).includes(c.id))}
function utmsFor(c=commitById(),b=state.currentBrand,d=state.currentDMA){return (state.utms||[]).filter(x=>x.brand===b&&x.dma===d&&x.record===c.id)}
function lpById(id){return (state.landingPages||[]).find(x=>String(x.id)===String(id))}
function utmById(id){return (state.utms||[]).find(x=>String(x.id)===String(id))}
function trackingNotionPayload(c){return {landingPages:linkedLandingPages(c).map(x=>({name:x.name,url:x.url,type:x.type,status:x.status,scope:x.scope})),utms:utmsFor(c).map(x=>({preset:x.preset,channel:x.channel,source:x.source,medium:x.medium,campaign:x.campaign,content:x.content,placement:x.placement,url:x.fullUrl,created:x.created}))}}
function syncTrackingToNotion(c,reason){c.tracking=trackingNotionPayload(c);state.notionTrackingPushes.push({id:Date.now(),brand:state.currentBrand,dma:state.currentDMA,record:c.id,date:trackToday(),reason,payload:c.tracking});syncToNotion(c,reason);addEvidence(c.id,'tracking',`${reason} · landing pages ${c.tracking.landingPages.length} · UTMs ${c.tracking.utms.length}`);saveState()}
function activeDoomRadio(b=state.currentBrand,d=state.currentDMA){let db=doomBrand(b),dm=doomDMA(d);let rows=DOOM_ISCI.filter(r=>r[3]===db&&r[4]===dm&&r[2]==='Radio'&&r[7]===true).sort((a,z)=>isciScore(z[0])-isciScore(a[0]));let seen=new Set();return rows.filter(r=>{let k=String(r[5]||'')||r[0];if(seen.has(k))return false;seen.add(k);return true}).slice(0,8)}
function addParams(base,params){let join=String(base||'').includes('?')?'&':'?';let q=Object.entries(params).filter(([k,v])=>v!==''&&v!==null&&v!==undefined).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');return q?String(base||'')+join+q:String(base||'')}
function openLandingPageForm(id=''){
 let c=commitById(),x=id?lpById(id):null;
 modal(id?'Edit landing page':'Add landing page',`${state.currentBrand} · ${state.currentDMA} · ${c.name}`,`<form class="formgrid" onsubmit="saveLandingPage(event,'${id}')"><div class="field c4"><label>Campaign / Event</label><input value="${esc(c.name)}" readonly></div><div class="field c4"><label>Store / Reuse</label><select id="lpScope"><option ${x?.scope==='DMA'?'selected':''}>DMA</option><option ${x?.scope==='Brand'?'selected':''}>Brand</option></select></div><div class="field c4"><label>Page Type</label><select id="lpType">${['Existing brand landing page','Campaign landing page','Event page','Partner page'].map(v=>`<option ${v===x?.type?'selected':''}>${v}</option>`).join('')}</select></div><div class="field c6"><label>Landing Page Name</label><input id="lpName" value="${esc(x?.name||c.name+' Landing Page')}" required></div><div class="field c6"><label>URL</label><input id="lpUrl" type="url" value="${esc(x?.url||'')}" placeholder="https://" required></div><div class="field c4"><label>Status</label><select id="lpStatus">${['Live','In Progress','Needs Update','Archived'].map(v=>`<option ${v===x?.status?'selected':''}>${v}</option>`).join('')}</select></div><div class="c8" style="align-self:end"><div class="tiny">Save links this page to the campaign / event and stores the page record in the Notion tracking payload.</div></div><div class="c12"><button class="btn">Save + sync to Notion</button></div></form>`)
}
function saveLandingPage(e,id){e.preventDefault();let c=commitById(),x=id?lpById(id):null,next={id:id||'lp'+Date.now(),brand:state.currentBrand,dma:state.currentDMA,scope:document.getElementById('lpScope').value,name:document.getElementById('lpName').value.trim(),url:document.getElementById('lpUrl').value.trim(),type:document.getElementById('lpType').value,status:document.getElementById('lpStatus').value,records:x?.records||[c.id],created:x?.created||trackToday(),updated:trackToday(),notionStatus:'Synced'};if(!next.records.includes(c.id))next.records.push(c.id);if(x)Object.assign(x,next);else state.landingPages.push(next);let o=needObj(state.ops[c.id]||genericOps());o.seo.landingPage=next.name;o.seo.landingPageUrl=next.url;state.ops[c.id]=o;syncTrackingToNotion(c,'Landing page saved in Mayhem');closeModal();renderPage();toast('Landing page saved + Notion synced')}
function openLandingRegistry(){let c=commitById(),rows=(state.landingPages||[]).filter(x=>x.brand===state.currentBrand&&(x.scope==='Brand'||x.dma===state.currentDMA));modal('Landing Page Registry',`${state.currentBrand} · ${state.currentDMA}`,`${rows.length?rows.map(x=>`<div class="registry-item"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.type)} · ${esc(x.scope)} · ${esc(x.status)}<br>${x.url?esc(x.url):'<span style="color:var(--red)">URL MISSING</span>'}</div></div><div class="actions">${(x.records||[]).includes(c.id)?'<span class="badge green">Linked here</span>':`<button class="btn secondary" onclick="linkLandingPage('${x.id}')">Link to ${esc(c.name)}</button>`}<button class="btn ghost" onclick="openLandingPageForm('${x.id}')">Edit</button></div></div>`).join(''):'<div class="fact"><div class="label">Landing Pages</div><div>None stored for this Brand / DMA yet.</div></div>'}<div class="actions" style="margin-top:10px"><button class="btn" onclick="openLandingPageForm()">+ Add landing page</button></div>`)}
function linkLandingPage(id){let x=lpById(id),c=commitById();x.records=x.records||[];if(!x.records.includes(c.id))x.records.push(c.id);x.updated=trackToday();x.notionStatus='Synced';syncTrackingToNotion(c,'Landing page linked to campaign / event');closeModal();renderPage();toast('Landing page linked + Notion synced')}
function utmPresetFields(){let preset=document.getElementById('ubPreset')?.value||'Pandora / SiriusXM',box=document.getElementById('utmPresetFields'),c=commitById(),radio=activeDoomRadio();if(!box)return;
 if(preset==='Pandora / SiriusXM'){let plan=(c.channelPlan||[]).find(x=>x.label==='Streaming Audio'||x.label==='Radio'),need=(plan?.lengths||[]).map(String);box.innerHTML=`<div class="c12"><div class="sectioncap">Doom ISCIs</div><div class="tiny">Latest active ISCI per length is shown first. Use the creative actually running.</div><div class="ticket-choice-grid" style="margin-top:7px">${radio.map((r,i)=>`<label class="ticket-choice ${(need.includes(String(r[5]))||(!need.length&&i===0))?'on':''}"><input type="checkbox" class="ubIsci" value="${esc(r[0])}" ${(need.includes(String(r[5]))||(!need.length&&i===0))?'checked':''} onchange="this.parentElement.classList.toggle('on',this.checked);previewUtmBuild()"><b>${esc(r[0])}</b><br>${esc(r[1])} · :${esc(r[5])}</label>`).join('')||'<div class="tiny">No active Radio ISCI found in Doom for this Brand / DMA.</div>'}</div></div><div class="field c6"><label>Manual ISCI only if Doom does not have it</label><input id="ubManualIsci" oninput="previewUtmBuild()"></div><div class="c12"><div class="sectioncap">Placement</div><div class="ticket-choice-grid">${['AudioSelect','CompanionBanners','DisplayBanners'].map(x=>`<label class="ticket-choice on"><input type="checkbox" class="ubPlacement" value="${x}" checked onchange="this.parentElement.classList.toggle('on',this.checked);previewUtmBuild()">${x}</label>`).join('')}</div></div>`}
 else if(preset==='ESPN Digital'){box.innerHTML=`<div class="field c6"><label>Doom Campaign Key</label><input id="ubCampaignKey" value="${esc(utmSlug(c.name))}" oninput="previewUtmBuild()"></div><div class="c6" style="align-self:end"><div class="tiny">Doom pattern: Video / ESPNweb, Video / GKBPS, Display / ESPNweb.</div></div>`}
 else {box.innerHTML=`<div class="field c4"><label>Source</label><input id="ubSource" value="${preset==='Spotify / Generic'?'spotify':''}" oninput="previewUtmBuild()"></div><div class="field c4"><label>Medium</label><select id="ubMedium" onchange="previewUtmBuild()"><option>audio</option><option>display</option><option>social</option><option>email</option><option>video</option><option>other</option></select></div><div class="field c4"><label>Campaign</label><input id="ubCampaign" value="${esc(utmSlug(c.name))}" oninput="previewUtmBuild()"></div><div class="field c6"><label>Content / ISCI</label><input id="ubContent" placeholder="Optional" oninput="previewUtmBuild()"></div><div class="field c6"><label>Placement</label><input id="ubPlacementManual" placeholder="Optional" oninput="previewUtmBuild()"></div>`}
 previewUtmBuild();
}

 else {let source=document.getElementById('ubSource')?.value.trim(),medium=document.getElementById('ubMedium')?.value||'',campaign=document.getElementById('ubCampaign')?.value.trim()||utmSlug(c.name),content=document.getElementById('ubContent')?.value.trim(),placement=document.getElementById('ubPlacementManual')?.value.trim();rows.push({preset,channel,source,medium,campaign,content,placement,fullUrl:addParams(base,{utm_source:source,utm_medium:medium,utm_campaign:campaign,utm_content:content,Placement:placement})})}
