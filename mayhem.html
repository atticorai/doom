function bodyFor(type,c=commitById(),extra=''){let o=currentOps();let lines=[`${c.name} — ${state.currentBrand} · ${state.currentDMA}`,c.anchor?`Hard date: ${fmtDate(c.anchor)}`:'Hard date: TBD'];if(type==='Creative')lines.push('Please create only the missing asset(s). Mayhem checks Doom first so existing approved creative is reused.');if(type==='Ethics')lines.push('Please review the attached / linked copy using the current disclaimer-library context. Ethics remains the approval gate.');if(type==='Social')lines.push(`Content need: ${o.social?.brief||'Pre-event / campaign support and required post-event return.'}`);if(type==='Merch')lines.push(`Merch needed: ${(o.needs?.merchItems||[]).join(', ')||'Merch details selected on the commitment.'}`,`Design needed: ${o.needs?.merchDesign?'Yes — Creative is also routed.':'No / not selected.'}`);if(type==='SEO')lines.push('Please handle pixel / page-click tracking work for this commitment. UTMs and landing-page naming stay with Ops.');if(type==='Meta')lines.push('Meta support is routed through the Meta role based on the campaign form.');if(type==='Staffing')lines.push('Please confirm the staffing names / count / call-time details needed for this commitment.');if(type==='Finance')lines.push(`Final committed: ${moneyFmt(c.money.final)} · Estimate: ${c.money.estimate||'TBD'}`,'Please confirm the payment-routing/support requirements and what is still needed.');if(extra)lines.push(extra);return lines.join('\n\n')}

let state=loadState();
function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){try{let x=window.MAYHEM_INITIAL_STATE||(window.parent&&window.parent!==window?window.parent.MAYHEM_INITIAL_STATE:null);return x?clone(x):clone(SEED)}catch(e){return clone(SEED)}}
function saveState(){try{let h=window.MAYHEM_HOST||(window.parent&&window.parent!==window?window.parent.MAYHEM_HOST:null);if(h&&typeof h.saveState==='function')h.saveState(state)}catch(e){}return state}
function resetState(){toast('Reset is disabled in integrated Mayhem')}
function brands(){return Object.keys(state.brands)}
function markets(b=state.currentBrand){return Object.keys(state.brands[b].markets)}
function market(b=state.currentBrand,d=state.currentDMA){return state.brands[b].markets[d]}
function commitments(b=state.currentBrand,d=state.currentDMA){return market(b,d).commitments}
function commitById(id=state.currentCommit,b=state.currentBrand,d=state.currentDMA){return commitments(b,d).find(c=>c.id===id)||commitments(b,d)[0]}
function currentOps(){return state.ops[state.currentCommit]||genericOps()}
function genericOps(){return {anchors:[],decision:'',creative:{status:'Reuse first',detail:'Check Doom before net-new creative.'},ethics:{status:'Check if needed',detail:'Load disclaimer context when the channel requires it.'},merch:[],social:{brief:'',album:'',return:''},seo:{utm:'',landingPage:'',pixels:''},staffing:[],obligations:[],proof:[],needs:{creative:false,ethics:false,social:false,merch:false,merchDesign:false,merchItems:[],seo:false,meta:false,staffing:false,finance:false},evidence:[]}}
function moneyFmt(n){return '$'+Number(n||0).toLocaleString()}
function fmtDate(s){if(!s)return 'TBD';let d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function phaseFor(c){if(c.state&&String(c.state).toLowerCase().includes('wrap'))return 'POST';if(c.state&&String(c.state).toLowerCase().includes('live'))return 'LIVE';return 'PRE'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function repoBrand(){return window.MAYHEM_DISCLAIMERS?.[REPO_BRAND_MAP[state.currentBrand]]||{dmas:[],channels:[]}}
function repoDMA(){let n=state.currentDMA.toLowerCase();return repoBrand().dmas.find(x=>(x.dma||'').toLowerCase().includes(n)||(x.markets||'').toLowerCase().includes(n))||null}
function repoChannel(ch='Radio'){return repoBrand().channels.find(x=>x.channel===ch)||null}
function disclaimerStatus(r){if(!r)return ['Missing','red'];let t=(r.text||'').toLowerCase();if(t.startsWith('tbd')||t.includes('need to make a disclaimer'))return ['Gap','red'];if(t.startsWith('pending'))return ['Pending','gold'];return ['Language present','green']}
function routeParts(){let h=(location.hash||'#/home').replace(/^#\/?/,'');return h.split('/').filter(Boolean)}
function pageName(){let p=routeParts()[0]||'home';p=p.replace('.html','').replace('index','home');return ['home','brands','commitment','intake','tickets','finance','reports','tracking','library','registry'].includes(p)?p:'home'}
function pageFile(p){return '#/'+p}
function go(p){if(location.hash===pageFile(p)){renderShell();renderPage()}else location.hash=pageFile(p)}
function setBrand(b){state.currentBrand=b;state.currentDMA=markets(b)[0];state.currentCommit=commitments(b,state.currentDMA)[0]?.id||'';saveState();renderShell();renderPage()}
function setDMA(d){state.currentDMA=d;state.currentCommit=commitments(state.currentBrand,d)[0]?.id||'';saveState();renderShell();renderPage()}
function setCommit(id){state.currentCommit=id;saveState();renderShell();renderPage()}
function theme(){return localStorage.getItem(THEME_STORE)||'dark'}
function applyTheme(){document.body.classList.toggle('light',theme()==='light');let b=document.getElementById('themeBtn');if(b)b.textContent=theme()==='light'?'☾':'☀'}
function toggleTheme(){localStorage.setItem(THEME_STORE,theme()==='light'?'dark':'light');applyTheme()}
function navLink(page,label,count=''){return `<a class="navlink ${pageName()===page?'active':''}" href="#/${page}" onclick="go('${page}');return false"><span>${label}</span>${count!==''?`<span class="count">${count}</span>`:''}</a>`}
function shellHTML(){return `
<header class="topbar" id="topbar"><div class="branding"><div><div class="doom">Doom & Deliverables</div><div class="mayhem"><span class="slash">/</span> MAYHEM</div></div></div><div class="brand-switch">${brands().map(b=>`<button class="${b===state.currentBrand?'active':''}" onclick="setBrand('${b.replaceAll("'","\\'")}')"><span class="full">${esc(b)}</span><span class="short">${BRAND_SHORT[b]}</span></button>`).join('')}</div><button class="theme" id="themeBtn" onclick="toggleTheme()">☀</button></header>
<aside class="sidebar" id="sidebar"><div class="navhead">Mayhem</div>${navLink('home','Home')}${navLink('brands','Brands')}${navLink('intake','Intake')}${navLink('tickets','Tickets',state.tickets.filter(t=>t.status!=='Closed').length)}${navLink('finance','Finance')}${navLink('reports','Reports & Exports')}${navLink('library','Disclaimer Library')}${navLink('registry','Contacts & Routing')}<div class="sidefoot">Mayhem is built as a routed app so it can mount inside Doom without turning Doom into one giant page.</div></aside>
<div class="contextbar" id="contextbar"><label>DMA</label><select onchange="setDMA(this.value)">${markets().map(d=>`<option ${d===state.currentDMA?'selected':''}>${esc(d)}</option>`).join('')}</select><label>Commitment</label><select onchange="setCommit(this.value)">${commitments().map(c=>`<option value="${c.id}" ${c.id===state.currentCommit?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div class="spacer"></div><button class="btn secondary" onclick="go('commitment')">Open commitment</button><button class="btn" onclick="go('intake')">+ Intake form</button></div>`}
function renderShell(){['topbar','sidebar','contextbar'].forEach(id=>{let e=document.getElementById(id);if(e)e.outerHTML=''});document.getElementById('app').insertAdjacentHTML('afterbegin',shellHTML());applyTheme()}
function initShell(){let app=document.getElementById('app');app.insertAdjacentHTML('afterbegin',shellHTML());applyTheme();renderPage()}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function modal(title,sub,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalSub').textContent=sub||'';document.getElementById('modalBody').innerHTML=body;document.getElementById('modalback').classList.add('open')}
function closeModal(){document.getElementById('modalback').classList.remove('open')}
function routeToCommit(b,d,id){state.currentBrand=b;state.currentDMA=d;state.currentCommit=id;saveState();go('commitment')}
function allCommitments(){let out=[];for(let [b,bo] of Object.entries(state.brands))for(let [d,mo] of Object.entries(bo.markets))for(let c of mo.commitments)out.push({...c,brand:b,dma:d});return out}
function totalCommitted(b){return allCommitments().filter(x=>!b||x.brand===b).reduce((s,x)=>s+Number(x.money?.final||0),0)}
function findCommitName(id,b,d){return commitById(id,b,d)?.name||id}

function renderPage(){let target=document.getElementById('page');if(!target)return;({home:renderHome,brands:renderBrandsPage,commitment:renderCommitmentPage,intake:renderIntakePage,tickets:renderTicketsPage,finance:renderFinancePage,reports:renderReportsPage,tracking:renderTrackingPage,library:renderLibraryPage,registry:renderRegistryPage}[pageName()]||renderHome)(target);applyTheme()}

function renderIntakePage(el){el.innerHTML=`<div class="page">${pageHead('Intake','The form is the intake. Mayhem only uses contracts, emails, sheets or Notion to prefill this form when that information exists.') }<div class="formtabs"><button class="active" onclick="showIntakeForm('commitment',this)">Commitment form</button><button onclick="showIntakeForm('update',this)">Change / update</button><button onclick="showIntakeForm('proof',this)">Proof / report</button><button onclick="showIntakeForm('contact',this)">Partner contact</button></div><div class="panel" id="intakeBody"></div></div>`;showIntakeForm('commitment',document.querySelector('.formtabs button'))}
function activateForm(btn){document.querySelectorAll('.formtabs button').forEach(x=>x.classList.remove('active'));btn?.classList.add('active')}
function showIntakeForm(kind,btn){activateForm(btn);let c=commitById();let b='';if(kind==='commitment')b=`<div class="feedbar"><div class="copy"><b>Start with the form.</b> If you already have a contract, email, workbook or copied partner note, Mayhem can use it to fill fields for you — optional, never required.</div><button class="btn secondary" onclick="openFeedForm()">Feed this form</button></div><form onsubmit="createCommitment(event)" class="formgrid" id="commitmentForm"><div class="field c4"><label>Brand</label><select id="fBrand" onchange="intakeBrandChanged()">${brands().map(x=>`<option ${x===state.currentBrand?'selected':''}>${x}</option>`).join('')}</select></div><div class="field c4"><label>DMA</label><select id="fDMA">${markets().map(x=>`<option ${x===state.currentDMA?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field c4"><label>Commitment type</label><select id="fKind" onchange="renderIntakeChoices()"><option>Event + Sponsorship</option><option>Event</option><option>Sponsorship</option><option>Partnership</option><option>Sports Partnership</option><option>Media Flight</option><option>Community</option><option>Appearance</option><option>Vendor Agreement</option></select></div><div class="field c7"><label>Commitment / event / campaign</label><input id="fName" required placeholder="Name"></div><div class="field c5"><label>Partner / vendor</label><input id="fPartner" placeholder="Select existing or enter once"></div><div class="field c4"><label>Hard date / launch</label><input id="fAnchor" type="date"></div><div class="field c2"><label>Proposed $</label><input id="fProposed" type="number"></div><div class="field c2"><label>Contracted $</label><input id="fContracted" type="number"></div><div class="field c2"><label>Final $</label><input id="fFinal" type="number"></div><div class="field c2"><label>Estimate #</label><input id="fEstimate"></div><div class="field c4"><label>Funding entity if different</label><input id="fFunding"></div><div class="field c8"><label>Channels / activation notes</label><input id="fChannels" placeholder="Radio, event booth, TV, digital, etc. — short factual note"></div><div class="c12"><div class="sectioncap">What are they giving us?</div><div class="choicegrid" id="owedChoices"></div></div><div class="c12"><div class="sectioncap">What do we need to make it happen?</div><div class="choicegrid" id="needChoices"></div><div id="merchChoiceDetails"></div></div><div class="c12"><div class="sectioncap">Mayhem will route this after create</div><div class="tiny">Selected needs become proposed handoffs automatically. You can uncheck any proposal before creating/sending it. Recipient names and emails come from Contacts & Routing — not from this form.</div></div><div class="c12"><button class="btn">Create commitment + build work</button></div></form>`;else if(kind==='update')b=`<h3>Change / update</h3><div class="feedbar"><div class="copy">Use this when reality changes after intake. If the change arrived in email / Notion / a document, feed it here so you confirm the difference instead of retyping it.</div><button class="btn secondary" onclick="openFeedChange()">Feed update</button></div><div class="formgrid"><div class="field c4"><label>Commitment</label><input value="${esc(c.name)}" readonly></div><div class="field c4"><label>Field</label><select id="uField"><option>Event / launch date</option><option>Final cost</option><option>Partner obligation</option><option>Owner</option><option>Deliverable</option></select></div><div class="field c4"><label>Source</label><select id="uSource"><option>Email</option><option>Notion</option><option>Contract amendment</option><option>Excel</option><option>Partner update</option></select></div><div class="field c6"><label>Current value</label><input id="uCurrent"></div><div class="field c6"><label>Incoming value</label><input id="uIncoming"></div><div class="field c12"><label>Evidence / note</label><textarea id="uNote" rows="3"></textarea></div><div class="c12"><button class="btn" onclick="stageChange()">Stage for reconciliation</button></div></div>`;else if(kind==='proof')b=`<h3>Proof / report intake</h3><form onsubmit="attachProof(event)" class="formgrid"><div class="field c4"><label>Commitment</label><input value="${esc(c.name)}" readonly></div><div class="field c4"><label>Proof type</label><select id="pType"><option>Attendance report</option><option>Partner delivery proof</option><option>Social metrics</option><option>Press / coverage</option><option>Photo / video proof</option><option>Expense support</option></select></div><div class="field c4"><label>Received from</label><input id="pFrom"></div><div class="field c12"><label>Notes / link</label><textarea id="pNote" rows="4" required></textarea></div><div class="c12"><button class="btn">Attach to commitment</button></div></form>`;else b=`<h3>Partner contact</h3><form onsubmit="addContact(event)" class="formgrid"><div class="field c4"><label>Brand</label><input value="${esc(state.currentBrand)}" readonly></div><div class="field c4"><label>DMA</label><input value="${esc(state.currentDMA)}" readonly></div><div class="field c4"><label>Organization</label><input id="ctOrg" required></div><div class="field c4"><label>Name</label><input id="ctName"></div><div class="field c4"><label>Role / authority</label><input id="ctRole"></div><div class="field c4"><label>Email</label><input id="ctEmail" type="email"></div><div class="field c12"><label>Ship-to / address</label><textarea id="ctShip" rows="2"></textarea></div><div class="c12"><button class="btn">Save to DMA contacts</button></div></form>`;document.getElementById('intakeBody').innerHTML=b;if(kind==='commitment')setTimeout(renderIntakeChoices,0)}
function createCommitment(e){e.preventDefault();let b=document.getElementById('fBrand').value,d=document.getElementById('fDMA').value;if(!state.brands[b].markets[d])state.brands[b].markets[d]={memory:[],commitments:[]};let id='c'+Date.now(),kind=document.getElementById('fKind').value,anchor=document.getElementById('fAnchor').value;let c={id,kind,name:document.getElementById('fName').value.trim(),state:'Pre',anchor,partner:document.getElementById('fPartner').value.trim(),funding:document.getElementById('fFunding').value.trim(),channels:document.getElementById('fChannels').value.trim(),meta:`${anchor?fmtDate(anchor):'Anchor TBD'} · ${moneyFmt(document.getElementById('fFinal').value||document.getElementById('fContracted').value||0)}`,money:{proposed:+document.getElementById('fProposed').value||0,contracted:+document.getElementById('fContracted').value||0,final:(+document.getElementById('fFinal').value||+document.getElementById('fContracted').value||0),estimate:document.getElementById('fEstimate').value}};state.brands[b].markets[d].commitments.push(c);let o=genericOps();o.needs=readNeedSelections();o.obligations=readOwedSelections();o.social.brief=o.needs.social?'Create the content/newsletter brief from campaign facts; Content & Social receives only the relevant campaign facts.':'';state.ops[id]=o;state.currentBrand=b;state.currentDMA=d;state.currentCommit=id;saveState();go('tickets');setTimeout(()=>openTicketPlanner(id),30)}
function readIngestFile(input){let f=input.files?.[0];if(!f)return;let name=document.getElementById('feedName');if(name)name.value=f.name}
function stageSource(){}
function stageChange(){state.sources.push({id:Date.now(),brand:state.currentBrand,dma:state.currentDMA,commit:state.currentCommit,type:document.getElementById('uSource').value,name:'Staged '+document.getElementById('uField').value,status:'Conflict / review',detail:`Current: ${document.getElementById('uCurrent').value} | Incoming: ${document.getElementById('uIncoming').value} | ${document.getElementById('uNote').value}`});saveState();toast('Change staged for reconciliation')}
function attachProof(e){e.preventDefault();let o=state.ops[state.currentCommit]||(state.ops[state.currentCommit]=genericOps());o.proof.push({type:document.getElementById('pType').value,received:document.getElementById('pFrom').value,note:document.getElementById('pNote').value});saveState();toast('Proof attached');go('commitment')}
function addContact(e){e.preventDefault();state.contacts.push({brand:state.currentBrand,dma:state.currentDMA,org:document.getElementById('ctOrg').value,name:document.getElementById('ctName').value,role:document.getElementById('ctRole').value,email:document.getElementById('ctEmail').value,shipTo:document.getElementById('ctShip').value});saveState();toast('Contact saved to DMA memory')}

function renderTicketsPage(el){let c=commitById();let ts=state.tickets.filter(t=>t.brand===state.currentBrand&&t.dma===state.currentDMA&&t.commit===c.id);el.innerHTML=`<div class="page">${pageHead('Tickets & handoffs','Open the commitment, see what Mayhem thinks is missing, choose what actually needs to leave your desk, preview the real email, then send.',`<button class="btn" onclick="openTicketPlanner('${c.id}')">Build / change tickets</button>`)}<div class="panel"><h3>${esc(c.name)} · handoffs</h3>${ts.length?ts.map(t=>ticketRowHTML(t)).join(''):'<div class="fact"><div class="label">Tickets</div><div>No handoffs created yet. Mayhem can build them from the intake selections.</div></div>'}<div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="openTicketPlanner('${c.id}')">Review what is missing</button></div></div></div>`}
function openNewTicket(commitId=state.currentCommit,type='Creative'){openTicketPlanner(commitId,type)}
function ticketAssist(){}
function createTicket(e){e?.preventDefault?.();}
function advanceTicket(id,status){let t=state.tickets.find(x=>x.id===id);if(t){t.status=status;saveState();renderPage();toast('Ticket updated')}}

function renderFinancePage(el){let cs=commitments(),ps=state.payments.filter(p=>p.brand===state.currentBrand&&p.dma===state.currentDMA);el.innerHTML=`<div class="page">${pageHead('Finance routing','Finance is where Mayhem packages the Finance / AP request and routes it. The numbers are context; the work is the request, support, status and proof.',`<button class="btn" onclick="addPayment()">+ Payment requirement</button>`)}<div class="grid3"><div class="stat"><b>${moneyFmt(ps.filter(p=>p.status!=='Paid').reduce((s,p)=>s+p.amount,0))}</b><span>still to route / pay</span></div><div class="stat"><b>${ps.filter(p=>p.status==='Sent to Finance').length}</b><span>with finance</span></div><div class="stat"><b>${ps.filter(p=>p.status==='Paid').length}</b><span>paid / closed</span></div></div><div class="panel" style="margin-top:12px"><h3>Payment packets · ${esc(state.currentDMA)}</h3>${ps.map(p=>paymentCardHTML(p)).join('')||'<div class="fact"><div class="label">Payments</div><div>No payment requirements recorded for this DMA.</div></div>'}</div><div class="panel" style="margin-top:12px"><h3>Commitment money context</h3>${cs.map(c=>`<div class="payment"><div>${c.money.estimate||'TBD'}</div><div><b>${esc(c.name)}</b><div class="meta">Proposed ${moneyFmt(c.money.proposed)} · Contracted ${moneyFmt(c.money.contracted)} · Final ${moneyFmt(c.money.final)}</div></div><button class="btn secondary" onclick="routeToCommit('${state.currentBrand.replaceAll("'","\\'")}','${state.currentDMA.replaceAll("'","\\'")}','${c.id}')">Open</button></div>`).join('')}</div></div>`}
function addPayment(){let c=commitById();modal('Add payment requirement',`${state.currentBrand} · ${state.currentDMA} · ${c.name}`,`<form class="formgrid" onsubmit="savePayment(event)"><div class="field c4"><label>Vendor / partner</label><input id="payVendor" value="${esc(c.partner||'')}" required></div><div class="field c2"><label>Amount</label><input id="payAmount" type="number" value="${c.money.final||''}" required></div><div class="field c3"><label>Due date</label><input id="payDue" type="date" required></div><div class="field c3"><label>Funding entity</label><input id="payFunding" value="${esc(c.funding||state.currentBrand)}"></div><div class="field c6"><label>Source / support</label><input id="paySource" placeholder="Contract / approval / expense support"></div><div class="field c6"><label>Note</label><input id="payNote"></div><div class="c12"><button class="btn">Add + prepare Finance route</button></div></form>`) }
function savePayment(e){e.preventDefault();state.payments.push({id:Date.now(),brand:state.currentBrand,dma:state.currentDMA,commit:state.currentCommit,vendor:document.getElementById('payVendor').value,amount:+document.getElementById('payAmount').value,due:document.getElementById('payDue').value,status:'Needs routing',funding:document.getElementById('payFunding').value,source:document.getElementById('paySource').value,note:document.getElementById('payNote').value});saveState();closeModal();renderPage();toast('Payment packet ready to route')}
function markPayment(id){let p=state.payments.find(x=>x.id===id);if(p){p.status=p.status==='Paid'?'Needs routing':'Paid';addEvidence(p.commit,'finance',`${p.vendor} ${moneyFmt(p.amount)} marked ${p.status}`);saveState();renderPage()}}

function renderReportsPage(el){let month=state.reportMonth||'2026-09';el.innerHTML=`<div class="page">${pageHead('Reports & emails','The monthly visibility report is an email generated from the whole book — Brand → DMA → commitments — not a Sister Strut summary.',`<button class="btn secondary" onclick="downloadLeadership()">Export data</button>`)}<div class="mailreport"><div class="toolbar"><div class="field"><label>Month</label><input id="reportMonth" type="month" value="${month}" onchange="state.reportMonth=this.value;saveState();renderMonthlyEmail()"></div><div class="field" style="min-width:250px"><label>Recipients</label><div class="pillrow" id="reportRecipients"></div></div><div style="margin-left:auto"><button class="btn secondary" onclick="renderMonthlyEmail()">Refresh email</button></div></div><div class="content" id="monthlyEmail"></div></div><div class="grid2" style="margin-top:12px"><div class="panel"><h3>Learned output profiles</h3>${state.templates.map(t=>`<div class="workline"><div class="top"><div class="name">${esc(t.name)}</div><span class="badge ${t.status==='Mapped'?'green':'gold'}">${t.status}</span></div><div class="detail">${esc(t.audience)} · ${esc(t.format)}</div><div class="actions"><button class="btn secondary" onclick="previewTemplate('${t.name.replaceAll("'","\\'")}')">Preview</button></div></div>`).join('')}</div><div class="panel"><h3>Other generated sends</h3><div class="workline"><div class="name">Content & Social brief</div><div class="detail">Generated from one campaign and routed to Content & Social.</div></div><div class="workline"><div class="name">Finance payment packet</div><div class="detail">Generated from campaign + payment terms and routed to Finance / AP.</div></div><div class="workline"><div class="name">Post-event recap</div><div class="detail">Generated when proof / results close the commitment.</div></div></div></div></div>`;setTimeout(()=>{renderReportRecipients();renderMonthlyEmail()},0)}
function downloadLeadership(){let rows=[['Brand','DMA','Commitment','State','Final','Estimate']];allCommitments().forEach(c=>rows.push([c.brand,c.dma,c.name,c.state,c.money.final,c.money.estimate]));let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');downloadBlob(csv,'mayhem_leadership_visibility.csv','text/csv')}
function downloadBlob(content,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function previewTemplate(name){modal(name,'Familiar output generated from current Mayhem truth',`<div class="panel flat"><h3>Workbook preview</h3><table class="ticket-table"><tr><th>Brand</th><th>DMA</th><th>Activation</th><th>Event Date</th><th>Final Cost</th><th>Status</th></tr>${allCommitments().filter(c=>c.brand===state.currentBrand).slice(0,6).map(c=>`<tr><td>${esc(c.brand)}</td><td>${esc(c.dma)}</td><td>${esc(c.name)}</td><td>${fmtDate(c.anchor)}</td><td>${moneyFmt(c.money.final)}</td><td>${esc(c.state)}</td></tr>`).join('')}</table></div>`)}
function previewAudience(kind){let c=commitById(),o=currentOps();let body=kind==='Content & Social'?`<div class="fact"><div class="label">Commitment</div><div>${esc(c.name)}</div></div><div class="fact"><div class="label">Need</div><div>${esc(o.social.brief||'No social need recorded.')}</div></div><div class="fact"><div class="label">Return</div><div>${esc(o.social.return||'Metrics / links when relevant')}</div></div>`:kind==='Finance'?`<div class="fact"><div class="label">Final</div><div>${moneyFmt(c.money.final)}</div></div><div class="fact"><div class="label">Estimate</div><div>${esc(c.money.estimate||'TBD')}</div></div>`:kind==='Merch'?o.merch.map(x=>`<div class="fact"><div class="label">${esc(x.item)}</div><div>${esc(x.qty)} · ${esc(x.shipTo)} · arrive ${esc(x.arrive)}</div></div>`).join('')||'<div class="fact"><div class="label">Merch</div><div>No merch requirement.</div></div>':`<div class="fact"><div class="label">Wrap</div><div>Attendance · impressions · social · press · partner delivery · final spend · proof · makegoods · playbook learning.</div></div>`;modal(kind+' output',`${state.currentBrand} · ${state.currentDMA} · ${c.name}`,body)}

function renderLibraryPage(el){let rb=repoBrand(),d=repoDMA(),channels=rb.channels||[];let ch=channels.find(x=>x.channel==='Radio')?.channel||channels[0]?.channel||'';el.innerHTML=`<div class="page">${pageHead('Master Disclaimer Library','The actual repository is a shared intelligence source. Brand + DMA context is inherited from Mayhem; channel is selected here.') }<div class="repo-controls"><div class="field"><label>Brand</label><select id="libBrand" onchange="libraryBrandChanged()">${Object.keys(window.MAYHEM_DISCLAIMERS||{}).map(x=>`<option ${x===REPO_BRAND_MAP[state.currentBrand]?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>DMA / market</label><select id="libDMA" onchange="renderLibraryResult()"></select></div><div class="field"><label>Channel</label><select id="libChannel" onchange="renderLibraryResult()"></select></div></div><div id="libraryResult"></div></div>`;setTimeout(()=>{libraryBrandChanged();let dmaSel=document.getElementById('libDMA');if(d)[...dmaSel.options].forEach((o,i)=>{if(o.value===d.dma)dmaSel.selectedIndex=i});let channel=document.getElementById('libChannel');[...channel.options].forEach((o,i)=>{if(o.value===ch)channel.selectedIndex=i});renderLibraryResult()},0)}
function libraryBrandChanged(){let b=document.getElementById('libBrand').value,rb=window.MAYHEM_DISCLAIMERS[b];document.getElementById('libDMA').innerHTML=rb.dmas.map(x=>`<option value="${esc(x.dma)}">${esc(x.dma)}</option>`).join('');document.getElementById('libChannel').innerHTML=rb.channels.map(x=>`<option value="${esc(x.channel)}">${esc(x.channel)}</option>`).join('');renderLibraryResult()}
function renderLibraryResult(){let b=document.getElementById('libBrand')?.value;if(!b)return;let rb=window.MAYHEM_DISCLAIMERS[b],dn=document.getElementById('libDMA').value,ch=document.getElementById('libChannel').value,d=rb.dmas.find(x=>x.dma===dn),r=rb.channels.find(x=>x.channel===ch),s=disclaimerStatus(r);document.getElementById('libraryResult').innerHTML=`<div class="repo-grid"><div class="panel"><h3>DMA / state context</h3><div class="fact"><div class="label">DMA</div><div>${esc(d?.dma||'')}</div></div><div class="fact"><div class="label">State</div><div>${esc(d?.state||'')}</div></div><div class="fact"><div class="label">Requirement</div><div>${esc(d?.state_note||'')}</div></div><div class="fact"><div class="label">OOH</div><div>${esc(d?.ooh||'')}</div></div><div class="fact"><div class="label">Confidence</div><div>${esc(d?.confidence||'')}</div></div></div><div class="panel"><h3>${esc(ch)} · <span class="badge ${s[1]}">${s[0]}</span></h3><div class="repo-text">${esc(r?.text||'No language in repository.')}</div>${r?.note?`<div class="fact" style="margin-top:10px"><div class="label">Note</div><div>${esc(r.note)}</div></div>`:''}<div class="export-actions"><button class="btn secondary" onclick="openNewTicket('${state.currentCommit}','Ethics')">Use in Ethics handoff</button></div></div></div>`}

function renderRegistryPage(el){let ext=state.contacts.filter(x=>x.brand===state.currentBrand&&x.dma===state.currentDMA),pbs=state.playbooks.filter(x=>x.brand===state.currentBrand&&x.dma===state.currentDMA);el.innerHTML=`<div class="page">${pageHead('Contacts & routing','This is the address book Mayhem uses to make tickets and emails actually go somewhere. Configure a person once; every commitment can reuse the route.',`<button class="btn" onclick="openTeamContact()">+ Team route</button><button class="btn secondary" onclick="openPartnerContact()">+ Partner contact</button>`)}<div class="panel"><h3>Team routing</h3><div class="routegrid">${(state.teamContacts||[]).map(x=>routeCardHTML(x)).join('')}</div></div><div class="grid2" style="margin-top:12px"><div class="panel"><h3>Partner / vendor contacts · ${esc(state.currentDMA)}</h3>${ext.map((x,i)=>`<div class="registry-item"><div class="name">${esc(x.org)} · ${esc(x.name)}</div><div class="meta">${esc(x.role)}${x.email?' · '+esc(x.email):' · EMAIL MISSING'}${x.shipTo?' · ship-to: '+esc(x.shipTo):''}</div><div class="actions"><button class="btn secondary" onclick="editPartnerContact(${i})">Edit</button></div></div>`).join('')||'<div class="fact"><div class="label">Contacts</div><div>No partner contacts saved for this DMA.</div></div>'}</div><div class="panel"><h3>Playbooks / recurrence</h3>${pbs.map(x=>`<div class="registry-item"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.note)}</div></div>`).join('')||'<div class="fact"><div class="label">Playbooks</div><div>No saved playbook for this DMA.</div></div>'}<button class="btn secondary" style="margin-top:9px" onclick="savePlaybook()">Save current as playbook</button></div></div><div class="panel" style="margin-top:12px"><h3>System connections that matter here</h3>${[['Doom','Existing creative / ISCI / traffic truth','Check before Creative ticket'],['MP@','Shared marketing-ops mailbox','Inbound / Finance routing'],['MediaNorm','Invoice / reconciliation truth','Join by estimate; do not duplicate'],['Notion','Event/calendar source','Can prefill or stage changes'],['SharePoint / Drive','Source documents / working assets','Link / use as evidence'],['MerchHub','Merch execution','Route + receive status']].map(x=>`<div class="system-row"><div class="system">${x[0]}</div><div>${x[1]}</div><div class="state">${x[2]}</div></div>`).join('')}</div></div>`}
function savePlaybook(){let c=commitById();if(!state.playbooks.some(x=>x.brand===state.currentBrand&&x.dma===state.currentDMA&&x.name===c.name))state.playbooks.push({brand:state.currentBrand,dma:state.currentDMA,name:c.name,note:'Reuse structure, contacts, workflow, obligations and vendors; never copy dates/costs/quantities/approvals blindly.'});saveState();renderPage();toast('Playbook saved')}


function intakeBrandChanged(){let b=document.getElementById('fBrand').value,sel=document.getElementById('fDMA');sel.innerHTML=markets(b).map(x=>`<option>${esc(x)}</option>`).join('')}
function toggleChoice(el){el.classList.toggle('on',el.querySelector('input')?.checked)}
function renderIntakeChoices(){let kind=document.getElementById('fKind')?.value||'Event + Sponsorship',owed=OBLIGATION_LIBRARY[kind]||OBLIGATION_LIBRARY['Event'];let ob=document.getElementById('owedChoices'),nd=document.getElementById('needChoices');if(ob)ob.innerHTML=owed.map((x,i)=>`<label class="choice"><input type="checkbox" class="owedChk" value="${esc(x)}" onchange="toggleChoice(this.parentElement);renderOwedQty()"><div class="ct">${esc(x)}</div><div class="cm">Select only what the partner / vendor owes us.</div><div class="owedDetail" data-name="${esc(x)}"></div></label>`).join('');if(nd)nd.innerHTML=NEED_LIBRARY.map(([key,label])=>`<label class="choice"><input type="checkbox" class="needChk" value="${key}" onchange="toggleChoice(this.parentElement);renderNeedDetails()"><div class="ct">${label}</div><div class="cm">Mayhem will propose the right route after create.</div></label>`).join('');renderNeedDetails()}
function renderOwedQty(){document.querySelectorAll('.choice .owedChk').forEach(ch=>{let box=ch.parentElement.querySelector('.owedDetail');box.innerHTML=ch.checked?`<div class="minirow"><div class="field"><label>Expected</label><input class="owedExpected" value="1"></div><div class="field"><label>Proof</label><select class="owedProof"><option>Partner report</option><option>Photo / video</option><option>Aircheck / screenshot</option><option>Attendance / impressions report</option><option>Other</option></select></div><div class="field"><label>Due</label><input class="owedDue" type="date"></div></div>`:''})}
function renderNeedDetails(){let merch=[...document.querySelectorAll('.needChk')].find(x=>x.value==='merch'),box=document.getElementById('merchChoiceDetails');if(!box)return;if(merch?.checked)box.innerHTML=`<div class="panel flat" style="margin-top:9px"><h3>Merch details</h3><div class="pillrow">${MERCH_TYPES.map(x=>`<button type="button" class="pillbtn merchType" onclick="this.classList.toggle('on')">${x}</button>`).join('')}</div><label class="choice" style="display:block;margin-top:9px;min-height:0"><input type="checkbox" id="merchDesign"><div class="ct">Creative design needed for the merch?</div><div class="cm">If yes, Mayhem also proposes a Creative ticket. If no, it routes fulfillment only.</div></label></div>`;else box.innerHTML=''}
function readNeedSelections(){let n={creative:false,ethics:false,social:false,merch:false,merchDesign:false,merchItems:[],seo:false,meta:false,staffing:false,finance:false};document.querySelectorAll('.needChk:checked').forEach(x=>n[x.value]=true);n.merchItems=[...document.querySelectorAll('.merchType.on')].map(x=>x.textContent.trim());n.merchDesign=!!document.getElementById('merchDesign')?.checked;if(n.merch&&n.merchDesign)n.creative=true;return n}
function readOwedSelections(){let out=[];document.querySelectorAll('.owedChk:checked').forEach(ch=>{let p=ch.parentElement;out.push({name:ch.value,expected:p.querySelector('.owedExpected')?.value||'1',status:'Expected',proof:p.querySelector('.owedProof')?.value||'Partner report',due:p.querySelector('.owedDue')?.value||''})});return out}
function openFeedForm(){modal('Feed the form','Optional helper — the form remains the intake.',`<div class="formgrid"><div class="field c4"><label>Source</label><select id="feedType"><option>Contract / PDF</option><option>Email</option><option>Excel / spreadsheet</option><option>Notion</option><option>Copied partner note</option></select></div><div class="field c8"><label>File / subject</label><input id="feedName" type="text"></div><div class="field c12"><label>Paste what you have</label><textarea id="feedText" rows="8" placeholder="Paste an email, contract facts or rows. Mayhem uses what exists and leaves the rest for the form."></textarea></div><div class="c12"><button class="btn secondary" type="button" onclick="prefillFormDemo()">Use Sister Strut demo facts</button> <button class="btn" type="button" onclick="applyFeedToForm()">Fill what Mayhem can</button></div></div>`)}
function prefillFormDemo(){document.getElementById('feedText').value='Lerner & Rowe | Chicago | Sister Strut | event Oct 3 2026 | final 27500 | estimate 4193 | partner owes 2 stage mentions, booth space, attendance report | radio mentions begin Sep 15';}
function applyFeedToForm(){let t=document.getElementById('feedText').value||'',low=t.toLowerCase();let set=(id,v)=>{let e=document.getElementById(id);if(e&&v!==undefined&&v!==null)e.value=v};if(low.includes('lerner'))set('fBrand','Lerner & Rowe');if(low.includes('chicago')){intakeBrandChanged();set('fDMA','Chicago')}if(low.includes('sister strut'))set('fName','Sister Strut');let money=t.match(/(?:final|\$)\s*\$?([\d,]{4,})/i);if(money)set('fFinal',money[1].replaceAll(',',''));let est=t.match(/estimate\s*#?\s*(\d+)/i);if(est)set('fEstimate',est[1]);if(/oct(?:ober)?\s+3\s+2026/i.test(t))set('fAnchor','2026-10-03');closeModal();renderIntakeChoices();toast('Filled the facts Mayhem could identify — review the form')}

function suggestedTicketTypes(o=currentOps()){let n=o.needs||{};let out=[];if(n.creative)out.push('Creative');if(n.ethics)out.push('Ethics');if(n.merch)out.push('Merch');if(n.seo)out.push('SEO');if(n.meta)out.push('Meta');if(n.staffing)out.push('Staffing');if(n.finance)out.push('Finance');return out}
function ticketProposalHTML(type,c,o){let role=ROUTE_FOR[type]||type,contact=roleContact(role),missing=!contact?.email,ask=type==='Merch'?`Fulfill: ${(o.needs?.merchItems||[]).join(', ')||'selected merch'}`:type==='Creative'&&o.needs?.merchDesign?'Create merch design needed for fulfillment':bodyFor(type,c).split('\n\n')[2]||type;return `<div class="ticketpick selected" data-type="${type}"><input class="check proposalChk" type="checkbox" checked onchange="this.closest('.ticketpick').classList.toggle('selected',this.checked)"><div class="type">${type}</div><div class="ask">${esc(ask)}</div><div class="route ${missing?'missing':''}">To: ${esc(contactLabel(role))}<br>Due back: ${fmtDate(dueForNeed(type,c))} · protects ${c.anchor?fmtDate(c.anchor):'hard date TBD'}</div><div class="actions"><button class="btn secondary" onclick="previewProposal('${type}')">Preview email</button></div></div>`}
function openTicketPlanner(commitId=state.currentCommit,focus=''){state.currentCommit=commitId;saveState();let c=commitById(),o=currentOps(),types=suggestedTicketTypes(o);if(focus&&!types.includes(focus))types.push(focus);modal('Build tickets from the commitment',`${state.currentBrand} · ${state.currentDMA} · ${c.name}`,`<div class="tiny">These are proposed from the intake selections. Check / uncheck what should actually leave your desk. Contacts & Routing decides who receives each one.</div><div class="ticketplan" id="ticketPlan" style="margin-top:10px">${types.map(t=>ticketProposalHTML(t,c,o)).join('')||'<div class="fact"><div class="label">Needs</div><div>No routed needs selected yet.</div></div>'}</div><div class="panel flat" style="margin-top:10px"><h3>Add something you just realized you need</h3><div class="pillrow"><button class="pillbtn" onclick="addNeedFromPlanner('Creative')">Creative</button><button class="pillbtn" onclick="openMerchNeedFromPlanner()">Merch</button><button class="pillbtn" onclick="addNeedFromPlanner('Ethics')">Ethics</button><button class="pillbtn" onclick="addNeedFromPlanner('Social')">Content & Social</button><button class="pillbtn" onclick="addNeedFromPlanner('SEO')">SEO</button><button class="pillbtn" onclick="addNeedFromPlanner('Meta')">Meta</button><button class="pillbtn" onclick="addNeedFromPlanner('Staffing')">Staffing</button><button class="pillbtn" onclick="addNeedFromPlanner('Finance')">Finance</button></div></div><div style="margin-top:12px"><button class="btn" onclick="createSelectedTicketDrafts()">Create selected drafts</button></div>`)}
function addNeedFromPlanner(type){let o=currentOps(),k={Creative:'creative',Ethics:'ethics',Social:'social',SEO:'seo',Meta:'meta',Staffing:'staffing',Finance:'finance'}[type];if(k)o.needs[k]=true;state.ops[state.currentCommit]=o;saveState();closeModal();openTicketPlanner(state.currentCommit,type)}
function openMerchNeedFromPlanner(){modal('Add merch need',commitById().name,`<div class="sectioncap">What merch is needed?</div><div class="pillrow">${MERCH_TYPES.map(x=>`<button class="pillbtn merchPlanType" onclick="this.classList.toggle('on')">${x}</button>`).join('')}</div><label class="choice" style="display:block;margin-top:10px;min-height:0"><input type="checkbox" id="merchPlanDesign"><div class="ct">Does this merch need a design?</div><div class="cm">Yes = Mayhem also creates a Creative proposal. No = fulfillment goes straight to Merch.</div></label><div style="margin-top:10px"><button class="btn" onclick="saveMerchNeedFromPlanner()">Add merch to commitment</button></div>`)}
function saveMerchNeedFromPlanner(){let o=currentOps();o.needs.merch=true;o.needs.merchItems=[...document.querySelectorAll('.merchPlanType.on')].map(x=>x.textContent.trim());o.needs.merchDesign=!!document.getElementById('merchPlanDesign').checked;if(o.needs.merchDesign)o.needs.creative=true;state.ops[state.currentCommit]=o;saveState();closeModal();openTicketPlanner(state.currentCommit)}
function previewProposal(type){let c=commitById(),role=ROUTE_FOR[type]||type,contact=roleContact(role);modal('Email preview',`${type} · ${c.name}`,emailPreviewHTML({type,ownerRole:role,owner:contact?.name||role,to:contact?.email||'',due:dueForNeed(type,c),protects:c.anchor?fmtDate(c.anchor):'hard date TBD',subject:subjectFor(type,c),body:bodyFor(type,c)} ,false))}
function createSelectedTicketDrafts(){let c=commitById(),o=currentOps(),chosen=[...document.querySelectorAll('.proposalChk:checked')].map(x=>x.closest('.ticketpick').dataset.type);chosen.forEach(type=>{let existing=state.tickets.find(t=>t.brand===state.currentBrand&&t.dma===state.currentDMA&&t.commit===c.id&&t.type===type&&t.status!=='Closed');if(existing)return;let role=ROUTE_FOR[type]||type,contact=roleContact(role);state.tickets.push({id:Date.now()+Math.random(),brand:state.currentBrand,dma:state.currentDMA,commit:c.id,type,ask:bodyFor(type,c).split('\n\n')[2]||type,ownerRole:role,owner:contact?.name||role,to:contact?.email||'',sent:'',due:dueForNeed(type,c),protects:c.anchor?fmtDate(c.anchor):'hard date TBD',status:'Draft',notes:'',subject:subjectFor(type,c),body:bodyFor(type,c)})});saveState();closeModal();renderShell();renderPage();toast(`${chosen.length} draft${chosen.length===1?'':'s'} ready`)}
function ticketRowHTML(t){let route=roleContact(t.ownerRole||t.type),to=t.to||route?.email||'',missing=!to;return `<div class="workline"><div class="top"><div class="name">${esc(t.type)} · ${esc(t.ask)}</div><span class="badge ${t.status==='Sent'?'green':missing?'red':'gold'}">${esc(t.status)}</span></div><div class="detail">To: ${esc((route?.name||t.owner||t.ownerRole||'Unassigned'))}${to?' · '+esc(to):' · EMAIL MISSING'} · due ${fmtDate(t.due)} · protects ${esc(t.protects)}</div>${t.sent?`<div class="evidence">Evidence: sent ${fmtDate(t.sent)}</div>`:''}<div class="actions"><button class="btn secondary" onclick="openTicket(${t.id})">Open ticket</button>${missing?`<button class="btn ghost" onclick="go('registry')">Fix route</button>`:''}</div></div>`}
function emailPreviewHTML(t,withSend=true){let route=roleContact(t.ownerRole||t.type),to=t.to||route?.email||'',missing=!to;return `<div class="emailbox"><div class="emailhead"><div class="lab">To</div><div>${esc(route?.name||t.owner||'')}${to?' &lt;'+esc(to)+'&gt;':' — EMAIL MISSING'}</div></div><div class="emailhead"><div class="lab">Subject</div><div>${esc(t.subject||subjectFor(t.type))}</div></div><div class="emailbody">${esc(t.body||'')}</div></div><div class="statusline">Due back ${fmtDate(t.due)} · protects ${esc(t.protects)}</div>${withSend?`<div style="margin-top:10px">${missing?`<button class="btn secondary" onclick="closeModal();go('registry')">Add recipient email</button>`:`<button class="btn" onclick="sendTicket(${t.id})">Send + stamp evidence</button>`}</div>`:''}`}
function openTicket(id){let t=state.tickets.find(x=>x.id===id);if(!t)return;modal('Ticket',`${state.currentBrand} · ${state.currentDMA} · ${findCommitName(t.commit,state.currentBrand,state.currentDMA)}`,emailPreviewHTML(t,true))}
function sendTicket(id){let t=state.tickets.find(x=>x.id===id),r=roleContact(t.ownerRole||t.type),to=t.to||r?.email||'';if(!to){toast('Recipient email is missing');return}t.to=to;t.owner=r?.name||t.owner;t.status='Sent';t.sent=new Date().toISOString().slice(0,10);addEvidence(t.commit,'send',`${t.type} sent to ${t.owner} <${to}> · due ${fmtDate(t.due)}`);saveState();closeModal();renderPage();renderShell();toast('Sent and evidence stamped')}

function openTeamContact(id=''){let x=(state.teamContacts||[]).find(y=>y.id===id)||{id:'r'+Date.now(),role:'Creative',name:'',email:'',scope:'Global',brand:'',dma:''};modal(id?'Edit team route':'Add team route','Tickets / emails resolve through this configuration.',`<form class="formgrid" onsubmit="saveTeamContact(event,'${x.id}')"><div class="field c3"><label>Role</label><select id="rtRole">${['Ops','Creative','Ethics','Merch','Social','Finance','Meta','SEO','Approval','Events'].map(r=>`<option ${r===x.role?'selected':''}>${r}</option>`).join('')}</select></div><div class="field c3"><label>Name / team</label><input id="rtName" value="${esc(x.name)}" required></div><div class="field c6"><label>Email</label><input id="rtEmail" type="email" value="${esc(x.email)}"></div><div class="field c3"><label>Scope</label><select id="rtScope" onchange="routeScopeChanged()"><option ${x.scope==='Global'?'selected':''}>Global</option><option ${x.scope==='Brand'?'selected':''}>Brand</option><option ${x.scope==='DMA'?'selected':''}>DMA</option></select></div><div class="field c4"><label>Brand override</label><select id="rtBrand">${brands().map(b=>`<option ${b===x.brand?'selected':''}>${b}</option>`).join('')}</select></div><div class="field c5"><label>DMA override</label><input id="rtDMA" value="${esc(x.dma)}"></div><div class="c12"><button class="btn">Save routing contact</button></div></form>`)}

function saveTeamContact(e,id){e.preventDefault();let x=(state.teamContacts||[]).find(y=>y.id===id);let next={id,role:document.getElementById('rtRole').value,name:document.getElementById('rtName').value,email:document.getElementById('rtEmail').value,scope:document.getElementById('rtScope').value,brand:document.getElementById('rtScope').value==='Global'?'':document.getElementById('rtBrand').value,dma:document.getElementById('rtScope').value==='DMA'?document.getElementById('rtDMA').value:''};if(x)Object.assign(x,next);else state.teamContacts.push(next);saveState();closeModal();renderPage();toast('Routing contact saved')}

function editPartnerContact(i){let rows=state.contacts.filter(x=>x.brand===state.currentBrand&&x.dma===state.currentDMA),x=rows[i];modal('Edit partner contact',`${state.currentBrand} · ${state.currentDMA}`,`<form class="formgrid" onsubmit="savePartnerEdit(event,'${x.org.replaceAll("'","\\'")}','${x.name.replaceAll("'","\\'")}')"><div class="field c4"><label>Organization</label><input id="peOrg" value="${esc(x.org)}"></div><div class="field c4"><label>Name</label><input id="peName" value="${esc(x.name)}"></div><div class="field c4"><label>Role</label><input id="peRole" value="${esc(x.role)}"></div><div class="field c6"><label>Email</label><input id="peEmail" type="email" value="${esc(x.email)}"></div><div class="field c6"><label>Ship-to</label><input id="peShip" value="${esc(x.shipTo)}"></div><div class="c12"><button class="btn">Save</button></div></form>`)}
function savePartnerEdit(e,oldOrg,oldName){e.preventDefault();let x=state.contacts.find(y=>y.brand===state.currentBrand&&y.dma===state.currentDMA&&y.org===oldOrg&&y.name===oldName);if(x){x.org=document.getElementById('peOrg').value;x.name=document.getElementById('peName').value;x.role=document.getElementById('peRole').value;x.email=document.getElementById('peEmail').value;x.shipTo=document.getElementById('peShip').value}saveState();closeModal();renderPage()}

function paymentCardHTML(p){let c=commitById(p.commit,state.currentBrand,state.currentDMA),fin=roleContact('Finance',p.brand,p.dma),missing=!fin?.email;return `<div class="paymentcard"><div class="top"><div><div class="name">${esc(p.vendor)} · ${moneyFmt(p.amount)}</div><div class="meta">${esc(findCommitName(p.commit,p.brand,p.dma))} · due ${fmtDate(p.due)} · estimate ${esc(c?.money?.estimate||'TBD')} · pays: ${esc(p.funding||p.brand)}<br>Support: ${esc(p.source||'Not attached')} · ${esc(p.note||'')}</div></div><span class="badge ${p.status==='Paid'?'green':missing?'red':'gold'}">${esc(p.status)}</span></div><div class="actions"><button class="btn secondary" onclick="previewFinancePacket(${p.id})">Preview Finance request</button>${p.status!=='Paid'?`<button class="btn secondary" onclick="markPayment(${p.id})">Mark paid</button>`:''}</div></div>`}
function financeBody(p){let c=commitById(p.commit,p.brand,p.dma);return `Hi ${roleContact('Finance',p.brand,p.dma)?.name||'Finance'},\n\nPlease route / confirm payment support for:\n\n${c.name} — ${p.brand} · ${p.dma}\nVendor / partner: ${p.vendor}\nAmount: ${moneyFmt(p.amount)}\nDue: ${fmtDate(p.due)}\nEstimate: ${c.money.estimate||'TBD'}\nFunding entity: ${p.funding||p.brand}\nSource/support: ${p.source||'Not attached'}\n\n${p.note||''}\n\nPlease reply with anything still needed so Mayhem can keep the commitment current.`}
function previewFinancePacket(id){let p=state.payments.find(x=>x.id===id),fin=roleContact('Finance',p.brand,p.dma),fake={id:p.id,type:'Finance',ownerRole:'Finance',owner:fin?.name||'Finance / AP',to:fin?.email||'',due:p.due,protects:`payment due ${fmtDate(p.due)}`,subject:`Payment routing — ${findCommitName(p.commit,p.brand,p.dma)} · ${moneyFmt(p.amount)}`,body:financeBody(p)};modal('Finance request preview',`${p.brand} · ${p.dma}`,`<div class="emailbox"><div class="emailhead"><div class="lab">To</div><div>${esc(fin?.name||'Finance / AP')}${fin?.email?' &lt;'+esc(fin.email)+'&gt;':' — EMAIL MISSING'}</div></div><div class="emailhead"><div class="lab">Subject</div><div>${esc(fake.subject)}</div></div><div class="emailbody">${esc(fake.body)}</div></div><div style="margin-top:10px">${fin?.email?`<button class="btn" onclick="sendFinancePacket(${id})">Send to Finance + stamp</button>`:`<button class="btn secondary" onclick="closeModal();go('registry')">Add Finance email</button>`}</div>`)}
function sendFinancePacket(id){let p=state.payments.find(x=>x.id===id),fin=roleContact('Finance',p.brand,p.dma);if(!fin?.email)return;p.status='Sent to Finance';p.routed=new Date().toISOString().slice(0,10);state.financeSends.push({id:Date.now(),payment:id,to:fin.email,date:p.routed});addEvidence(p.commit,'finance',`Payment request ${moneyFmt(p.amount)} sent to ${fin.name} <${fin.email}>`);saveState();closeModal();renderPage();toast('Finance request sent and stamped')}

function reportContactRoles(){return ['Events','Approval','Finance']}
function renderReportRecipients(){let box=document.getElementById('reportRecipients');if(!box)return;box.innerHTML=reportContactRoles().map(role=>{let c=roleContact(role);return `<button type="button" class="pillbtn reportRecip ${role!=='Finance'?'on':''}" data-role="${role}" onclick="this.classList.toggle('on');renderMonthlyEmail()">${esc(c?.name||role)}${c?.email?'':' · email?'}</button>`}).join('')}
function monthLabel(m){let [y,mo]=(m||'2026-09').split('-').map(Number);return new Date(y,mo-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}
function buildMonthlyBody(month){let lines=[`Atticor Marketing Operations — ${monthLabel(month)}`,''];for(let b of brands()){lines.push(b.toUpperCase());for(let d of markets(b)){let rows=state.brands[b].markets[d].commitments.filter(c=>{if(!c.anchor)return true;return c.anchor.slice(0,7)===month||String(c.state).toLowerCase().includes('live')||String(c.state).toLowerCase().includes('decision')||String(c.state).toLowerCase().includes('needs')});if(!rows.length)continue;lines.push(`  ${d}`);for(let c of rows){let o=state.ops[c.id]||genericOps(),issues=[];if(o.decision)issues.push(o.decision);if(!c.anchor)issues.push('Hard date missing');let open=state.tickets.filter(t=>t.brand===b&&t.dma===d&&t.commit===c.id&&t.status!=='Closed');lines.push(`    • ${c.name} — ${c.anchor?fmtDate(c.anchor):'DATE TBD'} — ${c.state}`);lines.push(`      Final committed: ${moneyFmt(c.money.final)}${c.money.estimate?' · Estimate '+c.money.estimate:''}`);if(open.length)lines.push(`      Open handoffs: ${open.map(t=>t.type+' ('+t.status+')').join(', ')}`);if(o.obligations?.length)lines.push(`      Partner items: ${o.obligations.map(x=>x.name+' — '+x.status).join('; ')}`);if(issues.length)lines.push(`      Needs attention: ${issues.join(' | ')}`)}}lines.push('')}lines.push('Generated from Mayhem. Working details remain on the Brand → DMA → Commitment records.');return lines.join('\n')}
function renderMonthlyEmail(){let box=document.getElementById('monthlyEmail');if(!box)return;let month=document.getElementById('reportMonth')?.value||state.reportMonth||'2026-09',roles=[...document.querySelectorAll('.reportRecip.on')].map(x=>x.dataset.role),contacts=roles.map(r=>roleContact(r)).filter(Boolean),emails=contacts.map(c=>c.email).filter(Boolean),missing=contacts.filter(c=>!c.email);box.innerHTML=`<div class="emailbox"><div class="emailhead"><div class="lab">To</div><div>${contacts.map(c=>esc(c.name)+(c.email?' &lt;'+esc(c.email)+'&gt;':' — EMAIL MISSING')).join('; ')||'Select recipients'}</div></div><div class="emailhead"><div class="lab">Subject</div><div>Atticor Marketing Operations — ${monthLabel(month)} Visibility</div></div><div class="emailbody" id="monthlyBody">${esc(buildMonthlyBody(month))}</div></div><div style="margin-top:10px">${missing.length?`<button class="btn secondary" onclick="go('registry')">Fix ${missing.length} recipient email${missing.length===1?'':'s'}</button>`:emails.length?`<button class="btn" onclick="sendMonthlyEmail()">Send monthly email + stamp</button>`:'<span class="tiny">Select at least one recipient.</span>'}</div>`}
function sendMonthlyEmail(){let month=document.getElementById('reportMonth')?.value||state.reportMonth||'2026-09',roles=[...document.querySelectorAll('.reportRecip.on')].map(x=>x.dataset.role),contacts=roles.map(r=>roleContact(r)).filter(Boolean);if(!contacts.length||contacts.some(c=>!c.email)){toast('Recipient email missing');return}state.reportSends.push({id:Date.now(),month,to:contacts.map(c=>c.email),date:new Date().toISOString().slice(0,10)});saveState();toast('Monthly visibility email sent and stamped');renderMonthlyEmail()}
