 if(!c.anchor)out.push({type:c.sourceTiming?'SOURCE TIMING':'DATE MISSING',name:c.name,copy:c.sourceTiming?(c.sourceTiming+' · exact day not provided in source.'):'Event / launch date is missing.',label:c.sourceTiming?'Add exact day':'Add date',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');editPrimaryDateFor('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}')`,red:!c.sourceTiming});
 if(o.decision)out.push({type:'UPDATE / CONFLICT',name:c.name,copy:cleanUiText(o.decision),label:'Fix here',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');${c.id==='sister'?'resolveDateConflict()':`editRecord('${c.id}')`}`,red:true});
 for(let t of state.tickets.filter(t=>t.brand===b&&t.dma===d&&t.commit===c.id&&t.status!=='Closed')){let rec=mtRecipient?mtRecipient(t.type,c,b,d):roleContact(t.ownerRole||t.type,b,d);let email=t.to||rec?.email||'';if(!email)out.push({type:'TICKET BLOCKED',name:`${c.name} · ${t.type}`,copy:'Recipient email is missing.',label:'Fix contact',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');go('registry')`,red:true});else if(t.sent&&!t.returnData&&t.due&&t.due<today)out.push({type:'RETURN OVERDUE',name:`${c.name} · ${t.type}`,copy:`Due back ${fmtDate(t.due)}. Nothing has been logged back yet.`,label:'Open ticket',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');openTicket(${t.id})`,red:true});else if(t.sent&&!t.returnData)out.push({type:'WAITING ON RETURN',name:`${c.name} · ${t.type}`,copy:`Sent ${fmtDate(t.sent)} · due back ${fmtDate(t.due)}.`,label:'Open ticket',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');openTicket(${t.id})`})}
 for(let cp of contentFor(c,b,d)){if(cp.status!=='Completed'&&!cp.due)out.push({type:'CONTENT & SOCIAL DATE NEEDED',name:`${c.name} · ${cp.type}`,copy:'No due / run date is set yet.',label:'Set date',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');goResultsTab('content')`,red:true});if(cp.status!=='Completed'&&cp.due&&cp.due<today)out.push({type:'CONTENT & SOCIAL DUE',name:`${c.name} · ${cp.type}`,copy:`Content due ${fmtDate(cp.due)} · ${cp.status}.`,label:'Update content',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');goResultsTab('content')`,red:true});if((cp.metricsStatus==='Due'||cp.metricsStatus==='Overdue')&&cp.metricsDue&&cp.metricsDue<=today)out.push({type:'CONTENT & SOCIAL METRICS',name:`${c.name} · ${cp.type}`,copy:`Post-event metrics due ${fmtDate(cp.metricsDue)}.`,label:'Log metrics',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');openSocialMetrics('${cp.id}')`,red:cp.metricsDue<today})}
 for(let ob of o.obligations||[]){let status=String(ob.status||'');if(ob.due&&ob.due<today&&!/received|delivered|complete|proofed/i.test(status))out.push({type:'PARTNER REPORT / PROOF',name:`${c.name} · ${ob.name}`,copy:`Was due ${fmtDate(ob.due)} · ${status||'still open'}.`,label:'Log / chase',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');goResultsTab('vendors')`,red:true});if(/makegood/i.test(status))out.push({type:'MAKEGOOD',name:`${c.name} · ${ob.name}`,copy:'Under-delivery is still open.',label:'Work makegood',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');goResultsTab('vendors')`,red:true})}
 let pages=(state.landingPages||[]).filter(x=>x.brand===b&&(x.records||[]).includes(c.id));if(pages.some(x=>!x.url||x.status==='URL needed'||x.status==='Needs Update'))out.push({type:'LANDING PAGE',name:c.name,copy:'A linked landing page needs a URL or update.',label:'Fix page',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');go('tracking')`,red:true});let unreported=(state.utms||[]).filter(x=>x.brand===b&&x.dma===d&&x.record===c.id&&!x.reportedOn).length;if(unreported)out.push({type:'UTMS TO LOG',name:c.name,copy:`${unreported} UTM URL${unreported===1?'':'s'} created but not sent to the logging team.`,label:'Build report',act:`osSelect('${b.replaceAll("'","\\'")}','${d.replaceAll("'","\\'")}','${c.id}');openUtmReportScope('${c.id}')`})}
 let pays=(state.payments||[]).filter(p=>p.brand===b&&p.dma===d&&p.status!=='Paid');if(pays.length)out.push({type:'AP / EXPENSES',name:d,copy:`${pays.length} payment / expense item${pays.length===1?'':'s'} open.`,label:'Open AP / Expenses',act:`state.currentBrand='${b.replaceAll("'","\\'")}';state.currentDMA='${d.replaceAll("'","\\'")}';saveState();go('finance')`});return out}
function renderHome(el){let totals={attention:0,waiting:0,metrics:0,reports:0};for(let b of brands())for(let d of markets(b)){let s=osSignalList(b,d);totals.attention+=s.filter(x=>x.red).length;totals.waiting+=state.tickets.filter(t=>t.brand===b&&t.dma===d&&t.status!=='Closed'&&t.sent&&!t.returnData).length;totals.metrics+=s.filter(x=>x.type==='CONTENT & SOCIAL METRICS').length;totals.reports+=s.filter(x=>x.type==='PARTNER REPORT / PROOF').length}el.innerHTML=`<div class="page">${pageHead('Mayhem & Marketing Ops','Cross-brand operating pulse. It shows what the system is waiting on by Brand → DMA and lets you work the issue from here.',`<button class="btn" onclick="go('intake')">New Intake</button>`)}<div class="os-grid"><div class="os-card"><div class="title">Needs Action</div><div class="value">${totals.attention}</div><div class="sub">blocked / overdue / missing</div></div><div class="os-card"><div class="title">Waiting on Return</div><div class="value">${totals.waiting}</div><div class="sub">tickets already sent</div></div><div class="os-card"><div class="title">Content & Social Metrics Due</div><div class="value">${totals.metrics}</div><div class="sub">social / newsletter results</div></div><div class="os-card"><div class="title">Partner Reports Due</div><div class="value">${totals.reports}</div><div class="sub">attendance / impressions / proof</div></div></div><div style="margin-top:16px">${brands().map(b=>`<section class="home-brand"><div class="home-brand-head"><div><div class="home-brand-name">${esc(b)}</div><div class="home-brand-meta">Operating pulse by DMA — not the campaign book.</div></div><button class="btn ghost" onclick="setBrand('${b.replaceAll("'","\\'")}');go('brands')">Browse ${esc(BRAND_SHORT[b]||b)}</button></div><div class="home-dmas">${markets(b).map(d=>{let sig=osSignalList(b,d),waiting=state.tickets.filter(t=>t.brand===b&&t.dma===d&&t.status!=='Closed'&&t.sent&&!t.returnData).length,next=commitments(b,d).filter(c=>c.anchor&&c.anchor>=osToday()).sort((a,z)=>a.anchor.localeCompare(z.anchor))[0];return `<div class="home-dma"><div class="dma-name">${esc(d)}</div><div class="home-next">${next?'Next: '+esc(next.name)+' · '+fmtDate(next.anchor):'No upcoming dated campaign / event'}</div><div class="home-pulse"><div class="pulsebit"><b>${sig.filter(x=>x.red).length}</b><span>action</span></div><div class="pulsebit"><b>${waiting}</b><span>waiting</span></div><div class="pulsebit"><b>${sig.filter(x=>x.type.includes('REPORT')||x.type.includes('METRICS')).length}</b><span>results due</span></div></div>${sig.slice(0,4).map(x=>`<div class="signal ${x.red?'red':''}"><div class="type">${esc(x.type)}</div><div class="name">${esc(x.name)}</div><div class="copy">${esc(x.copy)}</div><div class="actions"><button class="btn ghost" onclick="${x.act}">${esc(x.label)}</button></div></div>`).join('')||'<div class="home-clear" style="margin-top:10px">No open flags in this DMA.</div>'}${sig.length>4?`<div class="home-clear" style="margin-top:7px">+ ${sig.length-4} more open signal${sig.length-4===1?'':'s'}</div>`:''}</div>`}).join('')}</div></section>`).join('')}</div></div>`}
function resultsTabButton(id,label){return `<button class="${(state.resultsTab||'results')===id?'active':''}" onclick="state.resultsTab='${id}';saveState();renderPage()">${label}</button>`}
function metricCards(c){let names=['Attendance','Impressions','Reach','Engagement','Clicks','Views','Leads / Scans','Newsletter Opens'];return names.map(n=>`<div class="result-card"><span>${esc(n)}</span><b>${resultValue(c,n).toLocaleString()}</b><div class="result-meta">${resultsFor(c).filter(x=>x.type===n).length} source${resultsFor(c).filter(x=>x.type===n).length===1?'':'s'}</div></div>`).join('')}
function renderResultsPage(el){let c=osRecord(),tab=state.resultsTab||'results',o=osOps(c);el.innerHTML=`<div class="page">${pageHead('Content & Results','Content & Social, vendor reporting, attendance, impressions, engagement and post-event closeout all write back to this campaign / event.',`<button class="btn secondary" onclick="openResultMetric()">+ Result</button><button class="btn" onclick="openVendorReport()">+ Vendor Report</button>`)}<div class="os-tabs">${resultsTabButton('results','Results')}${resultsTabButton('content','Content & Social')}${resultsTabButton('vendors','Vendor Reports')}${resultsTabButton('post','Post-Event')}</div><div id="resultsBody">${tab==='content'?contentTabHTML(c):tab==='vendors'?vendorTabHTML(c,o):tab==='post'?postTabHTML(c,o):resultsTabHTML(c)}</div></div>`}
function resultsTabHTML(c){let rows=resultsFor(c).slice().sort((a,b)=>String(b.received||'').localeCompare(String(a.received||'')));return `<div class="results-grid">${metricCards(c)}</div><div class="panel" style="margin-top:12px"><div class="track-head"><div><h3>Result Ledger</h3><div class="tiny">Every number keeps its source. Vendor reports and Content & Social metrics write here automatically.</div></div><button class="btn" onclick="openResultMetric()">+ Add / Correct Result</button></div>${rows.length?rows.map(x=>`<div class="report-row"><div class="top"><div><div class="name">${esc(x.type)} · ${Number(x.value).toLocaleString()}</div><div class="result-meta">${esc(x.source||'Manual')}${x.period?' · '+esc(x.period):''} · received ${fmtDate(x.received)}</div></div><button class="btn ghost" onclick="editResultMetric('${x.id}')">Edit</button></div></div>`).join(''):'<div class="fact"><div class="label">Results</div><div>No result values logged yet.</div></div>'}</div>`}
function openResultMetric(id=''){let c=osRecord(),x=id?(state.results||[]).find(r=>String(r.id)===String(id)):null;modal(id?'Edit result':'Add result',`${state.currentBrand} · ${state.currentDMA} · ${c.name}`,`<form class="formgrid" onsubmit="saveResultMetric(event,'${id}')"><div class="field c4"><label>Metric</label><select id="resType">${['Attendance','Impressions','Reach','Engagement','Clicks','Views','Leads / Scans','Newsletter Opens','Shares','Comments','Saves'].map(v=>`<option ${v===x?.type?'selected':''}>${v}</option>`).join('')}</select></div><div class="field c4"><label>Value</label><input id="resValue" type="number" min="0" value="${x?.value||''}" required></div><div class="field c4"><label>Reporting Period</label><input id="resPeriod" value="${esc(x?.period||'')}"></div><div class="field c6"><label>Source</label><select id="resSource">${['Vendor report','Content & Social','Partner proof','Internal report','Manual correction'].map(v=>`<option ${v===x?.source?'selected':''}>${v}</option>`).join('')}</select></div><div class="field c6"><label>Source / Report Link</label><input id="resLink" value="${esc(x?.link||'')}"></div><div class="c12"><button class="btn">Save result + sync to Notion</button></div></form>`) }
function editResultMetric(id){openResultMetric(id)}
function saveResultMetric(e,id){e.preventDefault();let c=osRecord(),x=id?(state.results||[]).find(r=>String(r.id)===String(id)):null,next={id:id||'r'+Date.now(),key:id||'manual'+Date.now(),brand:state.currentBrand,dma:state.currentDMA,record:c.id,type:document.getElementById('resType').value,value:+document.getElementById('resValue').value||0,period:document.getElementById('resPeriod').value,source:document.getElementById('resSource').value,link:document.getElementById('resLink').value,received:x?.received||osToday(),updated:osToday()};if(x)Object.assign(x,next);else state.results.push(next);osSync(c,'Results updated');closeModal();renderShell();renderPage();toast('Result saved + Notion synced')}

function contentTabHTML(c){let rows=contentFor(c),done=rows.filter(x=>x.status==='Completed').length,metrics=rows.filter(x=>x.metricsStatus==='Due'||x.metricsStatus==='Overdue').length;return `<div class="grid3"><div class="stat"><b>${rows.length}</b><span>content items</span></div><div class="stat"><b>${done}</b><span>completed</span></div><div class="stat"><b>${metrics}</b><span>metrics due</span></div></div><div class="panel" style="margin-top:12px"><div class="track-head"><div><h3>Content & Social Plan</h3><div class="tiny">This is the working Content & Social plan — due dates, platforms, approved assets, CTA, day-of destination, live links and metrics.</div></div><div class="actions"><button class="btn secondary" onclick="openMichelleBrief('${c.id}')">Build / Email Brief</button><button class="btn" onclick="openContentItem()">+ Content Item</button></div></div>${rows.length?rows.map(x=>contentRowHTML(x)).join(''):'<div class="fact"><div class="label">Content & Social</div><div>No content plan yet. Add an item or select Content & Social on Intake.</div></div>'}</div>`}
function contentRowHTML(x){return `<div class="content-row"><div class="top"><div><div class="name">${esc(x.type)} · ${esc(x.platform||'')}</div><div class="content-meta">Due ${fmtDate(x.due)}${x.run?' · run '+fmtDate(x.run):''} · ${esc(x.status)}<br>Assets: ${esc(x.assets||'TBD')} · CTA: ${esc(x.cta||'Not needed')} · Destination: ${esc(x.destination||'TBD')}${x.link?'<br>Live: '+esc(x.link):''}</div><div class="metric-pills">${x.metricsDue?`<span>Metrics due ${fmtDate(x.metricsDue)}</span><span>${esc(x.metricsStatus||'Due')}</span>`:''}</div></div><span class="badge ${x.status==='Completed'?'green':x.status==='Live'?'blue':'gold'}">${esc(x.status)}</span></div><div class="actions" style="margin-top:7px"><button class="btn ghost" onclick="openContentItem('${x.id}')">Edit</button><button class="btn secondary" onclick="advanceContent('${x.id}')">Next Status</button>${x.metricsDue?`<button class="btn secondary" onclick="openSocialMetrics('${x.id}')">Log Metrics</button>`:''}</div></div>`}
function openContentItem(id=''){let c=osRecord(),x=id?(state.contentPlans||[]).find(r=>String(r.id)===String(id)):null;modal(id?'Edit Content & Social item':'Add Content & Social item',c.name,`<form class="formgrid" onsubmit="saveContentItem(event,'${id}')"><div class="field c4"><label>Content</label><select id="cpType">${['Pre-event post','Newsletter','Day-of Story','Day-of Reel','Post-event recap','Partner tag / collab','Photo album / content pickup','Campaign social'].map(v=>`<option ${v===x?.type?'selected':''}>${v}</option>`).join('')}</select></div><div class="field c4"><label>Platform</label><select id="cpPlatform">${['Instagram','Facebook','Instagram + Facebook','Newsletter','LinkedIn','TikTok','Multiple'].map(v=>`<option ${v===x?.platform?'selected':''}>${v}</option>`).join('')}</select></div><div class="field c4"><label>Status</label><select id="cpStatus">${['Planned','Brief sent','Scheduled','Live','Completed','Changes needed'].map(v=>`<option ${v===x?.status?'selected':''}>${v}</option>`).join('')}</select></div><div class="field c3"><label>Due</label><input id="cpDue" type="date" value="${esc(x?.due||'')}"></div><div class="field c3"><label>Run / Post</label><input id="cpRun" type="date" value="${esc(x?.run||'')}"></div><div class="field c3"><label>Metrics Due</label><input id="cpMetricsDue" type="date" value="${esc(x?.metricsDue||'')}"></div><div class="field c3"><label>Metrics Status</label><select id="cpMetricsStatus">${['Not required','Not due yet','Due','Received'].map(v=>`<option ${v===x?.metricsStatus?'selected':''}>${v}</option>`).join('')}</select></div><div class="field c6"><label>Approved Assets / Messaging Source</label><select id="cpAssets">${['Campaign / event record','Doom approved creative','Creative ticket return','Drive / SharePoint','Partner assets','Day-of album'].map(v=>`<option ${v===x?.assets?'selected':''}>${v}</option>`).join('')}</select></div><div class="field c6"><label>CTA</label><select id="cpCta">${['Not needed','Free Case Review','Call Now','Visit Website','Learn More','Event attendance / RSVP'].map(v=>`<option ${v===x?.cta?'selected':''}>${v}</option>`).join('')}</select></div><div class="field c6"><label>Photo / Video Destination</label><input id="cpDestination" value="${esc(x?.destination||osOps(c).social.album||'')}"></div><div class="field c6"><label>Live / Scheduled Link</label><input id="cpLink" value="${esc(x?.link||'')}"></div><div class="c12"><button class="btn">Save + sync to Notion</button></div></form>`) }
function saveContentItem(e,id){e.preventDefault();let c=osRecord(),x=id?(state.contentPlans||[]).find(r=>String(r.id)===String(id)):null,next={id:id||'cp'+Date.now(),brand:state.currentBrand,dma:state.currentDMA,record:c.id,type:document.getElementById('cpType').value,platform:document.getElementById('cpPlatform').value,status:document.getElementById('cpStatus').value,due:document.getElementById('cpDue').value,run:document.getElementById('cpRun').value,metricsDue:document.getElementById('cpMetricsDue').value,metricsStatus:document.getElementById('cpMetricsStatus').value,assets:document.getElementById('cpAssets').value,cta:document.getElementById('cpCta').value,destination:document.getElementById('cpDestination').value,link:document.getElementById('cpLink').value};if(x)Object.assign(x,next);else state.contentPlans.push(next);let o=osOps(c);o.needs.social=true;o.social.brief='Content & Social plan is tracked in Mayhem.';o.social.album=next.destination||o.social.album;state.ops[c.id]=o;osSync(c,'Content & Social plan updated');closeModal();renderShell();renderPage();toast('Content plan updated + Notion synced')}
function advanceContent(id){let x=state.contentPlans.find(y=>String(y.id)===String(id)),flow=['Planned','Brief sent','Scheduled','Live','Completed'],i=flow.indexOf(x.status);x.status=flow[Math.min((i<0?0:i)+1,flow.length-1)];if(x.status==='Completed'&&x.metricsDue)x.metricsStatus='Due';osSync(osRecord(),'Content & Social status updated');renderShell();renderPage()}
function openSocialMetrics(id){let x=state.contentPlans.find(y=>String(y.id)===String(id)),c=osRecord(x?.brand||state.currentBrand,x?.dma||state.currentDMA,x?.record||state.currentCommit);if(x){osSelect(x.brand,x.dma,x.record)}modal('Log Content & Social Metrics',`${c.name}${x?' · '+x.type:''}`,`<form class="formgrid" onsubmit="saveSocialMetrics(event,'${id||''}')">${[['smImpressions','Impressions'],['smReach','Reach'],['smEngagement','Engagement'],['smClicks','Clicks'],['smViews','Views'],['smShares','Shares'],['smComments','Comments'],['smSaves','Saves'],['smOpens','Newsletter Opens']].map(([i,l])=>`<div class="field c3"><label>${l}</label><input id="${i}" type="number" min="0"></div>`).join('')}<div class="field c8"><label>Post / Newsletter / Report Link</label><input id="smLink"></div><div class="field c4"><label>Reporting Period</label><input id="smPeriod" placeholder="Event week / 7 days / final"></div><div class="c12"><button class="btn">Save metrics + update campaign</button></div></form>`) }
function saveSocialMetrics(e,id){e.preventDefault();let c=osRecord(),x=id?state.contentPlans.find(y=>String(y.id)===String(id)):null,map=[['smImpressions','Impressions'],['smReach','Reach'],['smEngagement','Engagement'],['smClicks','Clicks'],['smViews','Views'],['smShares','Shares'],['smComments','Comments'],['smSaves','Saves'],['smOpens','Newsletter Opens']],period=document.getElementById('smPeriod').value,link=document.getElementById('smLink').value;for(let [fid,type] of map)addResultMetric(state.currentBrand,state.currentDMA,c.id,type,document.getElementById(fid).value,'Content & Social',id||'social-manual',period);if(x){x.metricsStatus='Received';x.metricsReceived=osToday();if(link)x.link=x.link||link}osSync(c,'Content & Social metrics added');closeModal();renderShell();renderPage();toast('Content & Social metrics saved into Results + Notion')}

function vendorReportRow(x){let metrics=[['Impressions',x.impressions],['Attendance',x.attendance],['Reach',x.reach],['Engagement',x.engagement],['Clicks',x.clicks],['Views',x.views],['Leads',x.leads]].filter(([,v])=>osNum(v));let under=(osNum(x.expectedImpressions)&&osNum(x.impressions)<osNum(x.expectedImpressions))||(osNum(x.expectedAttendance)&&osNum(x.attendance)<osNum(x.expectedAttendance))||(osNum(x.expectedSpots)&&osNum(x.spots)<osNum(x.expectedSpots));return `<div class="report-row"><div class="top"><div><div class="name">${esc(x.vendor)} · ${esc(x.type)}</div><div class="result-meta">${x.period?esc(x.period)+' · ':''}due ${fmtDate(x.due)} · received ${fmtDate(x.received)}${x.link?'<br>'+esc(x.link):''}</div><div class="metric-pills">${metrics.map(([k,v])=>`<span>${k} ${Number(v).toLocaleString()}</span>`).join('')}${x.spots?`<span>Delivered ${esc(x.spots)}</span>`:''}</div></div><span class="badge ${under?'red':x.status==='Received'?'green':'gold'}">${under?'Needs makegood':esc(x.status||'Received')}</span></div><div class="actions" style="margin-top:7px"><button class="btn ghost" onclick="openVendorReport('${x.id}')">Edit</button>${under?`<button class="btn secondary" onclick="openNewTicket('${x.record}','Partner')">Create Makegood Ticket</button>`:''}</div></div>`}

 if(state.releaseMigrations.michelleWorkstream)return;
 let social=(state.tickets||[]).filter(t=>t.type==='Social');
 for(let t of social){
  let c=commitById(t.commit,t.brand,t.dma);if(!c)continue;
  let existing=(state.contentPlans||[]).filter(x=>x.brand===t.brand&&x.dma===t.dma&&x.record===t.commit);
  if(!existing.length){state.contentPlans.push({id:'cp-migrated-'+t.id,brand:t.brand,dma:t.dma,record:t.commit,type:'Campaign social',platform:'Multiple',due:t.due||'',run:c.anchor||'',status:t.sent?'Brief sent':'Planned',assets:'Campaign / event record',cta:'Not needed',destination:(state.ops?.[t.commit]?.social?.album)||'Shared photo / video destination',link:t.returnData?.link||'',metricsDue:'',metricsStatus:'Not due yet'});}
  addEvidence(t.commit,'content',`Content & Social work moved into Content Plan${t.sent?' · brief had been sent':''}`);
 }
 state.tickets=(state.tickets||[]).filter(t=>t.type!=='Social');
 state.releaseMigrations.michelleWorkstream=true;saveState();
}

acebook/i.test(all))sourceSetChannel('Organic Social');if(/newsletter|email campaign/i.test(all))sourceSetChannel('Email');if(/\bmeta\b|paid social/i.test(all))sourceSetChannel('Meta');renderChannelDetails();if(/social media|newsletter|instagram|facebook|content/i.test(all))sourceSetNeed('social');if(/pixel|tracking qa|page-click/i.test(all))sourceSetNeed('seo');if(/merch|t-shirt|shirt|hat|giveaway/i.test(all))sourceSetNeed('merch');if(/staffing|brand rep|street team|photographer|videographer/i.test(all))sourceSetNeed('staffing');if(/invoice|payment|deposit|prefund|expense/i.test(all))sourceSetNeed('finance');let alreadyCreative=/logged the requests into (our )?creative production system|already (with|in) creative|creative (request|ticket)s? (already )?(logged|submitted)/i.test(all);if(/creative|artwork|landing page update|digital donation tracker/i.test(all)&&!alreadyCreative)sourceSetNeed('creative');renderNeedDetails();renderComplianceFlags();window.__intakeSource={type:source,name:subject||'Source-assisted intake',textSummary:all.slice(0,500),alreadyCreative};closeModal();toast(`Intake prefilled from ${source} — confirm the fields`)}

async function runTrackingCheck(id){let lp=lpById(id);if(!lp)return;let t=lpTracking(lp);if(!lp.url){toast('Landing page URL is missing');return}if(!t.providers.length&&!t.events.length){openTrackingSetup(id);toast('Choose what this page needs first');return}t.status='Checking…';t.lastChecked=osToday();saveState();renderPage();let result={url:lp.url,https:/^https:\/\//i.test(lp.url),providers:{},events:{},source:'',note:''};let serverData=null;try{let r=await fetch('/api/check-landing-page',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:lp.url,providers:t.providers,events:t.events,ids:t.ids})});if(r.ok)serverData=await r.json()}catch(e){}

function publicCampaignStatus(c,b=state.currentBrand,d=state.currentDMA){
  const raw=String(c?.state||'').trim().toLowerCase();
  const needs=(typeof osSignalList==='function'?osSignalList(b,d):[]).some(x=>x.red&&(x.name===c.name||x.name.startsWith(c.name+' ·')));
  if(needs||raw.includes('decision')||raw.includes('needs'))return {label:'Needs Attention',cls:'red'};
  if(raw.includes('wrap'))return {label:'Post-Event Open',cls:'gold'};
  if(raw.includes('in motion'))return {label:'In Progress',cls:'blue'};
  if(raw.includes('on track'))return {label:'On Track',cls:'green'};
  if(raw.includes('live')||phaseFor(c)==='LIVE')return {label:'Live',cls:'green'};
  if(phaseFor(c)==='POST')return {label:'Post-Event',cls:'gold'};
  return {label:'Upcoming',cls:'gold'};
}

function mamIsoNow(){try{return new Date().toISOString()}catch(e){return ''}}

 if(/billboard|out[ -]of[ -]home|\booh\b|posting location|media buy|broadcast buy|radio buy|tv buy|spot rate|gross rating|insertion order/.test(t))return 'Media / MediaNorm';
 if(/event|sponsorship|activation|partnership|staffing|merch|giveaway|appearance|community/.test(t))return 'Campaign / Activation';
 if(/invoice|payment|reimbursement|expense|deposit/.test(t))return 'Finance candidate';
 return 'Unclassified';
}

 let raw=String(text||''),key=[type,name,raw].join('|'),existing=state.sourceArchive.find(x=>x.key===key);
 if(existing)return existing;
 let item={id:'archive-'+Date.now()+'-'+Math.floor(Math.random()*10000),key,type,name:name||'Untitled source',rawText:raw,brand:brand||'',dma:dma||'',record:record||'',origin,domainHint:mamSourceDomainHint(name+'\n'+raw),capturedAt:mamIsoNow()};

 let v=typeof value==='number'?value:String(value).trim(),sig=[sourceId,category,field,String(v),raw].join('|');
 let hit=state.extractedFacts.find(x=>x.sig===sig);if(hit)return hit;
 hit={id:'fact-'+Date.now()+'-'+Math.floor(Math.random()*100000),sig,sourceId,category,field,value:v,raw:raw||'',brand:ctx.brand||'',dma:ctx.dma||'',record:ctx.record||'',confidence:ctx.confidence||'Extracted',classification:ctx.classification||'Unclassified',capturedAt:mamIsoNow()};
 state.extractedFacts.push(hit);return hit;
}

 try{brand=sourcePickBrand(all)||''}catch(e){}
 try{dma=brand?sourcePickDMA(all,brand)||'':''}catch(e){}
 try{campaign=sourceCampaignName(archive.name,archive.rawText)||''}catch(e){}
 archive.brand=archive.brand||brand;archive.dma=archive.dma||dma;
 let ctx={brand:archive.brand,dma:archive.dma,record:archive.record,classification:archive.domainHint};
 mamAddExtractedFact(archive.id,'Context','Brand',archive.brand,'',ctx);
 mamAddExtractedFact(archive.id,'Context','DMA',archive.dma,'',ctx);
 mamAddExtractedFact(archive.id,'Campaign','Campaign / Event',campaign,'',ctx);
 let em=all.match(/estimate\s*#?\s*[:\-]?\s*([A-Za-z0-9-]+)/i);if(em)mamAddExtractedFact(archive.id,'Finance','Estimate #',em[1],em[0],ctx);
 let dollars=[...all.matchAll(/\$\s*([\d,]+(?:\.\d{2})?)/g)].slice(0,100);dollars.forEach((m,i)=>mamAddExtractedFact(archive.id,'Money Mention','Amount '+(i+1),Number(m[1].replaceAll(',','')),m[0],ctx));
 let emails=[...new Set((all.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi)||[]))];emails.slice(0,50).forEach((v,i)=>mamAddExtractedFact(archive.id,'Contact','Email '+(i+1),v,v,ctx));
 let urls=[...new Set((all.match(/https?:\/\/[^\s<>"']+/gi)||[]))];urls.slice(0,50).forEach((v,i)=>mamAddExtractedFact(archive.id,'Link','URL '+(i+1),v,v,ctx));
 let dates=[...new Set((all.match(/\b(?:20\d{2}-\d{2}-\d{2}|(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2}(?:,?\s+20\d{2})?)\b/gi)||[]))];dates.slice(0,50).forEach((v,i)=>mamAddExtractedFact(archive.id,'Date Mention','Date '+(i+1),v,v,ctx));
 return archive;
}

 for(let lp of (state.landingPages||[]).filter(x=>ok(x.brand))){rows.push(['Landing Page',lp.brand,lp.dma||'',(lp.records||[]).map(id=>mamRecordName(id,lp.brand,lp.dma)).filter(Boolean).join(' | '),lp.type||'',lp.name||'',lp.url||'',lp.status||'','','','',lp.scope||'',lp.id,lp.url||''])}
 for(let cp of (state.contentPlans||[]).filter(x=>ok(x.brand))){let c=commitById(cp.record,cp.brand,cp.dma);rows.push(['Content',cp.brand,cp.dma,c?.name||'',cp.platform||'',cp.type||'',cp.metricsStatus||'',cp.status||'','','',cp.due||cp.run||'',cp.assets||'',cp.id,cp.link||cp.destination||''])}
 for(let x of (state.extractedFacts||[]).filter(x=>ok(x.brand))){rows.push(['Extracted Fact',x.brand||'',x.dma||'',mamRecordName(x.record,x.brand,x.dma),x.category||'',x.field||'',x.value??'',x.classification||'','','','',state.sourceArchive.find(a=>a.id===x.sourceId)?.name||'',x.sourceId||'',x.raw||''])}
 return rows;

function mamGuideBookPages(){
 const sourceCount=(state.sourceArchive||[]).length,factCount=(state.extractedFacts||[]).length;
 return [
  {title:'What Mayhem Is',kicker:'CHAPTER 01',html:`<p class="book-dek">The operating layer between a campaign idea and a closed, documented activation.</p><p>Mayhem is not another media-buy system and it is not a creative library. It is where campaign and event facts become structured work, where outside-owned asks are routed, where returns write back to the same record, and where the final operating history can be exported without rebuilding it from emails.</p><div class="book-grid four"><div><b>Mayhem</b><span>Campaigns/events, Intake, source extraction, tickets/returns, Content & Social, staffing, merch/activation work, campaign operating costs, landing pages, UTMs, results, reports and exports.</span></div><div><b>Doom</b><span>Creative, ISCIs, traffic history/status, and shared estimate-number availability/reservation.</span></div><div><b>MediaNorm</b><span>Media invoice and reconciliation truth, including TV, radio, OOH, streaming and digital media-buy spend.</span></div><div><b>Notion</b><span>Shared/external campaign record Mayhem pushes and upserts. It is not Mayhem’s primary database.</span></div></div>${mamGuideRule('Core operating rule','Extract first → classify second → display third → export anytime. Unknown stays unknown. Never invent URLs, DMA IDs, estimate sequences, contacts, tracking IDs, contract amounts or campaign costs.')}`},
  {title:'Navigation & Scope',kicker:'CHAPTER 02',html:`<p class="book-dek">Home is global. Operating work is scoped.</p><table class="book-table"><tr><th>Area</th><th>Scope</th><th>Rule</th></tr><tr><td><b>Home</b></td><td>ALL BRANDS · ALL DMAs</td><td>Global operating pulse. The selected DMA does not filter Home.</td></tr><tr><td><b>Brands</b></td><td>Brand + DMA</td><td>Shows the campaign/event book for the selected context.</td></tr><tr><td><b>Intake / Tickets / Results / Finance / Tracking</b></td><td>Brand + DMA + Campaign</td><td>The top context controls what you are editing or sending.</td></tr><tr><td><b>Updates & Reports</b></td><td>Selected Brand</td><td>Normal sends cannot cross the selected Brand.</td></tr><tr><td><b>All Brands Monthly Update</b></td><td>ALL BRANDS</td><td>Separate, deliberate cross-brand mode.</td></tr></table>${mamGuideRule('Fail-safe','If a screen offers a cross-brand choice while you are inside a Brand-scoped workflow, treat that as a bug. Scope should be inherited, not re-selected.')}`},
  {title:'Start a Campaign / Event',kicker:'CHAPTER 03',html:`<p class="book-dek">Create the record once; let the rest of the system reuse it.</p>${mamGuidePath('Brand → DMA → Intake → New Campaign / Event')}${mamGuideStep('1','Choose Brand and DMA','Set the operating context before creating the campaign/event.')}${mamGuideStep('2','Enter or source-fill the facts','Campaign/event name, type, dates, partner/vendor, location, channels and known cost context should come from the real source when available.')}${mamGuideStep('3','Record what the partner owes','Select contractual or expected benefits so Mayhem can chase proof later.')}${mamGuideStep('4','Record what operations needs','Select only the work required to execute the activation: creative, compliance, merch, web/tracking, staffing, Content & Social, Finance/AP, etc.')}${mamGuideStep('5','Choose estimate behavior','Use Existing, Assign New or Not Needed. Blank is not a decision.')}${mamGuideStep('6','Create the record','Mayhem creates the campaign, pushes/upserts Notion, and proposes outside-owned work.')}${mamGuideStep('7','Review proposed work before sending','Anything owned directly inside Mayhem should not become an outbound ticket.')}${mamGuideRule('Expected result','One campaign record that every ticket, return, cost, UTM, result and report can reference.')}`},
  {title:'Source-Assisted Intake',kicker:'CHAPTER 04',html:`<p class="book-dek">The source is evidence, not disposable prefill text.</p>${mamGuidePath('Intake → Use Source to Fill Form')}${mamGuideStep('1','Feed the source','Use an email, contract, workbook, Notion record, vendor note or other source instead of retyping known facts.')}${mamGuideStep('2','Preserve it','Mayhem retains the source/provenance so later exports can show where a fact came from.')}${mamGuideStep('3','Extract facts','Recognizable Brand, DMA, campaign, dates, partner/vendor, money, estimate and other structured facts are retained.')}${mamGuideStep('4','Confirm uncertainty','Mayhem can prefill; it does not guess. Missing stays missing until confirmed.')}${mamGuideStep('5','Keep facts that have no screen yet','A useful fact is retained even when the current UI does not have a dedicated field for it.')}${mamGuideRule('Data principle','“Not displayed today” does not mean “discarded.” That is what makes later export useful instead of another reconstruction project.')}`},
  {title:'Estimate Numbers',kicker:'CHAPTER 05',html:`<p class="book-dek">One shared pool. Doom controls availability; Mayhem attaches the number to the campaign.</p><div class="book-grid three"><div><b>Use Existing</b><span>Select an estimate already available in Doom/shared registry. Source-provided numbers should still be validated.</span></div><div><b>Assign New</b><span>Doom/shared registry must reserve the number immediately. If that connection is unavailable, Mayhem does not invent a fallback.</span></div><div><b>Not Needed</b><span>Record the decision explicitly so a blank estimate does not look forgotten.</span></div></div>${mamGuideRule('Never','Do not use highest number + 1, a local Mayhem sequence, or a guessed number when Doom is unavailable.','warning')}<p>The validated estimate follows the campaign into cost lines, Finance/AP routing, Notion context and the MediaNorm bridge.</p>`},
  {title:'Tickets & Returns',kicker:'CHAPTER 06',html:`<p class="book-dek">A ticket is a request with a required return, not a task list.</p>${mamGuidePath('Campaign → Build Work / Tickets')}${mamGuideStep('1','Choose only outside-owned work','A ticket exists when another team, partner or vendor owes something.')}${mamGuideStep('2','Check the route','Routing comes from Contacts. A missing required email should block sending.')}${mamGuideStep('3','Check the ask','The request should contain only what the receiving role needs, plus due-back date and required return.')}${mamGuideStep('4','Send','Sending starts the loop. It does not complete the work.')}${mamGuideStep('5','Log the return','Capture the asset, approval, quote, status, proof, reference, date, link or note that came back.')}${mamGuideStep('6','Close only when satisfied','If changes are required, keep the same loop open instead of creating disconnected duplicate work.')}${mamGuideRule('Creative rule','Check Doom first. Reuse existing approved creative/ISCIs when eligible; create net-new Creative work only for what is actually missing.')}`},
  {title:'Staffing, Merch & Production',kicker:'CHAPTER 07',html:`<p class="book-dek">Operational costs should be created by the workflow that produced them.</p><h3>Staffing</h3>${mamGuidePath('Campaign → Build Work → Staffing')}${mamGuideStep('1','Select agency/vendor and staffing need','Campaign facts prefill. Choose headcount, roles and hours/shift using the quick controls.')}${mamGuideStep('2','Request estimate and availability','The first request is for availability, price and travel impact — not the roster.')}${mamGuideStep('3','Review the return','Available / Partial / Not available, estimate amount, travel status and support come back into the same campaign.')}${mamGuideStep('4','Approve the quote','Only an accepted quote becomes a committed Staffing cost line.')}${mamGuideStep('5','Book and collect final details','After booking, collect roster/headcount confirmation and call time.')}<h3>Merch / Production</h3><p>Order totals, production charges and shipping should write into campaign costs when the vendor return confirms them. Do not retype Brand, DMA, campaign or estimate when the workflow already knows them.</p>`},
  {title:'Content & Social',kicker:'CHAPTER 08',html:`<p class="book-dek">One structured content plan; no parallel person-specific process.</p>${mamGuidePath('Campaign → Content & Results → Content Plan')}${mamGuideStep('1','Create the structured plan','Track content type, platform, status, due date, run/post date, approved asset or messaging source, CTA and destination.')}${mamGuideStep('2','Build / Email Brief','The brief is generated from the campaign and contains only the facts Content & Social needs to execute.')}${mamGuideStep('3','Track the live/scheduled link','Returned links stay with the content item instead of disappearing into email.')}${mamGuideStep('4','Collect metrics','Post-event/campaign metrics write into Results. Cumulative metrics use latest-snapshot behavior when appropriate.')}${mamGuideRule('Do not duplicate','Content & Social should not have a separate generic ticket system that competes with the Content Plan.')}`},
  {title:'Landing Pages, Tracking & UTMs',kicker:'CHAPTER 09',html:`<p class="book-dek">Mayhem owns the tracking record; Doom may provide creative/ISCI context.</p>${mamGuidePath('Campaign → Landing Pages & UTMs')}${mamGuideStep('1','Confirm the destination','Use an authoritative landing-page URL. Never infer one from Brand/market naming.')}${mamGuideStep('2','Confirm tracking readiness','Record required providers/events/IDs and the return/proof for setup work.')}${mamGuideStep('3','Build the UTM','Use Mayhem presets/patterns and campaign context. Include source, medium, campaign, content/ISCI and placement as applicable.')}${mamGuideStep('4','Save the full URL and history','Every generated UTM stays tied to Brand → DMA → Campaign/Event → Landing Page.')}${mamGuideStep('5','Push tracking context to Notion','Tracking changes remain part of the shared campaign record.')}${mamGuideStep('6','Report/export when required','Use the UTM report/export rather than rebuilding links from memory.')}`},
  {title:'Campaign Finance / AP',kicker:'CHAPTER 10',html:`<p class="book-dek">Campaign operating cost belongs here. Media-buy reconciliation does not.</p><div class="book-boundary"><div><b>YES — MAYHEM FINANCE</b><span>Base sponsorship/event fee · staffing · merch · production/printing · shipping · event/venue · travel · permits/fees · reimbursement · other activation operating costs.</span></div><div><b>NO — MEDIANORM</b><span>TV · radio · OOH · streaming · digital inventory/media-buy spend and invoices.</span></div></div>${mamGuideStep('1','Start with verified campaign cost','A verified sponsorship/event contract amount becomes the base cost line.')}${mamGuideStep('2','Let workflows feed additional cost','Accepted staffing, merch, production, shipping and similar returns create their own lines.')}${mamGuideStep('3','Review the rollup','Base Contract + Additional Costs = Total Committed. Final/actual is derived from cost lines and Finance outcomes, not a detached editable field.')}${mamGuideStep('4','Route AP','Send the specific unpaid line(s) to Finance / AP with estimate, due date, funding and support.')}${mamGuideStep('5','Log the Finance return','Paid / Scheduled / Needs information plus reference/confirmation and relevant date.')}`},
  {title:'Results & Closeout',kicker:'CHAPTER 11',html:`<p class="book-dek">The event date is an anchor, not the definition of done.</p>${mamGuidePath('Campaign → Content & Results → Closeout')}<div class="book-checklist"><span>☐ Partner/vendor reports received</span><span>☐ Attendance / impressions / results logged</span><span>☐ Partner obligations proofed or makegood opened</span><span>☐ Content & Social metrics received</span><span>☐ Live links / photo-video proof retained</span><span>☐ Campaign operating costs complete</span><span>☐ AP paid/scheduled/otherwise resolved</span><span>☐ Open tickets closed</span></div>${mamGuideRule('Closeout rule','The campaign stays open until the required returns are resolved. The event date passing by itself does not close the record.')}`},
  {title:'Reports, Exports & Troubleshooting',kicker:'CHAPTER 12',html:`<p class="book-dek">Use the structured record instead of rebuilding updates manually.</p><h3>Reports</h3><p>Normal Updates & Reports are locked to the Brand selected at the top. Switch the top Brand to work another Brand. All Brands Monthly Update is the one deliberate cross-brand reporting lane.</p><h3>Exports</h3><p>Exports use the full retained Mayhem record, including source-backed facts that may not have their own screen yet. Normal exports can be scoped to the current Brand; ALL BRANDS export should be intentional.</p><h3>Troubleshooting</h3><table class="book-table"><tr><th>Problem</th><th>What to do</th></tr><tr><td>Send is blocked</td><td>Open Contacts and fix the missing role route.</td></tr><tr><td>Wrong Brand</td><td>Use the top Brand switch. Brand-scoped workflows cannot override it.</td></tr><tr><td>Wrong DMA</td><td>Change the DMA selector. Workflow pages must honor it.</td></tr><tr><td>Assign New estimate unavailable</td><td>Doom/shared registry is unavailable. Do not type or guess a new number.</td></tr><tr><td>Finance line looks like media spend</td><td>Stop and route media-buy spend to MediaNorm instead.</td></tr><tr><td>Source has useful data with no field</td><td>Preserve it in source extraction/provenance for later classification/export.</td></tr></table>`},

/* ===== PROFESSIONAL ROLE LANGUAGE + BOOK GUIDE LOCK ===== */
function mamProfessionalText(value){
 let out=String(value??'');
 if(pageName()==='registry')return out;
 const roleMap={Ops:'Operations',Creative:'Creative',Social:'Content & Social',Approval:'Approval',Events:'Events',Ethics:'Ethics',Merch:'Merch',Finance:'Finance / AP',Meta:'Meta',SEO:'SEO / Web','UTM Reporting':'UTM Reporting'};
 const fixed=[
  ['Emm Caban','Operations'],['Emm','Operations'],['Brandy Newton','Creative'],['Brandy','Creative'],['Michelle Diaz','Content & Social'],['Michelle','Content & Social'],['Jessica Flynn','Approval'],['Jessica','Approval'],['Hazel Wolf','Events'],['Hazel','Events'],['Jordan Fermin','Finance / AP'],['Jordan','Finance / AP'],['Rublee','Meta'],['Stephanie Walfield','Staffing agency contact'],['Stephanie','Staffing agency contact'],['Victoria Tuttle','Partner contact'],['Victoria','Partner contact'],['Events Dump','Imported activation source']
 ];
 const pairs=[];
 for(const x of (state.teamContacts||[])){if(x.name)pairs.push([x.name,roleMap[x.role]||x.role||'Role']);if(x.email)pairs.push([x.email,(roleMap[x.role]||x.role||'Role')+' route — see Contacts'])}
 for(const x of (state.contacts||[])){const repl=x.org?x.org+' contact':(x.role||'Partner contact');if(x.name)pairs.push([x.name,repl]);if(x.email)pairs.push([x.email,'See Contacts'])}
 for(const x of (state.staffingAgencies||[])){if(x.contact)pairs.push([x.contact,'Staffing agency contact']);if(x.email)pairs.push([x.email,'See Contacts'])}
 for(const [a,b] of [...pairs,...fixed].sort((u,v)=>String(v[0]).length-String(u[0]).length)){
  if(!a)continue;out=out.split(a).join(b)
 }
 return out.replace(/Michelle\s*\/\s*(Social|Content)/gi,'Content & Social').replace(/Events Dump/gi,'Imported activation source')
}

function mamScrubVisibleNames(){

async function mamChaseTicket(id){let t=state.tickets.find(x=>String(x.id)===String(id));if(!t||!t.sent||t.returnData)return;let c=mtRecord(t),rec=mtRecipient(t.type,c,t.brand,t.dma),to=rec?.email||t.to||'';if(!to){toast('Recipient route is missing');return}let subject=`Follow-up — ${t.subject||MAYHEM_TICKET_NAMES[t.type]||t.type}`,message=`Following up on the ${MAYHEM_TICKET_NAMES[t.type]||t.type} request for ${c.name}.\n\nDue back: ${t.due?fmtDate(t.due):'TBD'}\nStill needed: ${t.returnRequired||expectedReturn(t)}\n\nPlease reply with the outstanding return or updated timing.`;let standalone=location.protocol==='file:'||location.hostname==='127.0.0.1'||location.hostname==='localhost',sentLive=false;if(!standalone){try{let resp=await fetch('/api/send-traffic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,cc:roleContact('Ops',t.brand,t.dma)?.email||'',subject,message})});if(!resp.ok){toast('Mail service returned an error');return}sentLive=true}catch(e){toast('Could not reach mail service');return}}t.chaseCount=(t.chaseCount||0)+1;t.lastChased=osToday();t.history=t.history||[];t.history.push({date:t.lastChased,event:`Follow-up ${t.chaseCount} sent`,detail:`Return still due ${t.due||'TBD'}`});addEvidence(t.commit,'follow-up',`${t.type} return follow-up ${t.chaseCount} sent · due ${t.due?fmtDate(t.due):'TBD'}`);saveState();openTicket(id);toast(sentLive?'Follow-up sent':'QA follow-up stamped locally')}

function mamPaginateGuideChapters(chapters){let sig=mamGuidePaginationSig();if(window.__mamGuidePhysicalPages?.sig===sig)return window.__mamGuidePhysicalPages.pages;let host=document.createElement('div');host.className='mam-book-paper mam-book-measure';host.style.cssText='position:fixed;left:-12000px;top:0;width:420px;height:700px;visibility:hidden;pointer-events:none;z-index:-9999';host.innerHTML='<div class="mam-book-paper-inner"><div class="book-page-kicker"></div><h2></h2><div class="mam-book-page-body"></div><div class="mam-book-folio">MAYHEM & MARKETING</div></div>';document.body.appendChild(host);let body=host.querySelector('.mam-book-page-body'),h2=host.querySelector('h2'),kick=host.querySelector('.book-page-kicker'),pages=[];for(let ch of chapters){let parser=document.createElement('div');parser.innerHTML=ch.html||'';let nodes=[...parser.children],part=1,cur=[];let setup=()=>{h2.textContent=part===1?ch.title:`${ch.title} — Continued`;kick.textContent=part===1?(ch.kicker||''):`${ch.kicker||''} · CONTINUED`};let fits=html=>{setup();body.innerHTML=html;return body.scrollHeight<=Math.floor(body.clientHeight*.96)};let flush=()=>{if(!cur.length)return;pages.push({title:part===1?ch.title:`${ch.title} — Continued`,kicker:part===1?ch.kicker:`${ch.kicker||''} · CONTINUED`,html:cur.join('')});part++;cur=[]};for(let node of nodes){let html=node.outerHTML;if(fits(cur.join('')+html)){cur.push(html);continue}if(cur.length)flush();if(fits(html)){cur=[html];continue}let chunks=mamGuideSplitComplexNode(node,fits,ch.title,ch.kicker);for(let chunk of chunks){if(fits(cur.join('')+chunk))cur.push(chunk);else{flush();cur=[chunk]}}}flush()}host.remove();window.__mamGuidePhysicalPages={sig,pages};return pages}

/* ===== GUIDE PAGINATION LOCK: INTENTIONAL BOOK PAGES, NOT AUTO-FRAGMENTATION ===== */
/* Doom is authored as a finite set of book pages. Mayhem now follows that model:
   fixed 3:5 pages, no page-body scrolling, and deliberate continuation leaves only
   where a chapter genuinely needs them. */
function mamManualGuidePages(){
 const sourceCount=(state.sourceArchive||[]).length,factCount=(state.extractedFacts||[]).length;
 return [
  {title:'What Mayhem Is',kicker:'CHAPTER 01',html:`<p class="book-dek">The operating layer between a campaign idea and a closed, documented activation.</p><p>Mayhem is not another media-buy system and it is not a creative library. It is where campaign and event facts become structured work, where outside-owned asks are routed, where returns write back to the same record, and where the final operating history can be exported without rebuilding it from emails.</p><div class="book-grid four"><div><b>Mayhem</b><span>Campaigns/events, Intake, source extraction, tickets/returns, Content & Social, staffing, merch/activation work, campaign operating costs, landing pages, UTMs, results, reports and exports.</span></div><div><b>Doom</b><span>Creative, ISCIs, traffic history/status, and shared estimate-number availability/reservation.</span></div><div><b>MediaNorm</b><span>Media invoice and reconciliation truth, including TV, radio, OOH, streaming and digital media-buy spend.</span></div><div><b>Notion</b><span>Shared/external campaign record Mayhem pushes and upserts. It is not Mayhem’s primary database.</span></div></div>${mamGuideRule('Core operating rule','Extract first → classify second → display third → export anytime. Unknown stays unknown. Never invent URLs, DMA IDs, estimate sequences, contacts, tracking IDs, contract amounts or campaign costs.')}`},

  {title:'Navigation & Scope',kicker:'CHAPTER 02',html:`<p class="book-dek">Home is global. Operating work is scoped.</p><table class="book-table"><tr><th>Area</th><th>Scope</th><th>Rule</th></tr><tr><td><b>Home</b></td><td>ALL BRANDS · ALL DMAs</td><td>Global operating pulse. The selected DMA does not filter Home.</td></tr><tr><td><b>Brands</b></td><td>Brand + DMA</td><td>Shows the campaign/event book for the selected context.</td></tr><tr><td><b>Intake / Tickets / Results / Finance / Tracking</b></td><td>Brand + DMA + Campaign</td><td>The top context controls what you are editing or sending.</td></tr><tr><td><b>Updates & Reports</b></td><td>Selected Brand</td><td>Normal sends cannot cross the selected Brand.</td></tr><tr><td><b>All Brands Monthly Update</b></td><td>ALL BRANDS</td><td>Separate, deliberate cross-brand mode.</td></tr></table>${mamGuideRule('Fail-safe','If a screen offers a cross-brand choice while you are inside a Brand-scoped workflow, treat that as a bug. Scope should be inherited, not re-selected.')}`},

  {title:'Start a Campaign / Event',kicker:'CHAPTER 03',html:`<p class="book-dek">Create the record once; let the rest of the system reuse it.</p>${mamGuidePath('Brand → DMA → Intake → New Campaign / Event')}${mamGuideStep('1','Choose Brand and DMA','Set the operating context before creating the campaign/event.')}${mamGuideStep('2','Enter or source-fill the facts','Campaign/event name, type, dates, partner/vendor, location, channels and known cost context should come from the real source when available.')}${mamGuideStep('3','Record what the partner owes','Select contractual or expected benefits so Mayhem can chase proof later.')}${mamGuideStep('4','Record what operations needs','Select only the work required to execute the activation: creative, compliance, merch, web/tracking, staffing, Content & Social, Finance/AP, etc.')}`},
  {title:'Start a Campaign / Event — Continued',kicker:'CHAPTER 03 · CONTINUED',html:`${mamGuideStep('5','Choose estimate behavior','Use Existing, Assign New or Not Needed. Blank is not a decision.')}${mamGuideStep('6','Create the record','Mayhem creates the campaign, pushes/upserts Notion, and proposes outside-owned work.')}${mamGuideStep('7','Review proposed work before sending','Anything owned directly inside Mayhem should not become an outbound ticket.')}${mamGuideRule('Automatic deadline rule','Campaign Deadline → Storyline Deadline 7 days earlier → execution-ticket returns 3 days before Storyline (10 days before campaign). Moving the campaign deadline recalculates those dates.')}${mamGuideRule('Expected result','One campaign record that every ticket, return, cost, UTM, result and report can reference.')}`},

  {title:'Source-Assisted Intake',kicker:'CHAPTER 04',html:`<p class="book-dek">The source is evidence, not disposable prefill text.</p>${mamGuidePath('Intake → Use Source to Fill Form')}${mamGuideStep('1','Feed the source','Use an email, contract, workbook, Notion record, vendor note or other source instead of retyping known facts.')}${mamGuideStep('2','Preserve it','Mayhem retains the source/provenance so later exports can show where a fact came from.')}${mamGuideStep('3','Extract facts','Recognizable Brand, DMA, campaign, dates, partner/vendor, money, estimate and other structured facts are retained.')}`},
  {title:'Source-Assisted Intake — Continued',kicker:'CHAPTER 04 · CONTINUED',html:`${mamGuideStep('4','Confirm uncertainty','Mayhem can prefill; it does not guess. Missing stays missing until confirmed.')}${mamGuideStep('5','Keep facts that have no screen yet','A useful fact is retained even when the current UI does not have a dedicated field for it.')}${mamGuideRule('Data principle','“Not displayed today” does not mean “discarded.” That is what makes later export useful instead of another reconstruction project.')}${mamGuideRule('Source history','Preserved sources and extracted facts remain visible from the campaign Source & History panel and are available in audit exports.')}`},

  {title:'Estimate Numbers',kicker:'CHAPTER 05',html:`<p class="book-dek">One shared pool. Doom controls availability; Mayhem attaches the number to the campaign.</p><div class="book-grid three"><div><b>Use Existing</b><span>Select an estimate already available in Doom/shared registry. Source-provided numbers should still be validated.</span></div><div><b>Assign New</b><span>Doom/shared registry must reserve the number immediately. If that connection is unavailable, Mayhem does not invent a fallback.</span></div><div><b>Not Needed</b><span>Record the decision explicitly so a blank estimate does not look forgotten.</span></div></div>${mamGuideRule('Never','Do not use highest number + 1, a local Mayhem sequence, or a guessed number when Doom is unavailable.','warning')}<p>The validated estimate follows the campaign into cost lines, Finance/AP routing, Notion context and the MediaNorm bridge.</p>`},

  {title:'Tickets & Returns',kicker:'CHAPTER 06',html:`<p class="book-dek">A ticket is a request with a required return, not a task list.</p>${mamGuidePath('Campaign → Build Work / Tickets')}${mamGuideStep('1','Choose only outside-owned work','A ticket exists when another team, partner or vendor owes something.')}${mamGuideStep('2','Check the route','Routing comes from Contacts. A missing required email should block sending.')}${mamGuideStep('3','Check the ask','The request should contain only what the receiving role needs, plus due-back date and required return.')}`},
  {title:'Tickets & Returns — Continued',kicker:'CHAPTER 06 · CONTINUED',html:`${mamGuideStep('4','Send','Sending starts the loop. It does not complete the work.')}${mamGuideStep('5','Log the return','Capture the asset, approval, quote, status, proof, reference, date, link or note that came back.')}${mamGuideStep('6','Close only when satisfied','If changes are required, keep the same loop open instead of creating disconnected duplicate work.')}${mamGuideRule('Creative rule','Check Doom first. Reuse existing approved creative/ISCIs when eligible; create net-new Creative work only for what is actually missing.')}${mamGuideRule('Follow-up rule','Sent tickets remain open until the required return is logged and approved. If a return is late, use Chase Return; Mayhem stamps each follow-up in the ticket history.')}`},

  {title:'Staffing, Merch & Production',kicker:'CHAPTER 07',html:`<p class="book-dek">Operational costs should be created by the workflow that produced them.</p><h3>Staffing</h3>${mamGuidePath('Campaign → Build Work → Staffing')}${mamGuideStep('1','Select agency/vendor and staffing need','Campaign facts prefill. Choose headcount, roles and hours/shift using the quick controls.')}${mamGuideStep('2','Request estimate and availability','The first request is for availability, price and travel impact — not the roster.')}${mamGuideStep('3','Review the return','Available / Partial / Not available, estimate amount, travel status and support come back into the same campaign.')}${mamGuideStep('4','Approve the quote','Only an accepted quote becomes a committed Staffing cost line.')}`},
  {title:'Staffing, Merch & Production — Continued',kicker:'CHAPTER 07 · CONTINUED',html:`${mamGuideStep('5','Book and collect final details','After booking, collect roster/headcount confirmation and call time.')}<h3>Merch / Production</h3><p>Order totals, production charges and shipping should write into campaign costs when the vendor return confirms them. Do not retype Brand, DMA, campaign or estimate when the workflow already knows them.</p>${mamGuideRule('Cost rule','A quote is not committed spend until it is accepted. Accepted staffing, merch, production and shipping returns can become campaign cost lines automatically.')}`},

  {title:'Content & Social',kicker:'CHAPTER 08',html:`<p class="book-dek">One structured content plan; no parallel person-specific process.</p>${mamGuidePath('Campaign → Content & Results → Content Plan')}${mamGuideStep('1','Create the structured plan','Track content type, platform, status, due date, run/post date, approved asset or messaging source, CTA and destination.')}${mamGuideStep('2','Build / Email Brief','The brief is generated from the campaign and contains only the facts Content & Social needs to execute.')}${mamGuideStep('3','Track the live/scheduled link','Returned links stay with the content item instead of disappearing into email.')}${mamGuideStep('4','Collect metrics','Post-event/campaign metrics write into Results. Cumulative metrics use latest-snapshot behavior when appropriate.')}${mamGuideRule('Do not duplicate','Content & Social should not have a separate generic ticket system that competes with the Content Plan.')}`},

  {title:'Landing Pages, Tracking & UTMs',kicker:'CHAPTER 09',html:`<p class="book-dek">Mayhem owns the tracking record; Doom may provide creative/ISCI context.</p>${mamGuidePath('Campaign → Landing Pages & UTMs')}${mamGuideStep('1','Confirm the destination','Use an authoritative landing-page URL. Never infer one from Brand/market naming.')}${mamGuideStep('2','Confirm tracking readiness','Record required providers/events/IDs and the return/proof for setup work.')}${mamGuideStep('3','Build the UTM','Use Mayhem presets/patterns and campaign context. Include source, medium, campaign, content/ISCI and placement as applicable.')}`},
  {title:'Landing Pages, Tracking & UTMs — Continued',kicker:'CHAPTER 09 · CONTINUED',html:`${mamGuideStep('4','Save the full URL and history','Every generated UTM stays tied to Brand → DMA → Campaign/Event → Landing Page.')}${mamGuideStep('5','Push tracking context to Notion','Tracking changes remain part of the shared campaign record.')}${mamGuideStep('6','Report/export when required','Use the UTM report/export rather than rebuilding links from memory.')}${mamGuideRule('Ownership','Mayhem creates and retains UTMs. Doom can supply creative/ISCI context; it does not own the UTM record.')}`},

  {title:'Campaign Finance / AP',kicker:'CHAPTER 10',html:`<p class="book-dek">Campaign operating cost belongs here. Media-buy reconciliation does not.</p><div class="book-boundary"><div><b>YES — MAYHEM FINANCE</b><span>Base sponsorship/event fee · staffing · merch · production/printing · shipping · event/venue · travel · permits/fees · reimbursement · other activation operating costs.</span></div><div><b>NO — MEDIANORM</b><span>TV · radio · OOH · streaming · digital inventory/media-buy spend and invoices.</span></div></div>${mamGuideStep('1','Start with verified campaign cost','A verified sponsorship/event contract amount becomes the base cost line.')}${mamGuideStep('2','Let workflows feed additional cost','Accepted staffing, merch, production, shipping and similar returns create their own lines.')}`},
  {title:'Campaign Finance / AP — Continued',kicker:'CHAPTER 10 · CONTINUED',html:`${mamGuideStep('3','Review the rollup','Base Contract + Additional Costs = Total Committed. Final/actual is derived from cost lines and Finance outcomes, not a detached editable field.')}${mamGuideStep('4','Route AP','Send the specific unpaid line(s) to Finance / AP with estimate, due date, funding and support.')}${mamGuideStep('5','Log the Finance return','Paid / Scheduled / Needs information plus reference/confirmation and relevant date.')}${mamGuideRule('Boundary','Do not use Mayhem Finance to make the page look complete with media-buy dollars. Media-buy invoice/reconciliation truth stays in MediaNorm.')}`},

  {title:'Results & Closeout',kicker:'CHAPTER 11',html:`<p class="book-dek">The event date is an anchor, not the definition of done.</p>${mamGuidePath('Campaign → Content & Results → Closeout')}<div class="book-checklist"><span>☐ Partner/vendor reports received</span><span>☐ Attendance / impressions / results logged</span><span>☐ Partner obligations proofed or makegood opened</span><span>☐ Content & Social metrics received</span><span>☐ Live links / photo-video proof retained</span><span>☐ Campaign operating costs complete</span><span>☐ AP paid/scheduled/otherwise resolved</span><span>☐ Open tickets closed</span></div>${mamGuideRule('Closeout rule','The campaign stays open until the required returns are resolved. The event date passing by itself does not close the record.')}`},
  {title:'Results & Closeout — Continued',kicker:'CHAPTER 11 · CONTINUED',html:`${mamGuideRule('Live / day-of','The campaign timeline also carries a lightweight day-of readiness checklist: setup/access, staffing call time, merch/signage, tracking test, capture plan, partner live delivery and teardown/pickup.')}${mamGuideRule('Close / reuse','When partner delivery, results, metrics, tickets and campaign operating costs are resolved, Close Campaign snapshots the final record. Repeating work can be saved as a playbook; dates, costs, quantities, approvals and estimate never copy blindly.')}<p>Closing removes the campaign from active operating noise without deleting the record. A closed campaign can be reopened if new work or a makegood appears.</p>`},

  {title:'Reports & Exports',kicker:'CHAPTER 12',html:`<p class="book-dek">Use the structured record instead of rebuilding updates manually.</p><h3>Reports</h3><p>Normal Updates & Reports are locked to the Brand selected at the top. Switch the top Brand to work another Brand. All Brands Monthly Update is the one deliberate cross-brand reporting lane.</p><h3>Exports</h3><p>Exports use the full retained Mayhem record, including source-backed facts that may not have their own screen yet. Normal exports can be scoped to the current Brand; ALL BRANDS export should be intentional.</p>${mamGuideRule('Export principle','The export is the clean output of retained source facts, workflow returns and lifecycle state—not a second place to manually rebuild the campaign.')}`},
  {title:'Troubleshooting',kicker:'CHAPTER 12 · CONTINUED',html:`<p class="book-dek">When Mayhem blocks something, fix the source of the problem instead of bypassing the rule.</p><table class="book-table"><tr><th>Problem</th><th>What to do</th></tr><tr><td>Send is blocked</td><td>Open Contacts and fix the missing role route.</td></tr><tr><td>Wrong Brand</td><td>Use the top Brand switch. Brand-scoped workflows cannot override it.</td></tr><tr><td>Wrong DMA</td><td>Change the DMA selector. Workflow pages must honor it.</td></tr><tr><td>Assign New estimate unavailable</td><td>Doom/shared registry is unavailable. Do not type or guess a new number.</td></tr><tr><td>Finance line looks like media spend</td><td>Stop and route media-buy spend to MediaNorm instead.</td></tr><tr><td>Source has useful data with no field</td><td>Preserve it in source extraction/provenance for later classification/export.</td></tr></table>`},

  {title:'Live Configuration',kicker:'APPENDIX A',html:`<p class="book-dek">The manual stays role-based. Names, addresses and individual routing details are intentionally available only in Contacts.</p><h3>Brand / DMA roster</h3>${mamGuideMarkets()}<div class="book-live-stats"><span><b>${brands().length}</b> Brands</span><span><b>${brands().reduce((n,b)=>n+markets(b).length,0)}</b> DMAs</span></div>`},

/* ===== DOOM INTEGRATION + FINAL AUDIT FIXES (v1) =====
   Persistence host (localStorage + /api/db on the Doom deploy), remaining audit
   corrections applied idempotently, weekly Monday note, phone-clean view. */

(function mayhemDoomPersistence(){
 const KEY='mayhem-and-marketing-doom-v1';let timer=null;
 window.MAYHEM_HOST={saveState:function(st){
  try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
  clearTimeout(timer);
  timer=setTimeout(function(){
   try{
    if(location.protocol==='file:')return;
    fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection:'appData',doc:'mayhemState',action:'set',data:{data:st,ts:Date.now()}})}).catch(function(){});
   }catch(e){}
  },1200);
 }};
 try{const r=localStorage.getItem(KEY);if(r){const st=JSON.parse(r);if(st&&st.brands)state=st}}catch(e){}
 window.addEventListener('DOMContentLoaded',function(){
  try{
   if(location.protocol==='file:')return;
   fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection:'appData',doc:'mayhemState',action:'get'})}).then(function(r){return r.ok?r.json():null}).then(function(j){
    const remote=j&&j.data&&j.data.data?j.data.data:(j&&j.data&&j.data.brands?j.data:null);
    const rts=j&&j.data&&j.data.ts?j.data.ts:0;
    let lts=0;try{const loc=localStorage.getItem(KEY);lts=loc?(JSON.parse(loc)._savedTs||0):0}catch(e){}
    if(remote&&remote.brands&&rts>lts){state=remote;mayhemApplyAuditFixes();renderShell();renderPage()}
   }).catch(function(){});
  }catch(e){}
 });
})();

function mayhemFindByName(re){for(const b in state.brands)for(const d in state.brands[b].markets){const c=state.brands[b].markets[d].commitments.find(x=>re.test(x.name));if(c)return {c,b,d}}return null}
function mayhemApplyAuditFixes(){
 if(state._auditFixesV1)return;
 /* 2 — Star Tribune $42,020 belongs in PROPOSED (Notion CSV; proposal, no decision) */
 (function(){const hit=mayhemFindByName(/star tribune/i);if(hit&&hit.c.money){hit.c.money.proposed=42020;if(!/42,?020/.test(hit.c.meta||''))hit.c.meta=((hit.c.meta||'')+' · Recommended package $42,020 — proposed, no decision').trim()}})();
 /* 3 — Irish Fest discrepancy flag reinstated */
 (function(){const hit=mayhemFindByName(/irish fest/i);if(hit&&!/12,?500 vs/.test(hit.c.meta||'')){hit.c.meta=((hit.c.meta||'')+' · CONFIRM LEVEL: cost $12,500 vs note “Friend of the Fest $15,000”').trim();try{mamAddExtractedFact&&mamSourceFact&&mamSourceFact('pl-irishfest-discrepancy','Postman Law','Minneapolis',hit.c.id,'Discrepancy','Sponsorship level',' $12,500 cost vs $15,000 note — confirm','Campaign / Activation','Notion Master Tracker · exported 2026-08-25')}catch(e){}}})();
 /* 5 — OKC Public Schools tracker row becomes a record with its [Confirm] gap */
 (function(){
  const okc=state.brands['Parrish DeVaughn']&&state.brands['Parrish DeVaughn'].markets['Oklahoma City'];
  if(okc&&!okc.commitments.some(c=>/public schools/i.test(c.name))){
   okc.commitments.push({id:'pdv-okc-public-schools',kind:'Community',name:'OKC Public Schools — Teacher Giveaways',state:'Needs Details',anchor:'',endDate:'',sourceTiming:'Historically annual — timing [Confirm]',meta:'Tracker row is [Confirm] across the board — teacher giveaways historically; confirm merch details.',money:{proposed:'TBD',contracted:'TBD',final:'TBD',estimate:''},source:'PDV_Sponsorship_Tracker.xlsx · Sponsorships'});
  }
 })();
 /* 6 — Riverfest payment packet names the real payee */
 (function(){
  (state.payments||[]).forEach(function(p){if(/riverfest/i.test(p.commit||'')&&p.vendor==='Event partner')p.vendor='WEBN / iHeartMedia'});
  (state.costLines||[]).forEach(function(x){if(/riverfest/i.test(x.record||x.commit||'')&&x.vendor==='Event partner')x.vendor='WEBN / iHeartMedia'});
 })();
 /* 4 — day-one source-dated work: key dates + proposed tickets */
 (function(){
  const catches=mayhemFindByName(/catches for college/i);
  if(catches){
   try{mamAddKeyDate(catches.c,'2026-09-09','Landing page due','Fw: Catches for College — source email')}catch(e){}
   if(!(state.tickets||[]).some(t=>t.commit===catches.c.id&&t.type==='SEO'))
    state.tickets.push({id:'tk-catches-lp',brand:catches.b,dma:catches.d,commit:catches.c.id,type:'SEO',ask:'Build Catches for College landing page',ownerRole:'SEO',owner:'SEO / Web',to:'',sent:'',due:'2026-09-09',protects:'Season-long campaign launch',status:'Draft',notes:'',returnRequired:'Live landing page URL + tracking confirmation',subject:'Landing page — Catches for College (due Sep 9)',body:'Catches for College (Keches Law · Boston) needs its landing page live by Sep 9 per the source email. Please return the live URL and tracking confirmation.'});
  }
  ['Oklahoma City','Tulsa'].forEach(function(d){
   const mk=state.brands['Parrish DeVaughn']&&state.brands['Parrish DeVaughn'].markets[d];if(!mk)return;
   const c=mk.commitments.find(x=>/teacher giveaway/i.test(x.name));if(!c)return;
   try{mamAddKeyDate(c,'2026-09-07','Entry video due','PDV_Sponsorship_Tracker.xlsx');mamAddKeyDate(c,'2026-09-14','Entries close','PDV_Sponsorship_Tracker.xlsx')}catch(e){}
   if(d==='Oklahoma City'&&!(state.tickets||[]).some(t=>t.commit===c.id&&t.type==='Social'))
    state.tickets.push({id:'tk-teacher-video',brand:'Parrish DeVaughn',dma:d,commit:c.id,type:'Social',ask:'Entry video + giveaway promotion',ownerRole:'Social',owner:'Content & Social',to:'',sent:'',due:'2026-09-07',protects:'Entries close Sep 14',status:'Draft',notes:'',returnRequired:'Posted entry video link + promotion confirmation',subject:'Teacher Giveaway — entry video due Sep 7',body:'The Teacher Giveaway entry video is due Sep 7; entries close Sep 14 per the tracker. Please return the posted video link and promotion confirmation.'});
  });
 })();
 state._auditFixesV1=true;
 try{state._savedTs=Date.now()}catch(e){}
 saveState();
}

/* ===== Weekly Monday note + phone view (injected on Updates & Reports) ===== */
function mayhemWeeklyNoteBody(){
 const today=new Date().toISOString().slice(0,10);
 function plus(n){const x=new Date(today+'T00:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
 const in7=plus(7),in14=plus(14);
 const due=(state.tickets||[]).filter(t=>t.status!=='Closed'&&t.due&&t.due<=in7);
 const hard=allCommitments().filter(c=>c.anchor&&c.anchor>=today&&c.anchor<=in14);
 const pays=(state.payments||[]).filter(p=>p.status!=='Paid'&&p.due&&p.due<=in14);
 const lines=['Monday note — Marketing Operations','',
  `Due back this week (${due.length}):`,
  ...due.map(t=>`  ${t.type} — ${t.ask} · due ${fmtDate(t.due)} · needed for ${t.protects||'—'}`),
  '',`Hard dates inside 14 days (${hard.length}):`,
  ...hard.map(c=>`  ${fmtDate(c.anchor)} — ${c.name} (${c.brand} · ${c.dma})`),
  '',`Payments due (${pays.length}):`,
  ...pays.map(p=>`  ${fmtDate(p.due)} — ${p.vendor} ${moneyFmt(p.amount)}`)];
 return lines.join('\n');
}
function mayhemPreviewWeeklyNote(){const body=mayhemWeeklyNoteBody();modal('Weekly Monday note — preview','Generated from the whole book · nothing sends without you',`<div class="emailbox"><div class="emailhead"><div class="lab">To</div><div>Operations</div><div class="lab">Subject</div><div>Monday note — the week ahead</div></div><div class="emailbody">${esc(body).replaceAll('\n','<br>')}</div></div>`)}
function mayhemPhoneView(){
 const month=new Date().toISOString().slice(0,7);
 let html=`<div style="position:fixed;inset:0;z-index:700;background:#fff;color:#111;overflow:auto;font-family:-apple-system,'Segoe UI',sans-serif" id="mayhemPhoneView"><div style="max-width:430px;margin:0 auto;padding:20px 16px 60px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-weight:700;font-size:15px;letter-spacing:.4px">OPERATING SCHEDULE</div><button onclick="document.getElementById('mayhemPhoneView').remove()" style="border:1px solid #111;background:#fff;color:#111;padding:6px 14px;font-size:13px;cursor:pointer">Close</button></div><div style="font-size:12px;color:#555;margin:4px 0 14px">Plain on purpose. Brand → DMA → what runs.</div>`;
 for(const b of brands()){
  let block='';
  for(const d of markets(b)){
   const rows=state.brands[b].markets[d].commitments.filter(c=>(c.anchor&&c.anchor.slice(0,7)>=month)||/confirmed|in flight|in progress|needs/i.test(String(c.state)));
   if(!rows.length)continue;
   block+=`<div style="font-size:12px;color:#555;margin:8px 0 2px">${esc(d)}</div>`+rows.map(c=>`<div style="border-top:1px solid #e5e5e5;padding:8px 0"><div style="font-size:14px;font-weight:600">${esc(c.name)}</div><div style="font-size:12.5px;color:#333">${esc(mamDisplayTiming(c))} · ${esc(String(c.kind||''))}${typeof c.money?.final==='number'?' · '+moneyFmt(c.money.final):''} · ${esc(String(c.state||''))}</div></div>`).join('');
  }
  if(block)html+=`<div style="margin-top:18px"><div style="font-size:13px;font-weight:700;border-bottom:2px solid #111;padding-bottom:4px">${esc(b).toUpperCase()}</div>${block}</div>`;
 }
 html+='</div></div>';
 document.body.insertAdjacentHTML('beforeend',html);
}
