
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atticor Doom &amp; Deliverables</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body,#R{height:100%;font-family:'DM Sans',sans-serif;font-size:14px;background:transparent}
#R{background:transparent !important}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}::-webkit-scrollbar-track{background:#0f172a}
@keyframes pulse{0%,100%{transform:translateX(-100%)}50%{transform:translateX(200%)}}
table,button,select,input,textarea{font-family:'DM Sans',sans-serif}
.leaflet-container{font-family:'DM Sans',sans-serif;border-radius:9px}

/* === DARK THEME === */
#dd-loader, #dd-loader>div{background:transparent !important;border:none !important;box-shadow:none !important}
#R>div:not(#dd-loader)>div:last-child{background:#0f172a !important;color:#e2e8f0 !important}
#R>div>div:last-child div[style*="background: rgb(255, 255, 255)"],
#R>div>div:last-child div[style*="background:#fff"],
#R>div>div:last-child div[style*="background: white"]{background:#1e293b !important;border-color:#334155 !important;color:#e2e8f0 !important}
h1,h2,h3,h4{color:#f1f5f9 !important}
td{color:#cbd5e1 !important;border-color:#1e293b !important}
th{background:#1e293b !important;color:#94a3b8 !important;border-color:#334155 !important}
input,select,textarea{background:#0f172a !important;color:#e2e8f0 !important;border-color:#334155 !important}
label{color:#94a3b8 !important}
button{border-color:#334155 !important}
tr:nth-child(even) td{background:rgba(30,41,59,.3)}
tr:nth-child(odd) td{background:rgba(15,23,42,.3)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-fade{animation:fadeIn .25s ease-out}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.kpi-ticker{display:flex;gap:40px;animation:tickerScroll 30s linear infinite;white-space:nowrap}
.kpi-ticker:hover{animation-play-state:paused}
@keyframes sparkPulse{0%,100%{opacity:.7}50%{opacity:1}}
</style></head><body style="background:linear-gradient(160deg,#0f172a 0%,#1a1040 50%,#0f172a 100%)"><div id="R"><div id="dd-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'DM Sans',Arial,sans-serif">
<div style="text-align:center">
<div style="width:88px;height:88px;border-radius:18px;background:#0f172a;border:2px solid #7c3aed;display:inline-flex;align-items:center;justify-content:center;position:relative;margin-bottom:28px">
<div class="glow-ring"></div>
<div class="glow-ambient"></div>
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" style="position:relative;z-index:2">
<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" fill="url(#gcomb)"/>
<defs><linearGradient id="gcomb" x1="12" y1="3" x2="12" y2="22"><stop stop-color="#e9d5ff"/><stop offset=".35" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
</svg>
</div>
<div class="doom-title" style="font-size:30px;font-weight:800;letter-spacing:3px;overflow:hidden">
<span class="doom-letter dl" style="--d:0s">D</span><span class="doom-letter dl" style="--d:.07s">O</span><span class="doom-letter dl" style="--d:.14s">O</span><span class="doom-letter dl" style="--d:.21s">M</span><span class="doom-amp" style="animation:letterDrop .4s ease-out .35s both">&amp;</span><span class="doom-letter dd" style="--d:.49s">D</span><span class="doom-letter dd" style="--d:.55s">E</span><span class="doom-letter dd" style="--d:.61s">L</span><span class="doom-letter dd" style="--d:.67s">I</span><span class="doom-letter dd" style="--d:.73s">V</span><span class="doom-letter dd" style="--d:.79s">E</span><span class="doom-letter dd" style="--d:.85s">R</span><span class="doom-letter dd" style="--d:.91s">A</span><span class="doom-letter dd" style="--d:.97s">B</span><span class="doom-letter dd" style="--d:1.03s">L</span><span class="doom-letter dd" style="--d:1.09s">E</span><span class="doom-letter dd" style="--d:1.15s">S</span>
</div>
<div style="font-size:11px;color:#a78bfa;letter-spacing:3px;font-weight:600;margin-top:6px;animation:fadeUp .5s ease-out 1.4s both">ATTICOR MEDIA</div>
<div style="width:200px;height:4px;background:#1e293b;border-radius:4px;overflow:hidden;margin:28px auto 0"><div style="height:100%;width:30%;background:linear-gradient(90deg,#7c3aed,#a78bfa,#7c3aed);border-radius:4px;animation:ldbar 1.5s ease-in-out infinite"></div></div>
<div id="dd-status" style="margin-top:18px;font-size:14px;color:#a78bfa;font-style:italic;max-width:320px;margin-left:auto;margin-right:auto;animation:fadeUp .5s ease-out 1.8s both;opacity:0"></div>
<div id="dd-login-form" style="display:none;margin-top:20px;animation:fadeUp .4s ease-out both">
  <input type="password" id="dd-pw" placeholder="Password" style="width:100%;padding:14px 18px;border-radius:10px;border:2px solid #334155;background:#1e293b;color:#e2e8f0;font-size:16px;text-align:center;outline:none;margin-bottom:14px;letter-spacing:2px;font-family:'DM Sans',sans-serif"/>
  <button id="dd-login-btn" style="width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 16px rgba(124,58,237,.3);font-family:'DM Sans',sans-serif">Let Me In</button>
  <div id="dd-login-error" style="display:none;margin-top:10px;font-size:13px;color:#f87171;font-weight:600"></div>
</div>
<div id="dd-loading-bar" style="display:none;width:200px;height:4px;background:#1e293b;border-radius:4px;overflow:hidden;margin:28px auto 0"><div style="height:100%;width:30%;background:linear-gradient(90deg,#7c3aed,#a78bfa,#7c3aed);border-radius:4px;animation:ldbar 1.5s ease-in-out infinite"></div></div>
</div>
</div>
<style>
.glow-ring{position:absolute;inset:-4px;border-radius:22px;z-index:0;background:conic-gradient(from 0deg,transparent,#7c3aed,#a78bfa,#7c3aed,transparent);opacity:.6;animation:spin 4s linear infinite}
.glow-ring::after{content:'';position:absolute;inset:3px;border-radius:18px;background:#0f172a}
.glow-ambient{position:absolute;width:120px;height:120px;border-radius:50%;z-index:0;background:radial-gradient(circle,rgba(124,58,237,.35) 0%,rgba(124,58,237,.12) 40%,transparent 70%);animation:breathe 3s ease-in-out infinite}
.doom-letter{display:inline-block;animation:letterDrop .4s ease-out var(--d,.0s) both}
.doom-letter.dl{color:#7c3aed;text-shadow:0 0 20px rgba(124,58,237,.5),0 0 40px rgba(124,58,237,.2)}
.doom-letter.dd{color:#a78bfa;text-shadow:0 0 15px rgba(167,139,250,.4)}
.doom-amp{display:inline-block;color:#475569;font-weight:400;margin:0 6px;animation:letterDrop .4s ease-out .35s both}
.doom-title{animation:nflick 4s ease-in-out 1.5s infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}
@keyframes letterDrop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes nflick{
0%{filter:brightness(1)}
4%{filter:brightness(.4)}
6%{filter:brightness(1.2)}
8%{filter:brightness(.5)}
10%{filter:brightness(1)}
50%{filter:brightness(1)}
52%{filter:brightness(.35)}
53.5%{filter:brightness(1.1)}
80%{filter:brightness(1)}
82%{filter:brightness(.3)}
83%{filter:brightness(.6)}
84%{filter:brightness(.35)}
86%{filter:brightness(1.15)}
100%{filter:brightness(1)}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes ldbar{0%{width:10%;margin-left:0}50%{width:40%;margin-left:30%}100%{width:10%;margin-left:90%}}
</style>
<script>
(function(){
  var quips=["Reassembling this… try not to make it worse.","Putting everything back where it belongs… one second.","Untangling your decisions… almost there.","Running it through again. It'll behave.","Lining this up properly… because someone has to.","I'll take it from here.","Hold on. I'm fixing something.","Almost… don't touch anything.","One sec. Making this presentable."];
  var loginQuips=["You again.","Let's get this over with.","Password. Now.","I was wondering when you'd show up.","Fine. Come in."];
  var wrongQuips=["Wrong. Try again.","That's not it.","Nope.","I don't think so.","Really?"];
  var pick=function(a){return a[Math.floor(Math.random()*a.length)]};

  var status=document.getElementById("dd-status");
  var loginForm=document.getElementById("dd-login-form");
  var loadingBar=document.getElementById("dd-loading-bar");
  var pwInput=document.getElementById("dd-pw");
  var loginBtn=document.getElementById("dd-login-btn");
  var loginError=document.getElementById("dd-login-error");

  function showStatus(msg){status.textContent=msg;status.style.opacity="1"}
  function showLogin(){
    showStatus(pick(loginQuips));
    loginForm.style.display="block";
    loadingBar.style.display="none";
    pwInput.focus();
  }
  function showLoading(){
    loginForm.style.display="none";
    showStatus(pick(quips));
    loadingBar.style.display="block";
    // Cycle quips while loading
    var qi=setInterval(function(){status.style.transition="opacity .3s";status.style.opacity="0";setTimeout(function(){status.textContent=pick(quips);status.style.opacity="1"},400)},4000);
    window._quipInterval=qi;
  }

  function loadScript(src,type){
    return new Promise(function(resolve,reject){
      var s=document.createElement("script");
      if(type)s.type=type;
      s.src=src;
      s.onload=resolve;
      s.onerror=function(){reject(new Error("Failed to load "+src))};
      document.body.appendChild(s);
    });
  }

  function loadApp(){
    showLoading();
    sessionStorage.setItem("dd_auth","1");

    // CDN libraries (public, but loaded after auth so page stays light)
    var cdnLibs=[
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js",
      "https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js",
      "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js",
      "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js",
      "https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js",
      "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    ];

    // Source data files (protected by middleware)
    var dataFiles=[
      "data-isci.js","data-est-sta-cal.js","data-postings.js","data-postings-new.js",
      "data-pop-images.js","data-pl-panels.js","data-logos.js","data-ooh-cal.js",
      "data-traffic-history.js","data-ooh-contracts.js","data-pop-photos.js"
    ];

    // Load CDN libs sequentially (some depend on prior ones)
    var chain=Promise.resolve();
    cdnLibs.forEach(function(src){chain=chain.then(function(){return loadScript(src)})});

    chain.then(function(){
      // Init pdf.js worker + Firebase
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      window.db=null;window.storage=null;
      window._firebaseReady=fetch("/api/config").then(function(r){return r.json()}).then(function(cfg){
        firebase.initializeApp(cfg);
        window.db=firebase.firestore();
        window.storage=firebase.storage();
        console.log("Firebase initialized");
      }).catch(function(e){console.error("Firebase init failed:",e)});

      // Load all data files in parallel
      return Promise.all(dataFiles.map(function(f){return loadScript(f)}));
    }).then(function(){
      // Add Babel-transpiled source files
      var c=document.createElement("script");c.type="text/babel";c.src="config.js";c.setAttribute("data-type","module");document.body.appendChild(c);
      var a=document.createElement("script");a.type="text/babel";a.src="app.js";a.setAttribute("data-type","module");document.body.appendChild(a);
      // Trigger Babel to transform and execute
      Babel.transformScriptTags();
    }).catch(function(e){
      console.error("App load failed:",e);
      showStatus("Failed to load. Try refreshing.");
      loadingBar.style.display="none";
    });
  }

  function doLogin(){
    var pw=pwInput.value;
    if(!pw)return;
    loginBtn.disabled=true;loginBtn.textContent="Checking...";
    loginError.style.display="none";
    fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw,type:"login"})})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.success){loadApp()}
        else{loginBtn.disabled=false;loginBtn.textContent="Let Me In";pwInput.value="";loginError.textContent=pick(wrongQuips);loginError.style.display="block";pwInput.focus()}
      }).catch(function(){loginBtn.disabled=false;loginBtn.textContent="Let Me In";loginError.textContent="Connection error. Try again.";loginError.style.display="block"});
  }

  loginBtn.addEventListener("click",doLogin);
  pwInput.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});

  // On load: check if already authenticated
  showStatus("connecting...");
  fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"check"})})
    .then(function(r){return r.json()})
    .then(function(d){if(d.authenticated){loadApp()}else{showLogin()}})
    .catch(function(){showLogin()});
})();
</script></div>
</body></html>
