    <div id="dd-roster" style="display:flex;flex-direction:column;gap:8px;margin-bottom:6px"></div>
    <div id="dd-pinbox" style="display:none">
      <div id="dd-who" style="font-size:14px;color:#C4A0C8;font-weight:700;margin-bottom:8px;font-family:'DM Sans',sans-serif"></div>
      <div id="dd-pin-hint" style="display:none;font-size:12px;color:#9B8EAD;margin-bottom:8px;font-family:'DM Sans',sans-serif">First time in — create a PIN (4–8 digits). You'll use it from now on.</div>
      <input type="password" inputmode="numeric" id="dd-pin" placeholder="PIN" style="width:100%;padding:14px 18px;border-radius:10px;border:2px solid rgba(155,123,176,.3);background:rgba(30,18,51,.5);color:#E8DFF0;font-size:16px;text-align:center;outline:none;margin-bottom:10px;letter-spacing:6px;font-family:'DM Sans',sans-serif;backdrop-filter:blur(8px)"/>
      <input type="password" inputmode="numeric" id="dd-pin2" placeholder="Confirm PIN" style="display:none;width:100%;padding:14px 18px;border-radius:10px;border:2px solid rgba(155,123,176,.3);background:rgba(30,18,51,.5);color:#E8DFF0;font-size:16px;text-align:center;outline:none;margin-bottom:10px;letter-spacing:6px;font-family:'DM Sans',sans-serif;backdrop-filter:blur(8px)"/>
      <button id="dd-login-btn" style="width:100%;padding:14px;border-radius:10px;border:none !important;background:linear-gradient(135deg,#9b7bb0,#C4A0C8);color:#fff;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 16px rgba(155,123,176,.3);font-family:'DM Sans',sans-serif">Let Me In</button>
    </div>
    <button id="dd-back" style="width:100%;margin-top:10px;padding:8px;border-radius:8px;border:1px solid rgba(155,123,176,.3);background:transparent;color:#9B8EAD;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">← Back</button>
  </div>
  <div id="dd-login-error" style="display:none;margin-top:10px;font-size:13px;color:#f87171;font-weight:600"></div>
</div>
</div>
</div>
<script>
(function(){
  var quips=["I'm a damsel… I'm in distress… I can handle this. Give me a second.","People always do stupid things. Like refreshing too early.","Patience is a virtue. Not one of mine, but still.","Working on it. Not that you'd appreciate the effort.","Rearranging your mess. You're welcome.","Hold on, Wonderboy. Almost there.","I didn't sign up for this. And yet, here I am.","Don't rush me. I've dealt with worse than you.","Reloading your chaos. Try to look grateful.","Loading your questionable choices.","I've seen hydras easier to manage than this.","One second. Some of us actually do the work around here.","Ugh, fine. One moment.","You'd think after all this, things would just… work.","Pretending I enjoy this. Give me a sec."];
  var loginQuips=["Oh wonderful. You're back.","State your business, Wonderboy.","Let me guess — you forgot it again.","I was having such a nice time without you.","You've got about 10 seconds before I lose interest.","Well? I haven't got all day.","Oh great, it's you.","Don't make this weird. Just type the password.","The door doesn't open itself, hero.","*sigh* What's the password."];
  var wrongQuips=["Wrong. Shocking.","That's not it. Try using your brain.","Nope. Were you even trying?","Really? That was your best guess?","Swing and a miss, Wonderboy.","Not even close. I'm embarrassed for you.","Have you tried… the actual password?","At this rate, the sun will set before you get in.","You know, most people get this on the first try.","I'm not even going to dignify that with a real response."];
  var pick=function(a){return a[Math.floor(Math.random()*a.length)]};

  var status=document.getElementById("dd-status");
  var bar=document.getElementById("dd-bar");
  var loginForm=document.getElementById("dd-login-form");
  var stage1=document.getElementById("dd-stage1");
  var stage2=document.getElementById("dd-stage2");
  var pwInput=document.getElementById("dd-pw");
  var continueBtn=document.getElementById("dd-continue");
  var rosterBox=document.getElementById("dd-roster");
  var pinBox=document.getElementById("dd-pinbox");
  var whoEl=document.getElementById("dd-who");
  var pinHint=document.getElementById("dd-pin-hint");
  var pinInput=document.getElementById("dd-pin");
  var pin2Input=document.getElementById("dd-pin2");
  var loginBtn=document.getElementById("dd-login-btn");
  var backBtn=document.getElementById("dd-back");
  var loginError=document.getElementById("dd-login-error");
  var appPw="",selName="",selNew=false;
  var quipInterval=null;

  function showStatus(msg){status.textContent=msg;status.style.opacity="1"}

  function startQuipCycle(){
    if(quipInterval)clearInterval(quipInterval);
    quipInterval=setInterval(function(){
      status.style.transition="opacity .3s";status.style.opacity="0";
      setTimeout(function(){status.textContent=pick(quips);status.style.opacity="1"},350);
    },3500);
  }

  function stopQuipCycle(){if(quipInterval){clearInterval(quipInterval);quipInterval=null}}

  function showLogin(){
    stopQuipCycle();
    showStatus(pick(loginQuips));
    loginForm.style.display="block";
    stage1.style.display="block";stage2.style.display="none";
    bar.style.display="none";
    pwInput.focus();
  }

  function showLoading(){
    loginForm.style.display="none";
    loginError.style.display="none";
    showStatus(pick(quips));
    bar.style.display="block";
    startQuipCycle();
  }

  function loadScript(src,type,integrity){
    return new Promise(function(resolve,reject){
      var s=document.createElement("script");
      if(type)s.type=type;
      s.src=src;
      if(integrity){s.integrity=integrity;s.crossOrigin="anonymous"}
      s.onload=resolve;
      s.onerror=function(){reject(new Error("Failed to load "+src))};
      document.body.appendChild(s);
    });
  }

  function loadApp(){
    showLoading();
    sessionStorage.setItem("dd_auth","1");

    // CDN libraries (public, but loaded after auth so page stays light).
    // React + ReactDOM are loaded later as ESM via the import map so Framer
    // Motion shares the same React instance. See the framer-ready step below.
    var cdnLibs=[
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js",
      "https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js",
      "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js",
      "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js",
      "https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js",
      "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js",
      "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
    ];

    // Source data files (protected by middleware)
    var dataFiles=[
      "data-isci.js","data-est-sta-cal.js","data-postings.js","data-postings-new.js","data-ooh-coords-new.js","data-ooh-renewal-dates.js",
      "data-pop-images.js","data-pl-panels.js","data-logos.js","data-ooh-cal.js",
      "data-traffic-history.js","data-ooh-contracts.js","data-lr-contracts.js","data-lr-panels.js","data-pop-photos.js","data-pop-titles.js","data-lr-pops.js","data-lr-specs.js","data-lr-mythbusters.js",
      "data-legacy-vault.js","data-wk-aug-drafts.js","data-pdv-panels.js","data-pdv-specs.js","data-ke-contracts.js","data-ke-panels.js","data-ke-vault.js"
    ];

    // Load CDN libs sequentially (some depend on prior ones)
    var chain=Promise.resolve();
    cdnLibs.forEach(function(src){chain=chain.then(function(){return loadScript(src)})});

    chain.then(function(){
      // Init pdf.js worker + database (Firestore or Supabase shim)
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      window.db=null;window.storage=null;window.fbAuth=null;
      window._firebaseReady=fetch("/api/config").then(function(r){return r.json()}).then(function(cfg){
        if(cfg.useSupabase){
          // Supabase mode: load both shims so window.db (via /api/db) and
          // window.storage (via /api/storage) have the same .collection()/
          // .ref() shape the app was built against. Firebase SDKs are
          // still loaded above for legacy auth custom-token fallback, but
          // neither Firestore nor Firebase Storage is touched.
          //
          // Legacy file URLs already saved in ISCI records still point at
          // firebasestorage.googleapis.com — they remain valid static
          // URLs (rendered in <video>/<a href>) as long as the old
          // Firebase project keeps the bucket alive. New uploads land in
          // Supabase. To re-host the old files, run the bulk creative
          // re-upload flow in the ISCI Registry.
          return Promise.all([
            loadScript("/supabase-shim.js"),
            loadScript("/supabase-storage-shim.js"),
          ]).then(function(){
            window.db=window.__supabaseDb;
            window.storage=window.__supabaseStorage;
            try{firebase.initializeApp(cfg);try{window.fbAuth=firebase.auth()}catch(e){}}catch(e){console.warn("Firebase auth init skipped:",e)}
            console.log("Supabase mode active — db is /api/db, storage is /api/storage");
          });
        }
        firebase.initializeApp(cfg);
        window.db=firebase.firestore();
        window.storage=firebase.storage();
        // firebase.auth() is only used after /api/auth returns a custom token.
        // Loading the SDK here costs nothing if it never gets used.
        try{window.fbAuth=firebase.auth()}catch(e){console.warn("firebase.auth unavailable:",e)}
        console.log("Firebase initialized");
      }).catch(function(e){console.error("DB init failed:",e)});

      // Load all data files in parallel — cache-bust per load so seed updates
      // (e.g. reinstated ISCIs/estimates) reach the browser without a hard refresh.
      return Promise.all(dataFiles.map(function(f){return loadScript(f+"?v="+Date.now())}));
    }).then(function(){
      // Load React + ReactDOM + Framer Motion as ESM in a single module so
      // they share one React instance (via the importmap above). Then expose
      // React/ReactDOM as globals for the Babel-transpiled Source files.
      return new Promise(function(resolve,reject){
        var fm=document.createElement("script");
        fm.type="module";
        fm.textContent=[
          'import React from "react";',
          'import * as ReactDOM from "react-dom";',
          'import { createRoot } from "react-dom/client";',
          'import { motion, AnimatePresence, useAnimation, useInView } from "framer-motion";',
          'import { App as MegaraLibrary, ThemeContext as MegaraThemeContext } from "/library-ui.js?v='+Date.now()+'";',
          'window.React = React;',
          'window.ReactDOM = Object.assign({}, (ReactDOM.default || ReactDOM), { createRoot: createRoot });',
          'window.FramerMotion = { motion: motion, AnimatePresence: AnimatePresence, useAnimation: useAnimation, useInView: useInView };',
          'window.MegaraLibrary = MegaraLibrary;',
          'window.MegaraThemeContext = MegaraThemeContext;',
          'window.dispatchEvent(new Event("framer-ready"));'
        ].join("\n");
        document.body.appendChild(fm);
        window.addEventListener("framer-ready",function(){console.log("React + Framer Motion loaded (ESM)");resolve()},{once:true});
        setTimeout(function(){if(!window.React||!window.FramerMotion)reject(new Error("React / Framer Motion failed to load from esm.sh"))},15000);
      });
    }).then(function(){
      // Tailwind is precompiled to /tailwind.css — no runtime config needed.
      // Add Babel-transpiled source files. Cache-bust via ?v= query. Use a
      // per-load timestamp so EVERY load fetches the latest app.js/config.js —
      // a fixed token meant deploys served stale cached code until a manual
      // hard-refresh.
      var __V=Date.now();
      var c=document.createElement("script");c.type="text/babel";c.src="config.js?v="+__V;c.setAttribute("data-type","module");document.body.appendChild(c);
      var a=document.createElement("script");a.type="text/babel";a.src="app.js?v="+__V;a.setAttribute("data-type","module");document.body.appendChild(a);
      // Trigger Babel to transform and execute
      Babel.transformScriptTags();
      stopQuipCycle();
    }).catch(function(e){
      console.error("App load failed:",e);
      stopQuipCycle();
      showStatus("Failed to load. Try refreshing.");
      bar.style.display="none";
    });
  }

  function err(msg){loginError.textContent=msg;loginError.style.display="block"}
  function roleTag(r){return r==="owner"?"Owner":r==="admin"?"Admin":"Member"}

  // Stage 1 → 2: verify the App Password, then show the name picker.
  function doContinue(){
    var pw=pwInput.value;
    if(!pw)return;
    continueBtn.disabled=true;continueBtn.textContent="Checking...";
    loginError.style.display="none";
    fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw,type:"roster"})})
      .then(function(r){return r.json()})
      .then(function(d){
        continueBtn.disabled=false;continueBtn.textContent="Continue";
        if(d&&d.ok){appPw=pw;buildRoster(d.users||[]);stage1.style.display="none";stage2.style.display="block"}
        else{pwInput.value="";err(pick(wrongQuips));pwInput.focus()}
      }).catch(function(){continueBtn.disabled=false;continueBtn.textContent="Continue";err("Connection error. Try again.")});
  }

  function buildRoster(users){
    rosterBox.innerHTML="";
    if(!users.length){var n=document.createElement("div");n.style.cssText="color:#9B8EAD;font-size:13px;font-family:'DM Sans',sans-serif";n.textContent="No people set up yet. The owner adds people in Team.";rosterBox.appendChild(n);return}
    users.forEach(function(u){
      var b=document.createElement("button");
      b.style.cssText="display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(155,123,176,.3);background:rgba(30,18,51,.5);color:#E8DFF0;font-size:15px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif";
      b.innerHTML='<span>'+u.name+(u.title?' <span style="font-size:11px;font-weight:600;color:#9B8EAD">'+u.title+'</span>':'')+'</span><span style="font-size:11px;font-weight:600;color:#9B8EAD">'+roleTag(u.role)+(u.hasPin?'':' · set PIN')+'</span>';
      b.addEventListener("click",function(){selectName(u)});
      rosterBox.appendChild(b);
    });
    pinBox.style.display="none";
  }

  function selectName(u){
    selName=u.name;selNew=!u.hasPin;
    whoEl.textContent=u.name+" — "+roleTag(u.role);
    pinHint.style.display=selNew?"block":"none";
    pin2Input.style.display=selNew?"block":"none";
    pinInput.value="";pin2Input.value="";
    pinInput.placeholder=selNew?"Create a PIN":"PIN";
    loginBtn.textContent=selNew?"Create PIN & Enter":"Let Me In";
    rosterBox.style.display="none";pinBox.style.display="block";
    loginError.style.display="none";
    pinInput.focus();
  }

  function doLogin(){
    var pin=(pinInput.value||"").trim();
    if(!/^[0-9]{4,8}$/.test(pin)){err("PIN must be 4–8 digits");return}
    if(selNew&&pin!==(pin2Input.value||"").trim()){err("PINs don't match");return}
    loginBtn.disabled=true;loginBtn.textContent="Checking...";
    loginError.style.display="none";
    fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:appPw,name:selName,pin:pin,type:"login"})})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.success){
          try{if(d.user)sessionStorage.setItem("dd_user",d.user);sessionStorage.setItem("dd_role",d.role||"member")}catch(e){}
          if(d.customToken){window.__pendingCustomToken=d.customToken}
          loadApp();
        }
        else{loginBtn.disabled=false;loginBtn.textContent=selNew?"Create PIN & Enter":"Let Me In";pinInput.value="";pin2Input.value="";err(selNew?"Couldn't set that PIN — it may be taken. Try another.":pick(wrongQuips));pinInput.focus()}
      }).catch(function(){loginBtn.disabled=false;loginBtn.textContent=selNew?"Create PIN & Enter":"Let Me In";err("Connection error. Try again.")});
  }

  function goBack(){pinBox.style.display="none";rosterBox.style.display="flex";loginError.style.display="none"}

  continueBtn.addEventListener("click",doContinue);
  pwInput.addEventListener("keydown",function(e){if(e.key==="Enter")doContinue()});
  loginBtn.addEventListener("click",doLogin);
  pinInput.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
  pin2Input.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()});
  backBtn.addEventListener("click",goBack);

  // On load: show quips while checking auth
  showStatus(pick(quips));
  startQuipCycle();
  // Vendor confirmation portal: anyone with a ?confirm=... URL goes straight
  // into the app — the per-station token in the URL is the auth for vendors,
  // validated client-side by the portal and (after Phase D) server-side by
  // /api/confirm. Skipping the auth check here is what stops vendors from
  // hitting the staff password prompt.
  //
  // Also detect ?confirm= in the hash fragment (e.g. /#?confirm=...) for
  // URLs that were generated while a staff member was sitting on a hash-
  // routed page like #ooh/wk. App.js's confirm-URL parser falls back to the
  // hash too.
  if(/[?&]confirm=/.test(window.location.search)||/[?&]confirm=/.test(window.location.hash)){
    // Browsers strip the #fragment from Referer headers, so middleware can't
    // see ?confirm= when it lives in a hash. Set a short-lived cookie that
    // middleware also accepts as a vendor-portal hint, so the script chain
    // and /api/config load on hash-style URLs too.
    document.cookie="dd_vendor=1; path=/; max-age=600; SameSite=Strict";
    loadApp();
  } else {
    fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"check"})})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.authenticated){try{if(d.user)sessionStorage.setItem("dd_user",d.user);sessionStorage.setItem("dd_role",d.role||"member")}catch(e){}if(d.customToken){window.__pendingCustomToken=d.customToken}loadApp()}
        else{showLogin()}
      })
      .catch(function(){showLogin()});
  }
})();
</script></div>
</body></html>
